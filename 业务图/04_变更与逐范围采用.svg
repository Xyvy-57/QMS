<text x="95.00" y="191.24" font-family="Heiti SC,STHeiti,Arial Unicode MS,sans-serif" font-size="34" font-weight="400" fill="#526879" textLength="1190.00" lengthAdjust="spacingAndGlyphs">跨版映射、影响评估、采用决定和实施验证分开；旧事实及已签发报告不回写。</text>
