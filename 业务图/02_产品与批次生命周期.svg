<text x="390.00" y="2776.66" font-family="Heiti SC,STHeiti,Arial Unicode MS,sans-serif" font-size="31" font-weight="400" fill="#18364B" textLength="1147.00" lengthAdjust="spacingAndGlyphs">异常可在任何质量控制点触发；下排能力按需要关联，不按方框先后串成强制流程。</text>
<text x="110.00" y="2970.10" font-family="Heiti SC,STHeiti,Arial Unicode MS,sans-serif" font-size="35" font-weight="400" fill="#18364B" textLength="2949.00" lengthAdjust="spacingAndGlyphs">普通实测不自动整批接受，只证明被检样本与项目；计数批接受须有明确方案。质量问题按需要进入NCR/CAPA/8D并反馈技术标准与方案的新修订。场景维护不是BPM，不新增自定义场景或</text>
<text x="110.00" y="3015.10" font-family="Heiti SC,STHeiti,Arial Unicode MS,sans-serif" font-size="35" font-weight="400" fill="#18364B" textLength="175.00" lengthAdjust="spacingAndGlyphs">动态菜单。</text>
<text x="110.00" y="3188.38" font-family="Heiti SC,STHeiti,Arial Unicode MS,sans-serif" font-size="33" font-weight="400" fill="#18364B" textLength="1287.00" lengthAdjust="spacingAndGlyphs">量具、文件、培训按需提供准备并持续保障；工程开发分期不是本图中的质量生命周期。</text>
</svg>