<text x="1376.00" y="522.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">明确量具、零件与操作者</text>
<text x="1376.00" y="591.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">平衡交叉重复测量矩阵</text>
