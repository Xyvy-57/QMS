<text x="2576.00" y="384.00" fill="#087F8C" font-family="Heiti SC, sans-serif" font-weight="700" font-size="60" dominant-baseline="text-before-edge">同一 BFF / OIDC 会话</text>
<text x="2576.00" y="472.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">CSRF与当前身份</text>
<text x="2576.00" y="541.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">任务 / 轮次 / 版本上下文</text>
