<text x="140.00" y="80.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="700" font-size="82" dominant-baseline="text-before-edge">16  技术组件与事务</text>
<text x="144.00" y="205.00" fill="#526A7B" font-family="Heiti SC, sans-serif" font-weight="400" font-size="48" dominant-baseline="text-before-edge">一套业务契约、一份实测事实账；当前核心独立运行，外部系统按需集成。</text>
