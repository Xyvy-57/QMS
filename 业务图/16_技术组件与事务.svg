<text x="1376.00" y="472.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">气泡 / 方案 / 表图实测</text>
<text x="1376.00" y="541.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">原生交互，统一业务契约</text>
