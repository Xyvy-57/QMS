<text x="176.00" y="384.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="700" font-size="60" dominant-baseline="text-before-edge">React 业务界面</text>
<text x="176.00" y="472.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">检验任务 / 范围 / 报告</text>
<text x="176.00" y="541.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="400" font-size="52" dominant-baseline="text-before-edge">正常入口，多单并行</text>
