<text x="140.00" y="80.00" fill="#17354C" font-family="Heiti SC, sans-serif" font-weight="700" font-size="82" dominant-baseline="text-before-edge">08  NCR当前处置与CAPA长期改进</text>
<text x="144.00" y="205.00" fill="#526A7B" font-family="Heiti SC, sans-serif" font-weight="400" font-size="48" dominant-baseline="text-before-edge">本次处置、长期有效性和各项Hold分别管理；CAPA可在NCR尚未关闭时启动。</text>
