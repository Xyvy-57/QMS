  <text x="60" y="690" font-size="15" font-weight="bold">技术要求</text>
  <g font-size="13"><text x="72" y="715">1. 调质处理 HB 220~250。</text><text x="72" y="738">2. 未注公差按 GB/T 1804-m。</text><text x="72" y="761">3. 去毛刺，锐边倒钝。</text><text x="72" y="784">4. 轴颈 Ø30h6 为关键特性(CTQ)。</text></g>

