:root {

.pp-page { min-width: 0; color: var(--pp-ink); }
.pp-page button:focus-visible, .pp-page input:focus-visible, .pp-page select:focus-visible, .pp-page textarea:focus-visible, .pp-canvas:focus-visible { outline: 2px solid var(--pp-blue); outline-offset: 3px; }
.pp-page .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }

.pp-tabs-note { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; padding-bottom: 14px; color: var(--pp-muted); }
.pp-workspace { display: grid; grid-template-columns: 210px minmax(0, 1fr) 265px; min-height: 570px; height: calc(100vh - 238px); max-height: 850px; border: 1px solid var(--pp-border); border-radius: 13px; background: var(--pp-surface); overflow: hidden; }
.pp-plan-list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--pp-border); }

.pp-list-heading .button { padding: 6px; min-height: 27px; }
.pp-list-search { margin: 0 14px 14px; display: flex; gap: 8px; align-items: center; border: 1px solid var(--pp-border); border-radius: 7px; padding: 8px 10px; color: var(--pp-muted); }
.pp-list-search input { width: 100%; min-width: 0; border: none; font-size: 11px; padding: 0; background: none; outline-offset: 5px; color: var(--pp-ink); }

.pp-plan { width: 100%; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--pp-ink); text-align: left; padding: 13px 10px; margin-bottom: 6px; cursor: pointer; transition: background-color .16s ease, border-color .16s ease; }
.pp-plan:hover { background: var(--pp-soft); }
.pp-plan.active { background: var(--pp-blue-soft); border-color: var(--pp-blue-border); }
.pp-plan strong { display: block; font-size: 12px; font-weight: 560; line-height: 1.6; margin-bottom: 9px; }

.pp-list-empty { padding: 30px 8px; text-align: center; font-size: 12px; color: var(--pp-muted); }
.pp-editor { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.pp-editor-head { display: flex; gap: 10px; padding: 20px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--pp-border); min-height: 81px; }
.pp-plan-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pp-plan-title h3 { font-size: 14px; }
.pp-plan-title p { margin: 5px 0 0; color: var(--pp-muted); font-size: 10px; }
.pp-plan-glyph { width: 35px; height: 35px; background: var(--pp-blue-soft); border-radius: 9px; display: grid; place-items: center; color: var(--pp-blue); flex: none; }
.pp-editor-head .button { padding: 7px; min-height: 31px; }
.pp-editor-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 17px; min-height: 54px; border-bottom: 1px solid var(--pp-border); }
.pp-editor-toolbar > span { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pp-standard-name { font-size: 11px; color: var(--pp-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-editor-toolbar .button { font-size: 11px; padding: 7px 6px; min-height: 30px; }
.pp-canvas { flex: 1; overflow: auto; min-height: 300px; background-color: var(--pp-soft); background-image: radial-gradient(var(--pp-dot) .8px, transparent .8px); background-size: 16px 16px; }
.pp-graph { position: relative; }
.pp-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.pp-edges > path { fill: none; stroke: var(--pp-line); stroke-width: 1.5; }
.pp-edges > path.selected { stroke: var(--pp-blue); }
.pp-edges .pp-arrow { fill: none; stroke: var(--pp-line); stroke-width: 1; }
.pp-node { position: absolute; inset: 0 auto auto 0; width: 210px; height: 116px; padding: 14px; border: 1px solid var(--pp-border); border-radius: 10px; text-align: left; background: var(--pp-surface); color: var(--pp-ink); cursor: pointer; box-shadow: var(--pp-shadow); transition: border-color .16s ease, box-shadow .16s ease; }
.pp-node:hover { border-color: var(--pp-blue-border); }
.pp-node.is-selected { border-color: var(--pp-blue); box-shadow: var(--pp-selected-shadow); }
.pp-node-top { display: flex; align-items: center; gap: 7px; color: var(--pp-muted); font-size: 9px; }
.pp-node-top > svg { margin-left: auto; width: 14px; height: 14px; }
.pp-node-number { background: var(--pp-soft); color: var(--pp-muted); width: 22px; height: 20px; display: grid; place-items: center; border-radius: 5px; font-size: 10px; }
.pp-node.is-selected .pp-node-number { background: var(--pp-blue-soft); color: var(--pp-blue); }
.pp-node > strong { display: block; margin-top: 11px; font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pp-node-bottom { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 13px; color: var(--pp-muted); font-size: 10px; }
.pp-node-bottom > span:first-child { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 82px; }
.pp-node-bottom > span:last-child { white-space: nowrap; }
.pp-node-sep { padding: 0 4px; color: var(--pp-line); }
.pp-editor-foot { padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; color: var(--pp-muted); font-size: 10px; border-top: 1px solid var(--pp-border); }
.pp-editor-foot > span:last-child { display: flex; gap: 5px; align-items: center; }
.pp-editor-foot svg { width: 13px; height: 13px; }
.pp-canvas-empty { flex: 1; min-height: 390px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
.pp-empty-icon { margin-bottom: 18px; color: var(--pp-blue); }
.pp-empty-icon svg { height: 32px; width: 32px; }
.pp-canvas-empty h3 { font-size: 17px; }
.pp-canvas-empty p { font-size: 12px; color: var(--pp-muted); line-height: 1.9; margin: 13px 0 23px; }
.pp-inspector { border-left: 1px solid var(--pp-border); display: flex; flex-direction: column; min-height: 0; background: var(--pp-surface); }
.pp-inspector-head { padding: 20px 17px; border-bottom: 1px solid var(--pp-border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pp-inspector-head small { font-size: 10px; color: var(--pp-muted); display: block; margin-bottom: 8px; }
.pp-inspector-head h3 { font-size: 13px; }
.pp-inspector-head .button { padding: 6px; min-height: 27px; }
.pp-inspector-body { overflow-y: auto; flex: 1; padding: 19px 17px; }
.pp-inspector-body .field { display: block; margin-bottom: 17px; }
.pp-inspector-body .field > span { display: block; font-size: 11px; margin-bottom: 8px; }
.pp-inspector-body .input { width: 100%; min-height: 34px; border-radius: 6px; font-size: 11px; padding: 8px 10px; }
.pp-section-label { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin: 21px 0 8px; padding-top: 19px; border-top: 1px solid var(--pp-border); }
.pp-section-label > span:last-child { color: var(--pp-muted); font-size: 10px; }
.pp-helper { font-size: 11px; line-height: 1.8; color: var(--pp-muted); margin: 8px 0 12px; }
.pp-check-list { display: flex; flex-direction: column; gap: 4px; }
.pp-check-row { display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer; font-size: 11px; line-height: 1.6; }
.pp-check-row input { width: 14px; height: 14px; margin: 0; accent-color: var(--pp-blue); flex: none; cursor: pointer; }
.pp-check-row > span { min-width: 0; }
.pp-check-row small { color: var(--pp-muted); display: block; font-size: 10px; }
.pp-check-row > small { margin-left: auto; font-size: 9px; }
.pp-check-row.is-disabled { color: var(--pp-muted); cursor: default; }
.pp-check-row.is-disabled input { cursor: default; }
.pp-items { gap: 10px; }
.pp-item-bubble { flex: none; border: 1px solid var(--pp-blue-border); color: var(--pp-blue); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; }
.pp-inspector-footer { padding: 10px 16px; border-top: 1px solid var(--pp-border); }
.pp-danger { color: var(--pp-red) !important; font-size: 11px !important; }
.pp-inspector-empty { text-align: center; padding: 60px 24px; color: var(--pp-muted); }
.pp-inspector-empty h3 { margin: 18px 0 8px; }
.pp-inspector-empty p { font-size: 11px; line-height: 1.9; }
.pp-library .panel-head { padding: 23px; display: flex; justify-content: space-between; align-items: center; }
.pp-library .panel-head p { font-size: 12px; margin: 8px 0 0; }
.pp-library .toolbar { padding: 14px 23px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid var(--pp-border); }
.pp-library .toolbar > span { font-size: 11px; }
.pp-search { display: flex; align-items: center; gap: 8px; color: var(--pp-muted); width: 340px; }
.pp-search input { font-size: 12px; width: 100%; }
.pp-cell-sub { display: block; color: var(--pp-muted); font-size: 10px; margin-top: 6px; }
.pp-description { max-width: 330px; font-size: 12px; line-height: 1.8; }
.pp-library td strong { font-size: 12px; font-weight: 550; }
.pp-library td .button { font-size: 11px; padding: 5px 8px; min-height: 28px; }
.pp-span { grid-column: 1 / -1; }
.pp-step-picker { max-height: 365px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

.pp-step-option input { accent-color: var(--pp-blue); }
.pp-step-option strong { font-size: 13px; font-weight: 550; }
.pp-step-option small { display: block; font-size: 11px; color: var(--pp-muted); margin-top: 6px; }
.pp-after-option { margin-top: 18px; }
.pp-modal-summary { padding: 15px; margin-bottom: 22px; border: 1px solid var(--pp-border); background: var(--pp-soft); border-radius: 8px; display: flex; align-items: center; gap: 12px; color: var(--pp-blue); }

.pp-modal-summary p { font-size: 11px; color: var(--pp-muted); margin: 6px 0 0; }

/* Inspection workbench: tables, evidence and a fixed report are distinct surfaces. */
:root{--inspection-ink:#182128;--inspection-muted:#657078;--inspection-line:#e6e9eb;--inspection-paper:#fff;--inspection-soft:#f7f8f9;--inspection-blue:#2864e8;--inspection-blue-soft:#edf3ff;--inspection-green:#237853;--inspection-green-soft:#eff8f2;--inspection-red:#ba3d45;--inspection-red-soft:#fff1f2;--inspection-amber:#a56b13;--inspection-amber-soft:#fff7e8;--inspection-shadow:0 1px 3px #18212806;}
.inspection-context{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,.7fr);gap:20px;padding:18px 22px;margin:0 0 22px;background:var(--inspection-paper);border:1px solid var(--inspection-line);border-radius:12px;}
.inspection-context>span,.inspection-report-meta>span{display:flex;flex-direction:column;gap:6px;min-width:0;}
.inspection-context small,.inspection-report-meta small{color:var(--inspection-muted);font-size:12px;}
.inspection-context strong{font-size:13px;font-weight:550;overflow-wrap:anywhere;}
.inspection-back{border:0;background:transparent;color:var(--inspection-muted);padding:0;display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;margin-bottom:10px;}
.inspection-back:hover{color:var(--inspection-blue);}
.inspection-scenario-tabs{margin-bottom:18px;overflow-x:auto;white-space:nowrap;}
.inspection-scenario-tabs .tab{display:flex;align-items:center;gap:8px;}
.inspection-scenario-tabs .tab span{background:var(--inspection-soft);padding:1px 6px;border-radius:4px;font-size:11px;color:var(--inspection-muted);}
.inspection-search{display:flex;align-items:center;gap:9px;min-width:0;flex:1;max-width:380px;color:var(--inspection-muted);}
.inspection-search input{min-width:0;width:100%;}
.inspection-text-link{border:0;padding:0;background:transparent;color:var(--inspection-ink);font-weight:600;cursor:pointer;text-align:left;}
.inspection-text-link:hover{color:var(--inspection-blue);}
.inspection-subline{display:block;color:var(--inspection-muted);font-size:11px;line-height:1.6;margin-top:4px;font-weight:400;}

.inspection-progress{display:flex;flex-direction:column;gap:8px;max-width:140px;font-size:12px;}

.inspection-progress progress::-webkit-progress-bar,.inspection-stats progress::-webkit-progress-bar{background:var(--inspection-line);border-radius:4px;}
.inspection-progress progress::-webkit-progress-value,.inspection-stats progress::-webkit-progress-value{background:var(--inspection-blue);border-radius:4px;}
.inspection-progress progress::-moz-progress-bar,.inspection-stats progress::-moz-progress-bar{background:var(--inspection-blue);border-radius:4px;}
.inspection-rounds{display:flex;align-items:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;}
.inspection-rounds>.muted{font-size:12px;margin-right:4px;}
.inspection-round{border:1px solid var(--inspection-line);background:var(--inspection-paper);padding:8px 11px;border-radius:8px;display:flex;gap:8px;align-items:center;color:var(--inspection-ink);font-size:12px;cursor:pointer;transition:background-color .18s ease,border-color .18s ease;}

<script>/* Worlder QMS local demonstration domain model. No network or device connection. */
(function (root) {
  'use strict';
  const STORAGE_KEY = 'worlder-qms-local-v1';
  const SCENARIOS = ['IQC', 'FIRST', 'IPQC', 'FQC', 'OQC'];
  // This seed-only bitmap visibly reads “DEMO SIGN”; it is never used for user signatures.
  const DEMO_SIGNATURE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABGCAIAAAD5Bz6qAAABUElEQVR42u3cMQ6DMAxAUQ7Ezs797wQnQCKKrTjJ++pUVdAav6VUPR5JQzuMQIJQglAShBKEkiCUIJQEoQShJAglCCVBKEEoCUIJQkkQShBKglCCUNKCCM/rbnpEHefrmH/O1fr6ns9VbeZRc46aT8b1ghBCCCGEEEIIIYQQQgjHLETP66OG27OIlZej2vEzrnsGWgghhBBCCCGEEEIIIYRwX4QZz0NY83pBCCGEEEIIIYQQQgghhOsgzLj5OzvC1llVvo6t563wAwkIIYQQQgghhBBCCCGEcO4vZrLfT7XlGHXzfbc5Q2g5IIQQQgghhNByQAghhBBCCKHlgBBCCCGEEELLASGE/uhppzlHzQdCCCGEEEIIIYQQQgghnBuhJAglCCVBKEEoQSgJQglCSRBKEEqCUIJQEoQShJIglCCUBKEEoSQIJQglQShBKCm1F60IjhiAMpyZAAAAAElFTkSuQmCC';
  const db = {};
  let serial = 0;
  const clone = value => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  const now = () => new Date().toISOString();
  const uid = prefix => `${prefix || 'ID'}-${Date.now().toString(36)}-${(++serial).toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  const empty = value => value === null || value === undefined || (typeof value === 'string' && value.trim() === '');
  const RESERVED_IDS = new Set(['__proto__', 'constructor', 'prototype']);
  const validId = value => typeof value === 'string' && value.length > 0 && value.length <= 128 && value === value.trim() && !/[\u0000-\u001f\u007f]/.test(value) && !RESERVED_IDS.has(value);
  function assertId(value, label) {
    if (!validId(value)) throw new Error(`${label || '对象'}编号必须是 1–128 字符的非空字符串，且不能使用保留名称。`);
  }
  function dictionary(source) {
    const result = Object.create(null);
    if (source && typeof source === 'object') Object.entries(source).forEach(([key, value]) => { result[key] = value; });
    return result;
  }
  function validateStandardIds(standard) {
    if (!standard || typeof standard !== 'object') throw new Error('检验标准不存在。');
    assertId(standard.id, '标准');
    assertId(standard.drawingId, '图纸');
    if (!Array.isArray(standard.items)) throw new Error('检验标准的项目必须为列表。');
    standard.items.forEach(item => { if (!item || typeof item !== 'object') throw new Error('检验项目无效。'); assertId(item.id, '检验项目'); });
    if (new Set(standard.items.map(item => item.id)).size !== standard.items.length) throw new Error('检验项目编号不能重复。');
  }

  // Parse decimals as scaled integers. Inclusive specification boundaries never use floats.
  function decimal(value) {
    if (typeof value !== 'string' && typeof value !== 'number') return null;
    const input = String(value).trim();
    if (input.length > 400) return null;
    const match = /^([+-]?)(?:(\d+)(?:\.(\d*))?|\.(\d+))(?:[eE]([+-]?\d+))?$/.exec(input);
    if (!match) return null;
    const fraction = match[3] || match[4] || '';
    const exponent = Number(match[5] || 0);
    if (!Number.isSafeInteger(exponent) || Math.abs(exponent) > 308) return null;
    let scale = fraction.length - exponent;
    let integer = BigInt((match[1] === '-' ? '-' : '') + (match[2] || '0') + fraction);
    if (scale < 0) { integer *= 10n ** BigInt(-scale); scale = 0; }
    return { integer, scale };
  }
  function compare(a, b) {
    const scale = Math.max(a.scale, b.scale);
    const x = a.integer * 10n ** BigInt(scale - a.scale);
    const y = b.integer * 10n ** BigInt(scale - b.scale);
    return x < y ? -1 : x > y ? 1 : 0;
  }
  function evaluate(item, value) {
    if (empty(value)) return 'pending';
    if (!item || !['number', 'attribute'].includes(item.kind)) return 'invalid';
    if (item.kind === 'attribute') {
      const text = String(value).trim().toLowerCase();
      if (['合格', 'pass', 'ok', '符合', 'true'].includes(text)) return 'pass';
      if (['不合格', 'ng', 'fail', '不符合', 'false'].includes(text)) return 'ng';
      return 'invalid';
    }
    const number = decimal(value);
    const lower = empty(item.lower) ? null : decimal(item.lower);
    const upper = empty(item.upper) ? null : decimal(item.upper);
    if (!number || (!empty(item.lower) && !lower) || (!empty(item.upper) && !upper) || (!lower && !upper)) return 'invalid';
    if (lower && upper && compare(lower, upper) > 0) return 'invalid';
    if ((lower && compare(number, lower) < 0) || (upper && compare(number, upper) > 0)) return 'ng';
    return 'pass';
  }
  function getTask(id) { return db.tasks.find(task => task.id === id); }
  function getRound(task) { return task && task.rounds.find(round => round.id === task.activeRoundId); }
  function technical(task, round) {
    round = round || getRound(task);
    const summary = { status: 'pending', total: 0, filled: 0, valid: 0, pending: 0, pass: 0, ng: 0, invalid: 0, progress: 0, items: [] };
    if (!task || !round) return summary;
    const defaultCount = Number.isInteger(round.sampleCount) && round.sampleCount > 0 ? round.sampleCount : 3;
    const specifications = task.standardSnapshot && task.standardSnapshot.items || [];
    summary.items = specifications.map(item => {
      const requestedCount = round.itemSampleCounts && round.itemSampleCounts[item.id];
      const count = Number.isSafeInteger(requestedCount) && requestedCount > 0 ? requestedCount : defaultCount;
      const stored = round.measurements && round.measurements[item.id] || [];
      const values = Array.from({ length: count }, (_, index) => stored[index] ?? '');
      const results = values.map(value => evaluate(item, value));
      results.forEach(result => { summary.total++; summary[result]++; });
      const status = results.includes('invalid') ? 'invalid' : results.includes('ng') ? 'ng' : results.includes('pending') ? 'pending' : 'pass';
      return { item, itemId: item.id, status, sampleCount: count, values, results };
    });
    summary.filled = summary.total - summary.pending;
    summary.valid = summary.pass + summary.ng;
    summary.progress = summary.total ? Math.round(summary.valid / summary.total * 100) : 0;
    summary.status = summary.invalid ? 'invalid' : summary.ng ? 'ng' : summary.pending || !summary.total ? 'pending' : 'pass';
    summary.itemCount = summary.items.length;
    summary.completedItems = summary.items.filter(item => item.results.every(result => result === 'pass' || result === 'ng')).length;
    return summary;
  }
  function log(action, targetId, detail) {
    db.activity.unshift({ id: uid('LOG'), action, targetId, detail, createdAt: now(), source: '本地演示' });
    if (db.activity.length > 250) db.activity.length = 250;
  }
  function save() {
    db.tasks.forEach(task => { task.progress = technical(task).progress; });
    db.updatedAt = now();
    try {
      if (!root.localStorage) throw new Error('当前环境无法使用本地存储，修改仅保留在当前页面。');
      root.localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      if (root.QMS) root.QMS.lastSaveError = null;

      QMS.save(); UI.close(); repaint(); notify('标准工序已保存。');
    });
  }
  function addNode() {
    const steps = db().steps || [];
    if (!steps.length) { notify('请先在标准工序库中创建工序。'); state.tab = 'library'; repaint(); return; }
    const current = state.draft.nodes.find(n => n.id === state.nodeId);
    modal('从工序库添加', `<div class="pp-step-picker">${steps.map((s, i) => `<label class="pp-step-option"><input type="radio" name="pp-step-choice" value="${esc(s.id)}" ${i === 0 ? 'checked' : ''}><span><strong>${esc(s.name)}</strong><small>${esc(s.role)} / ${esc(stepType(s.type))}</small></span></label>`).join('')}</div>${current ? `<label class="pp-check-row pp-after-option"><input type="checkbox" id="pp-after-current" checked><span>接在「${esc(current.name)}」之后</span></label>` : ''}<p class="pp-helper">添加后可独立配置节点，不会修改工序库原件。</p>`, '添加到流程', () => {
      const selected = document.querySelector('input[name="pp-step-choice"]:checked');
      const step = steps.find(s => s.id === selected?.value);
      if (!step) throw new Error('请选择一道工序。');
      const node = { id: uid('node'), stepId: step.id, name: step.name, role: step.role, itemIds: [], sampleCount: 1 };
      state.draft.nodes.push(node);
      if (current && document.getElementById('pp-after-current')?.checked) state.draft.edges.push({ source: current.id, target: node.id });
      state.nodeId = node.id; changed(); UI.close(); repaint();
    });
  }
  function removeNode() {
    const node = state.draft.nodes.find(n => n.id === state.nodeId); if (!node) return;
    modal('删除当前节点', `<p>将从当前流程移除「${esc(node.name)}」及其依赖连线。</p><p class="muted">工序库中的原件和已生成的批次任务不受影响。</p>`, '删除节点', () => {
      state.draft.nodes = state.draft.nodes.filter(n => n.id !== node.id);
      state.draft.edges = state.draft.edges.filter(e => e.source !== node.id && e.target !== node.id);
      state.nodeId = state.draft.nodes[0]?.id || null; changed(); UI.close(); repaint();
    });
  }
  function copyNode() {
    const source = state.draft.nodes.find(n => n.id === state.nodeId); if (!source) return;
    const node = clone(source); node.id = uid('node'); node.name += ' 副本';
    state.draft.nodes.push(node);
    state.draft.edges.filter(e => e.target === source.id).forEach(e => state.draft.edges.push({ source: e.source, target: node.id }));
    state.nodeId = node.id; changed(); repaint(); notify('已复制节点与前置依赖。');
  }
  function planSettings() {
    const p = state.draft;
    modal('方案设置', `<div class="form-grid">${formField('方案名称', `<input class="input" id="pp-plan-name" maxlength="80" value="${esc(p.name)}">`, true)}${formField('检验场景', `<select class="select" id="pp-plan-scenario">${options(Object.entries(scenarios), p.scenario)}</select>`)}${formField('关联检验标准', `<select class="select" id="pp-plan-standard"><option value="">请选择标准</option>${options(db().standards.map(s => [s.id, `${s.name} / v${s.revision || 1}`]), p.standardId)}</select>`)}<p class="pp-helper pp-span">更换标准后，原有特性关联将被清空，请重新配置每道工序的检验范围。</p></div>`, '更新方案', () => {
      const name = document.getElementById('pp-plan-name').value.trim(), standardId = document.getElementById('pp-plan-standard').value;
      if (!name) throw new Error('请填写方案名称。');
      if (standardId !== p.standardId) p.nodes.forEach(n => { n.itemIds = []; });
      p.name = name; p.standardId = standardId; p.scenario = document.getElementById('pp-plan-scenario').value;
      changed(); UI.close(); repaint();
    });
  }
  function createTask() {
    if (state.dirty || !published(state.draft)) { notify('请先发布当前修改，再创建批次任务。'); return; }
    const p = state.draft;
    modal('创建批次检验任务', `<div class="pp-modal-summary">${icon('git-branch')}<div><strong>${esc(p.name)}</strong><p>${esc(scenarios[p.scenario] || p.scenario)} / v${esc(revision(p))} / ${p.nodes.length} 道工序</p></div></div><div class="form-grid">${formField('生产批次', '<input class="input" id="pp-task-batch" required maxlength="60" placeholder="例如：LOT-20261116-01">', true)}${formField('批次数量', '<input class="input" type="number" id="pp-task-quantity" min="1" max="1000000" step="1" value="100">')}${formField('检验人员', '<input class="input" id="pp-task-inspector" maxlength="40" placeholder="填写检验员姓名">')}<label class="pp-check-row pp-span"><input type="checkbox" id="pp-task-review"><span>本任务需要审核员签名</span></label></div><p class="pp-helper">创建时冻结当前方案和标准，后续模板修订不会改变本批次任务。</p>`, '创建并开始检验', () => {
      const batch = document.getElementById('pp-task-batch').value.trim(), inspector = document.getElementById('pp-task-inspector').value.trim(), quantity = Number(document.getElementById('pp-task-quantity').value);
      if (!batch || !inspector) throw new Error('请填写生产批次和检验人员。');
      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 1000000) throw new Error('批次数量需为 1–1,000,000 的整数。');
      const task = QMS.createTask({ standardId: p.standardId, scenario: p.scenario, batch, quantity, planId: p.id, inspector, reviewRequired: document.getElementById('pp-task-review').checked });
      UI.close(); App.go('inspection', { taskId: task.id }); notify('批次任务已创建。');
    });
  }
  function bind() {
    const root = document.getElementById('page'); if (!root) return;
    root.onclick = event => {
      const target = event.target.closest('[data-proc-action]'); if (!target) return;
      const action = target.dataset.procAction, id = target.dataset.id;
      safeAction(() => {
        if (action === 'tab-plans' || action === 'tab-library') { state.tab = action === 'tab-plans' ? 'plans' : 'library'; repaint(); }
        else if (action === 'select-plan') askDiscard(() => select(id));
        else if (action === 'select-node') { state.nodeId = id; repaint(); }
        else if (action === 'new-plan') newPlan();
        else if (action === 'copy-plan') {
          if (!db().plans.some(p => p.id === state.selectedId)) { notify('请先保存当前方案，再复制。'); return; }
          newPlan(state.selectedId);
        }
        else if (action === 'save-draft') save(false);
        else if (action === 'publish') save(true);
        else if (action === 'new-step') editStep();
        else if (action === 'edit-step') editStep(id);
        else if (action === 'copy-step') editStep(id, true);
        else if (action === 'add-node') addNode();
        else if (action === 'copy-node') copyNode();
        else if (action === 'remove-node') removeNode();
        else if (action === 'plan-settings') planSettings();
        else if (action === 'create-task') createTask();
      });
    };
    root.onchange = event => {
      const input = event.target, node = state.draft?.nodes.find(n => n.id === state.nodeId);
      if (!node) return;
      safeAction(() => {
        if (input.dataset.nodeField) {
          const key = input.dataset.nodeField, value = key === 'sampleCount' ? Number(input.value) : input.value.trim();
          if (key === 'sampleCount' && (!Number.isInteger(value) || value < 1 || value > 100)) { input.value = node.sampleCount; throw new Error('抽样数量应为 1–100 的整数。'); }
          if (key === 'name' && !value) { input.value = node.name; throw new Error('工序名称不能为空。'); }
          node[key] = value; changed(); repaint();
        } else if (input.dataset.dependency) {
          const source = input.dataset.dependency;
          if (source === node.id || descendants(node.id, state.draft.edges).has(source)) { input.checked = false; throw new Error('该依赖会产生循环，已阻止添加。'); }
          state.draft.edges = state.draft.edges.filter(e => !(e.source === source && e.target === node.id));
          if (input.checked) state.draft.edges.push({ source, target: node.id });
          changed(); repaint();
        } else if (input.dataset.itemId) {
          const itemId = input.dataset.itemId;
          node.itemIds = node.itemIds.filter(id => id !== itemId); if (input.checked) node.itemIds.push(itemId);
          changed(); repaint();
        }
      });
    };
    const searchHandler = (id, prop) => {
      const el = document.getElementById(id); if (!el) return;
      el.addEventListener('input', () => { const caret = el.selectionStart; state[prop] = el.value; repaint(); const next = document.getElementById(id); next?.focus(); next?.setSelectionRange(caret, caret); });
    };
    searchHandler('pp-plan-search', 'query'); searchHandler('pp-step-search', 'libraryQuery');
  }
  window.ProcessPage = { render, bind, validate };
})();
</script>
<script>/* Shared inspection workbench: five scenarios, immutable completed rounds and report snapshots. */
(function () {
  'use strict';
  const scenarios = { IQC: '来料检验', FIRST: '生产首件', IPQC: '过程检验', FQC: '完工检验', OQC: '出货检验' };
  const resultLabels = { pending: '待录入', pass: '符合', ng: '不符合', invalid: '格式错误', conforming: '符合', nonconforming: '不符合', insufficient: '证据不足' };
  const tones = { pending: 'neutral', pass: 'green', ng: 'red', invalid: 'amber', conforming: 'green', nonconforming: 'red', insufficient: 'amber' };
  let current = {}, search = '', saveTimer = null;
  const photoJobs = new Set();
  const E = value => UI.e(value == null ? '' : String(value));
  const B = (label, action, kind = 'secondary', attrs = '') => `<button type="button" class="button ${kind}" data-inspection-action="${action}" ${attrs}>${label}</button>`;
  const badge = (text, tone) => UI.badge(text, tone);
  const date = value => value ? new Date(value).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '未记录';
  const taskItems = task => {
    const items = task.standardSnapshot?.items || [];
    const selected = (task.planSnapshot?.nodes || []).flatMap(n => n.itemIds || []);
    return selected.length ? items.filter(item => selected.includes(item.id)) : items;
  };
  const roundOf = task => QMS.getRound(task);
  const requiredSamples = (round, itemId) => round.itemSampleCounts?.[itemId] || round.sampleCount || 3;
  const statusOf = stats => stats?.status || 'insufficient';
  const taskName = task => task.standardSnapshot?.name || task.standardId || '检验任务';
  const technical = (task, round) => QMS.technical(task, round);
  const range = item => item.kind === 'attribute' ? '属性符合性' : `${item.lower === '' || item.lower == null ? '—' : item.lower} ～ ${item.upper === '' || item.upper == null ? '—' : item.upper} ${item.unit || ''}`;
  function save() { try { const ok = QMS.save(); if (ok === false) { UI.toast('浏览器未能保存，请导出数据备份后释放存储空间。'); return false; } return true; } catch (err) { UI.toast(`保存失败：${err.message || '浏览器存储空间不足，请先导出备份'}`); return false; } }
  function empty(title, text, action = '') { return `<div class="empty-state"><div class="inspection-empty-icon">${UI.icon('checkSquare', 28)}</div><h3>${E(title)}</h3><p>${E(text)}</p>${action}</div>`; }
  function meta(task, round) {
    return `<div class="inspection-context"><span><small>批次</small><strong>${E(task.batch)}</strong></span><span><small>采用标准</small><strong>${E(task.standardSnapshot?.name || task.standardId)} / ${E(task.standardSnapshot?.revision || '—')}</strong></span><span><small>采用方案</small><strong>${E(task.planSnapshot?.name || task.planId)} / ${E(task.planSnapshot?.revision || '—')}</strong></span><span><small>本轮对象</small><strong>${E(round.sampleCount)} 件</strong></span></div>`;
  }
  function list(params) {
    const scenario = params.scenario || 'ALL';
    const tasks = (QMS.db.tasks || []).filter(t => (scenario === 'ALL' || t.scenario === scenario) && (!search || `${t.id} ${t.batch} ${taskName(t)} ${t.inspector || ''}`.toLowerCase().includes(search.toLowerCase())));
    return `<div class="page-head"><div class="title-group"><div class="muted">检验管理</div><h1>${E(scenarios[scenario] || '检验任务')}</h1><p class="muted">从受控方案开检，按轮次保存样本与真实测量。</p></div><div class="actions">${B(`${UI.icon('plus')} 新建检验任务`, 'new-task', 'primary')}</div></div>
      <div class="tabs inspection-scenario-tabs">${[['ALL', '全部任务'], ...Object.entries(scenarios)].map(([key, value]) => `<button class="tab ${scenario === key ? 'active' : ''}" data-inspection-action="scenario" data-scenario="${key}">${E(value)}<span>${(QMS.db.tasks || []).filter(t => key === 'ALL' || t.scenario === key).length}</span></button>`).join('')}</div>
      <section class="panel"><div class="toolbar"><div class="inspection-search">${UI.icon('search')}<input class="input" id="inspection-search" aria-label="搜索检验任务" placeholder="搜索批次、零件、检验员" value="${E(search)}"></div><span class="muted">${tasks.length} 项任务</span></div>
      ${tasks.length ? `<div class="table-wrap"><table class="data-table inspection-task-table"><thead><tr><th>任务 / 零件</th><th>检验场景</th><th>批次</th><th>执行进度</th><th>技术结论</th><th>检验员</th><th>操作</th></tr></thead><tbody>${tasks.map(t => {
        const r = roundOf(t), s = technical(t, r);
        return `<tr><td><button class="inspection-text-link" data-inspection-action="open-task" data-id="${E(t.id)}">${E(taskName(t))}</button><small class="inspection-subline">${E(t.id)}</small></td><td>${E(scenarios[t.scenario] || t.scenario)}</td><td>${E(t.batch)}<small class="inspection-subline">批量 ${E(t.quantity)} 件</small></td><td><div class="inspection-progress"><span>${r.status === 'completed' ? '本轮已完成' : `${s.filled || 0} / ${s.total || 0} 项读数`}</span><progress value="${s.filled || 0}" max="${s.total || 1}"></progress></div></td><td>${badge(resultLabels[statusOf(s)] || statusOf(s), tones[statusOf(s)] || 'neutral')}</td><td>${E(t.inspector || '未指定')}</td><td>${B(r.status === 'completed' ? '查看记录' : '继续检验', 'open-task', 'ghost', `data-id="${E(t.id)}"`)}</td></tr>`;
      }).join('')}</tbody></table></div>` : empty(search ? '没有匹配的任务' : '从一份受控方案开始', search ? '尝试其他批次、零件名称或检验员。' : '新任务会冻结当前标准和方案；后续改版不改写历史。', search ? '' : B('新建检验任务', 'new-task', 'primary'))}</section>`;
  }
  function statsMarkup(task, round) {
    const s = technical(task, round);
    return `<div class="inspection-stats"><div><small>录入进度</small><strong>${s.filled || 0}<span> / ${s.total || 0}</span></strong><progress value="${s.filled || 0}" max="${s.total || 1}"></progress></div><div><small>符合读数</small><strong class="inspection-good">${s.pass || 0}</strong></div><div><small>不符合读数</small><strong class="inspection-bad">${s.ng || 0}</strong></div><div><small>技术结论</small>${badge(resultLabels[statusOf(s)] || statusOf(s), tones[statusOf(s)] || 'neutral')}<small>仅证明本轮被检范围</small></div><div><small>批接受依据</small><strong class="inspection-small-value">未作批判定</strong><small>逐项实测模式</small></div></div>`;
  }
  function rowMarkup(task, round, item, index) {
    const values = round.measurements?.[item.id] || [];
    const needed = requiredSamples(round, item.id);
    const results = Array.from({ length: needed }, (_, i) => QMS.evaluate(item, values[i] || ''));
    const status = results.includes('invalid') ? 'invalid' : results.includes('ng') ? 'ng' : results.includes('pending') ? 'pending' : 'pass';
    const locked = round.status === 'completed';
    return `<tr data-item-row="${E(item.id)}"><td><span class="inspection-balloon">${E(item.balloon || index + 1)}</span></td><td><strong>${E(item.name)}</strong><small class="inspection-subline">${E(item.method || '按方案执行')}</small></td><td><span class="inspection-spec">${E(range(item))}</span><small class="inspection-subline">${item.nominal == null || item.nominal === '' ? '' : `公称 ${E(item.nominal)} ${E(item.unit || '')}`}</small></td>${Array.from({ length: round.sampleCount }, (_, i) => i >= needed ? '<td><span class="inspection-not-required" title="本项方案未要求此样本">—</span></td>' : `<td><div class="inspection-reading ${results[i]}" data-reading-wrap="${E(item.id)}:${i}">${item.kind === 'attribute' ? `<select aria-label="${E(item.name)} 样本 ${i + 1}" data-item-id="${E(item.id)}" data-sample="${i}" ${locked ? 'disabled' : ''}><option value="">请选择</option><option value="pass" ${values[i] === 'pass' ? 'selected' : ''}>符合</option><option value="ng" ${values[i] === 'ng' ? 'selected' : ''}>不符合</option></select>` : `<input inputmode="decimal" autocomplete="off" aria-label="${E(item.name)} 样本 ${i + 1}" data-item-id="${E(item.id)}" data-sample="${i}" value="${E(values[i] || '')}" placeholder="—" ${locked ? 'readonly' : ''}>`}<small data-reading-result>${E(resultLabels[results[i]] || results[i])}</small></div></td>`).join('')}<td data-item-result>${badge(resultLabels[status], tones[status])}</td></tr>`;
  }
  function photosMarkup(round) {
    const photos = round.photos || [];
    return `<div class="inspection-photo-grid">${photos.map(p => `<figure><button class="inspection-photo-preview" data-inspection-action="preview-photo" data-id="${E(p.id)}" aria-label="查看照片 ${E(p.name)}"><img src="${E(p.dataUrl)}" alt="${E(p.name || '检验现场照片')}" loading="lazy"></button><figcaption><span>${E(p.name || '现场照片')}</span>${round.status !== 'completed' ? B(UI.icon('close', 14), 'delete-photo', 'ghost', `data-id="${E(p.id)}" aria-label="移除照片 ${E(p.name)}"`) : ''}</figcaption></figure>`).join('')}${round.status !== 'completed' ? `<label class="inspection-photo-add" tabindex="0" role="button" aria-label="上传或拍摄现场照片">${UI.icon('camera', 24)}<strong>拍照 / 上传</strong><small>最多 8 张，自动压缩保存</small><input id="inspection-photos" type="file" accept="image/*" capture="environment" multiple></label>` : ''}</div>${!photos.length && round.status === 'completed' ? '<p class="muted">本轮未附现场照片。</p>' : ''}`;
  }
  function signaturesMarkup(task, round) {
    const signatures = round.signatures || {};
    return `<div class="inspection-sign-grid">${[['inspector', '检验员', true], ['reviewer', '审核员', !!task.reviewRequired]].map(([key, label, required]) => {
      const s = signatures[key];
      return `<div class="inspection-sign-box"><div class="inspection-sign-head"><strong>${label}</strong>${badge(s ? '已签名' : required ? '需签名' : '未要求签名', s ? 'green' : required ? 'blue' : 'neutral')}</div>${s ? `<img class="inspection-sign-image" src="${E(s.dataUrl)}" alt="${label} ${E(s.name)} 手写签名"><div class="inspection-sign-meta"><span>${E(s.name)}</span><span>${date(s.signedAt)}</span></div>` : `<div class="inspection-sign-placeholder">${UI.icon('pen', 23)}<span>${required ? '完成测量后手写签名' : '本任务未要求审核签名，可选填'}</span></div>`}${round.status !== 'completed' ? B(s ? '重新签名' : '手写签名', 'sign', 'secondary', `data-signature="${key}"`) : ''}</div>`;
    }).join('')}</div><p class="inspection-sign-notice">本地手写签名记录确认意愿，不等同于企业身份认证。修改实测值或照片后，已有签名需重新确认。</p>`;
  }
  function detail(params) {
    const task = QMS.getTask(params.taskId);
    if (!task) return empty('任务不存在', '请返回检验台账重新选择。', B('返回检验任务', 'back-list'));
    const round = params.roundId ? task.rounds.find(r => r.id === params.roundId) : roundOf(task);
    if (!round) return empty('轮次不存在', '请选择此任务中已有的轮次。', B('返回当前轮次', 'current-round'));
    const locked = round.status === 'completed', items = taskItems(task);
    return `<div class="page-head"><div class="title-group"><button class="inspection-back" data-inspection-action="back-list">${UI.icon('arrowLeft', 15)} ${E(scenarios[task.scenario] || '检验任务')}</button><h1>${E(taskName(task))}</h1><p class="muted">${E(task.id)} ${badge(locked ? '本轮已完成' : '检验中', locked ? 'green' : 'blue')}</p></div><div class="actions">${B('新建复检轮次', 'new-round')}${locked ? B(`${UI.icon('report')} 查看本轮报告`, 'round-report', 'primary') : B(`${UI.icon('check')} 完成本轮并生成报告`, 'complete', 'primary')}</div></div>

bline">${E(item.method || '')}</small></td><td>${E(range(item))}</td>${Array.from({ length: round.sampleCount || 0 }, (_, i) => `<td class="${results[i] === 'ng' ? 'inspection-bad' : ''}">${E(i >= needed ? '—' : item.kind === 'attribute' ? resultLabels[values[i]] || values[i] || '缺失' : values[i] || '缺失')}</td>`).join('')}<td>${badge(resultLabels[state], tones[state])}</td></tr>`; }).join('')}</tbody></table></div><section class="inspection-report-section"><h3>轮次说明</h3><p>${E(round.reason || '首次检验')}</p><p class="muted">原轮次的测量、失败与处置记录保持独立，本报告不替代其他轮次。</p></section>${(round.photos || []).length ? `<section class="inspection-report-section"><h3>现场照片</h3><div class="inspection-report-photos">${round.photos.map(p => `<figure><img src="${E(p.dataUrl)}" alt="${E(p.name)}"><figcaption>${E(p.name)}</figcaption></figure>`).join('')}</div></section>` : ''}<section class="inspection-report-section"><h3>记录确认</h3><div class="inspection-report-signatures">${[['inspector', '检验员'], ['reviewer', '审核员']].map(([key, label]) => { const s = round.signatures?.[key]; return `<div><strong>${label}</strong>${s ? `<img src="${E(s.dataUrl)}" alt="${label} ${E(s.name)} 手写签名"><span>${E(s.name)} / ${date(s.signedAt)}</span>` : '<span>未要求 / 未签署</span>'}</div>`; }).join('')}</div><p class="inspection-sign-notice">本地手写签名用于记录确认，不等同企业身份认证或正式生产签发。</p></section><footer class="inspection-report-footer"><span>报告快照 ${E(report.id)}</span><span>模板 v1.0 / 本地生成器 v1.0</span></footer></article>`;
  }
  function reports(params = {}) {

  }
  function csvCell(value) { let str = String(value == null ? '' : value); if (/^[\s]*[=+\-@]/.test(str) || /^[\t\r\n]/.test(str)) str = "'" + str; return '"' + str.replace(/"/g, '""') + '"'; }
  function downloadCsv(report) {
    const { task, round } = reportData(report);
    const rows = [['报告编号', report.number || report.id], ['任务', report.taskId], ['轮次', report.roundId], ['零件', taskName(task)], ['批次', task.batch], ['标准修订', task.standardSnapshot?.revision], ['方案修订', task.planSnapshot?.revision], ['批接受', '未作批判定'], [], ['气泡', '特性', '技术要求', '方法', ...Array.from({ length: round.sampleCount || 0 }, (_, i) => `样本S${i + 1}`)]];

    const blob = new Blob(['\ufeff' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `检验报告-${report.number || report.id}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); UI.toast('CSV 已导出；照片与笔迹保留在完整报告中。');

  function printReport() {

    const host = document.createElement('div'); host.id = 'inspection-print-host'; host.appendChild(report.cloneNode(true)); document.body.appendChild(host);
    document.body.classList.add('printing-inspection-report');
    const cleanup = () => { document.body.classList.remove('printing-inspection-report'); host.remove(); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup); window.print(); setTimeout(cleanup, 1500);
  }
  function bindReports(params = {}) {
    const page = document.getElementById('page'); if (!page) return;
    page._inspectionAbort?.abort(); const abort = new AbortController(); page._inspectionAbort = abort; const listen = (type, handler) => page.addEventListener(type, handler, { signal: abort.signal });

      if (action === 'report-print') printReport();

  }
  window.InspectionPage = { render(params = {}) { current = params; return params.taskId ? detail(params) : list(params); }, bind };
  window.ReportPage = { render: reports, bind: bindReports };
})();
</script>

function overview(){const open=db.tasks.filter(t=>QMS.getRound(t)?.status!=='completed'),ng=db.ncrs.filter(n=>n.status!=='closed'),published=db.standards.filter(s=>s.status==='published');return title('质量工作台','从受控标准出发，让每一次检验都有清晰的依据。',btn(icon('plus',15)+' 创建检验任务','new-task','primary'))+`<div class="stats-row">${[[open.length,'待完成检验','checkSquare','覆盖五类检验场景'],[ng.length,'待处理不合格','alert','技术结论与处置独立记录'],[published.length,'已发布技术标准','standard','任务保留采用时的版本'],[db.reports.length,'已汇总检验报告','report','结果与证据一起留档']].map(([n,l,i,d])=>`<div class="stat-card"><div class="stat-top">${l}${icon(i,19)}</div><div class="stat-value">${n}<span>份</span></div><div class="stat-bottom">${d}</div></div>`).join('')}</div><section class="panel"><div class="panel-head"><h3>一条清晰的质量主线</h3><span class="muted" style="font-size:11px">可复用方案，独立批次记录</span></div><div class="flow-rail">${[['drawings','drawing','图纸与气泡','独立工作台嵌入'],['standards','standard','技术标准','受控要求版本'],['process','flow','工序与方案','编排并复用'],['inspection','checkSquare','检验执行','录数、照片与签名'],['reports','report','检验报告','冻结证据快照']].map(([r,i,n,d],ix)=>`${ix?icon('chevron',15):''}<button class="flow-stage" data-route="${r}"><span class="flow-stage-icon">${icon(i,19)}</span><span><strong>${n}</strong><small>${d}</small></span></button>`).join('')}</div></section><div class="overview-grid"><div class="stack"><section class="panel"><div class="panel-head"><h3>检验任务 <small>${db.tasks.length} 份任务</small></h3><button class="button ghost small" data-action="all-tasks">全部任务${icon('chevron',13)}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>产品 / 批次</th><th>检验场景</th><th>采用版本</th><th>录入进度</th><th>任务状态</th><th>操作</th></tr></thead><tbody>${db.tasks.slice(0,5).map(taskRow).join('')}</tbody></table></div><div class="table-footer"><span>实测完成不自动代表整批接受</span><span>所有数据均为本地演示</span></div></section><section class="panel"><div class="panel-head"><h3>常用方案</h3><button class="button ghost small" data-action="process">管理方案${icon('chevron',13)}</button></div><div class="panel-body" style="display:flex;gap:12px;flex-wrap:wrap">${db.plans.filter(p=>p.status==='published').slice(0,3).map(p=>`<button class="button" data-action="process">${icon('flow',16)}${e(p.name)} ${badge(p.revision)}</button>`).join('')}</div></section></div><aside class="overview-side"><div class="stack"><section class="quick-start"><div class="quick-start-decoration"></div><h2>让标准成为<br>现场的共同语言。</h2><p>选定图纸与技术标准，将工序方案复用到新的检验任务。</p><button class="button" data-action="drawings">进入图纸工作台${icon('arrow',15)}</button></section><section class="panel"><div class="panel-head"><h3>最近动态</h3>${icon('clock',16)}</div><div class="activity-list">${db.activity.slice(0,4).map(a=>`<div class="activity-item">${icon(a.action.includes('异常')?'alert':a.action.includes('完成')?'checkSquare':'file',16)}<div><strong>${e(a.action)}</strong><small>${e(a.detail||a.targetId).slice(0,58)}</small><small>${dtime(a.createdAt)}</small></div></div>`).join('')}</div></section></div></aside></div>`}

function drawings(){if(params.view==='embed')return title('图纸气泡工作台','由独立气泡识别软件提供标注、图纸版本、公差与气泡管理。',btn(icon('arrowLeft',15)+' 图纸列表','drawing-list','secondary'))+`<section class="panel"><div class="embed-toolbar"><div class="actions">${icon('link',18)}<strong style="font-size:12px">Worlder 气泡图</strong>${badge(embed?'已发起嵌入':'待打开','blue')}</div><div class="actions">${btn(icon('settings',14)+' 连接设置','connection','ghost')}${btn(icon('external',14)+' 独立窗口打开','external','secondary')}${btn(icon('refresh',14)+' 重新加载','reload','secondary')}</div></div>${embed?`<iframe class="embed-frame" title="独立气泡识别软件" src="${e(safeUrl(db.settings.bubbleUrl)||'about:blank')}" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"></iframe>`:`<div class="embed-empty"><div class="embed-empty-inner"><div class="embed-logo">${icon('drawing',34)}</div><h2>熟悉的标注工具，<br>就在同一个工作空间。</h2><p>在这里打开独立气泡软件，继续使用它的图纸标注与公差能力。完成后将结构化特性导入 QMS，编制受控技术标准。</p><div class="actions">${btn(icon('external',16)+' 在此嵌入工作台','launch-embed','primary')}${btn('连接设置','connection')}</div></div></div>`}<div class="embed-status">${embed?'嵌入请求已发送。服务登录、证书与 iframe 访问策略由独立系统控制；若未显示，请在独立窗口打开。':'服务地址已配置；尚未验证连接。生产接入需由后端读取已保存对象及版本。'}</div></section><div class="actions" style="margin-top:16px">${btn(icon('upload',15)+' 导入气泡特性 JSON','import-characteristics')}${btn(icon('download',15)+' 下载对接样例','sample-json','ghost')}<span class="muted" style="font-size:11px">本地导入后仍需人工核对、发布标准</span></div>`;
const rows=db.drawings.filter(d=>(d.name+d.code+d.partNo+d.customer).toLowerCase().includes(drawFilter.toLowerCase()));return title('图纸与气泡','连接工程图纸与检验要求，保留每一次采用的版本。',btn(icon('upload',15)+' 导入特性','import-characteristics')+btn(icon('external',15)+' 气泡识别工作台','open-embed','primary'))+`<section class="notice neutral" style="margin-bottom:24px">${icon('info',17)}<span>图纸标注由独立气泡识别软件提供。下方为原型沿用的示例产品，缩略图仅作示意。</span></section><div class="toolbar" style="padding:0 0 20px;border:0"><div style="position:relative;flex:1;max-width:350px"><input type="search" id="drawing-search" aria-label="搜索图纸" placeholder="搜索图号、零件或客户" value="${e(drawFilter)}" class="full-width"></div><span class="muted" style="font-size:12px">${rows.length} 份图纸</span></div><div class="asset-grid">${rows.map(d=>{const s=db.standards.filter(s=>s.drawingId===d.id),valid=s.filter(x=>x.status==='published');return `<article class="asset-card"><div class="asset-preview">${schematic(d)}${badge(d.revision)}</div><div class="asset-info"><h3>${e(d.name)}</h3><p class="mono">${e(d.code)}</p><div class="asset-meta"><span>${e(d.customer)}</span><span>${valid.length} 个已发布标准</span></div><div class="asset-actions">${btn('查看技术标准','standard-for','secondary',`data-drawing-id="${e(d.id)}"`)}${btn(icon('external',14)+' 标注','open-embed','ghost')}</div></div></article>`}).join('')}</div>${!rows.length?empty('没有找到图纸','换一个图号或产品名称，或导入新的气泡特性。'):''}`}

function connection(){UI.modal('独立气泡软件连接',`<div class="stack"><div class="notice neutral">${icon('info',17)}<span>此设置只配置 iframe 地址。不会保存气泡系统密码，也不会将加载事件视为已登录或已同步。</span></div><div class="field"><label for="bubble-url">工作台地址</label><input id="bubble-url" type="url" value="${e(db.settings.bubbleUrl)}" placeholder="https://bubble.example.com/#/drawing-packages"><small>网页使用 iframe；桌面壳可使用同一地址挂载 WebView。</small></div><p class="muted">若服务拒绝嵌入，需要服务端配置允许的 frame-ancestors。正式结果采用需由 QMS 后端鉴权并读取对象版本。</p></div>`,btn('取消','cancel')+btn('保存地址','save-url','primary'));document.querySelector('[data-action=cancel]').onclick=close;document.querySelector('[data-action=save-url]').onclick=()=>{const u=safeUrl(document.querySelector('#bubble-url').value.trim());if(!u){toast('请输入有效的 HTTP 或 HTTPS 地址');return}db.settings.bubbleUrl=u;persist();close();toast('工作台地址已保存');if(route==='drawings')render()}}

function importCharacteristics(){UI.modal('导入气泡特性',`<div class="stack"><div class="notice">${icon('info',17)}<span>导入独立气泡软件导出的结构化特性。导入后创建新的标准草稿，不修改已发布标准或历史任务。</span></div><div class="field"><label for="characteristic-file">选择 JSON 文件</label><input type="file" id="characteristic-file" accept=".json,application/json"><small>字段示例：drawing、characteristics；最多 200 个项目，文件不超过 2 MB。</small></div><button class="button" id="import-sample">${icon('download',14)}下载字段样例</button><div id="import-preview" class="muted" style="font-size:12px">选择文件后预览。</div></div>`,btn('取消','cancel')+btn('创建标准草稿','commit-import','primary','disabled'));
let parsed=null;document.querySelector('[data-action=cancel]').onclick=close;document.querySelector('#import-sample').onclick=()=>downloadJson(sampleCharacteristics(),'气泡特性字段样例.json');document.querySelector('#characteristic-file').onchange=async ev=>{parsed=null;const b=document.querySelector('[data-action=commit-import]');b.disabled=true;const f=ev.target.files[0];if(!f)return;try{if(f.size>2097152)throw Error('文件超过 2 MB');const data=JSON.parse(await f.text());if(!data.drawing?.name||!data.drawing?.code||!data.drawing?.revision)throw Error('缺少图纸名称、图号或修订');if(!Array.isArray(data.characteristics)||!data.characteristics.length||data.characteristics.length>200)throw Error('characteristics 需包含 1–200 个项目');const ids=new Set();data.characteristics.forEach((c,i)=>{if(!c.name||!['number','attribute'].includes(c.kind)||typeof c.id!=='string'||!c.id.trim()||c.id.length>160||['__proto__','constructor','prototype'].includes(c.id)||ids.has(c.id))throw Error(`第 ${i+1} 行名称、类型或稳定特性 ID 无效`);ids.add(c.id);if(c.kind==='number'&&QMS.evaluate(c,c.nominal)==='invalid')throw Error(`第 ${i+1} 行公称值或限值格式无效`)});parsed=data;document.querySelector('#import-preview').innerHTML=`${badge('校验通过','green')}<p style="margin-top:10px">${e(data.drawing.name)} / ${e(data.drawing.revision)}<br>${data.characteristics.length} 个特性，将创建独立草稿等待核对。</p>`;b.disabled=false}catch(error){document.querySelector('#import-preview').textContent=error.message}};document.querySelector('[data-action=commit-import]').onclick=()=>{if(!parsed)return;const d={id:QMS.uid('DWG'),name:String(parsed.drawing.name),partNo:String(parsed.drawing.partNo||''),code:String(parsed.drawing.code),revision:String(parsed.drawing.revision),customer:String(parsed.drawing.customer||'未关联'),status:'draft',source:'本地文件导入'};const s={id:QMS.uid('STD'),drawingId:d.id,name:d.name+'技术标准',revision:'R1',status:'draft',source:`${d.code} ${d.revision}`,items:parsed.characteristics.map((c,i)=>({id:String(c.id),balloon:c.balloon||i+1,name:String(c.name),nominal:String(c.nominal??''),lower:c.lower??null,upper:c.upper??null,unit:String(c.unit||''),method:String(c.method||''),kind:c.kind,sourceText:String(c.sourceText||''),page:Number(c.page)||1,verified:false}))};db.drawings.push(d);db.standards.unshift(s);log('导入图纸特性',s.id,`${d.code} / ${s.items.length} 项；待核对`);close();go('standards',{standardId:s.id});toast('已导入标准草稿，请逐项核对后发布')}}

function standards(){const s=selectedStandard();if(!s)return title('技术标准','先建立可追溯的技术要求。',btn('新建手工标准','new-standard','primary'))+empty('还没有技术标准','导入气泡特性或创建手工标准。');standardId=s.id;const d=db.drawings.find(d=>d.id===s.drawingId);return title('技术标准','技术要求独立于检验场景；发布后以版本为依据复用。',btn(icon('plus',15)+' 新建手工标准','new-standard'))+`<div class="split-view"><section class="panel"><div class="panel-head"><h3>标准版本</h3><span class="muted" style="font-size:11px">${db.standards.length} 份</span></div><div class="list-select">${db.standards.map(v=>`<button class="${v.id===s.id?'active':''}" data-standard="${e(v.id)}"><strong>${e(v.name)}</strong><small>${e(v.revision)} / ${v.items.length} 个技术项目</small>${badge(v.status==='published'?'已发布':'草稿',v.status==='published'?'green':'amber')}</button>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>${e(s.name)}</h2><p class="muted" style="font-size:11px;margin-top:5px">${e(s.revision)}　${e(s.id)}</p></div><div class="actions">${s.status==='published'?btn(icon('copy',14)+' 新建修订','revise-standard'):btn(icon('plus',14)+' 添加项目','add-item')+btn(icon('check',14)+' 发布标准','publish-standard','primary')}</div></div><div class="metadata-grid"><div><label>来源图纸</label><b>${e(d?d.code:'手工标准')}</b></div><div><label>图纸修订</label><b>${e(d?.revision||'—')}</b></div><div><label>采用状态</label>${badge(s.status==='published'?'可用于编制方案':'待核对、未发布',s.status==='published'?'green':'amber')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>气泡 / 技术项目</th><th>公称值 / 要求</th><th>规格下限</th><th>规格上限</th><th>方法</th><th>核对</th><th></th></tr></thead><tbody>${s.items.map(i=>`<tr><td><strong><span class="muted">#${e(i.balloon)}</span> ${e(i.name)}</strong><small>${e(i.id)}</small></td><td class="mono">${e(i.nominal)} ${e(i.unit)}</td><td class="mono">${i.kind==='attribute'?'—':e(i.lower??'—')}</td><td class="mono">${i.kind==='attribute'?'—':e(i.upper??'—')}</td><td>${e(i.method)}</td><td>${badge(i.verified?'已核对':'待核对',i.verified? querySelector('[data-action=cancel]').onclick=close;if(read)return;document.querySelector('[data-action=save-item]').onclick=()=>{const get=id=>document.getElementById(id).value.trim();const next={...i,balloon:Number(get('item-balloon')),name:get('item-name'),kind:get('item-kind'),nominal:get('item-nominal'),lower:get('item-lower')||null,upper:get('item-upper')||null,unit:get('item-unit'),method:get('item-method'),sourceText:get('item-source'),verified:document.querySelector('#item-verified').checked};if(!next.name||!next.method||!Number.isSafeInteger(next.balloon)||next.balloon<1){toast('请填写项目名称、检验方法和有效气泡号');return}if(s.items.some(x=>x.id!==next.id&&Number(x.balloon)===next.balloon)){toast('气泡显示号已存在');return}if(next.kind==='number'&&['invalid','pending','ng'].includes(QMS.evaluate(next,next.nominal))){toast('公称值需为有效数字且在规格范围内，至少填写一侧限值');return}if(next.kind==='attribute'){next.lower=null;next.upper=null;if(!next.nominal){toast('请填写外观属性要求');return}}if(item)Object.assign(item,next);else s.items.push(next);log('更新技术项目',s.id,next.name);close();render();toast('技术项目已保存')}}
function ncrPage(){const n=params.ncrId?db.ncrs.find(n=>n.id===params.ncrId):null;if(n)return ncrDetail(n);const count=k=>db.ncrs.filter(n=>n.status===k).length;return title('不合格处置','保留真实不良，明确处置范围，分别记录执行与验证。',btn(icon('plus',15)+' 登记不合格','new-ncr','primary'))+`<div class="ncr-summary"><div class="panel"><span class="muted">待处置</span><b>${count('open')}</b></div><div class="panel"><span class="muted">处置中</span><b>${count('in_progress')}</b></div><div class="panel"><span class="muted">已关闭</span><b>${count('closed')}</b></div></div><section class="panel"><div class="panel-head"><h3>不合格记录</h3><span class="muted" style="font-size:11px">${db.ncrs.length} 份记录</span></div>${db.ncrs.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>异常 / 关联批次</th><th>负责人</th><th>处置行</th><th>完成期限</th><th>状态</th><th>操作</th></tr></thead><tbody>${db.ncrs.map(n=>`<tr><td style="max-width:360px;white-space:normal"><button class="table-link" data-ncr="${e(n.id)}">${e(n.title)}</button><small>${e(QMS.getTask(n.taskId)?.batch||n.id)}</small></td><td>${e(n.owner||'待指派')}</td><td>${n.dispositions.length} 行</td><td>${e(n.due||'待定')}</td><td>${badge(({open:'待处置',in_progress:'处置中',closed:'已关闭'})[n.status]||n.status,n.status==='closed'?'green':'amber')}</td><td>${btn('查看处置','open-ncr','ghost',`data-ncr="${e(n.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('暂无不合格记录','可从检验中发现的超差建立关联 NCR。')}<div class="table-footer">创建 NCR 不会自动冻结整批；关闭 NCR 不会解除独立的质量限制。</div></section>`}
function ncrDetail(n){const t=QMS.getTask(n.taskId),done=n.status==='closed';return `<button class="button ghost back-button" data-action="ncr-list">${icon('arrowLeft',15)}全部不合格记录</button>`+title('不合格处置单',n.id,btn('查看来源检验','source-task')+(!done?btn(icon('check',15)+' 关闭 NCR','close-ncr','primary'):badge('已关闭','green')))+`<section class="panel"><div class="panel-head"><div><h2>${e(n.title)}</h2><p class="muted" style="font-size:12px;margin-top:6px">${e(t?.standardSnapshot.name||'未关联产品')}</p></div>${badge(done?'已关闭':n.status==='in_progress'?'处置中':'待处置',done?'green':'amber')}</div><div class="metadata-grid"><div><label>关联批次 / 轮次</label><b>${e(t?.batch||'—')}</b><small class="muted" style="display:block">${e(n.roundId||'—')}</small></div><div><label>责任人</label><b>${e(n.owner||'待指派')}</b></div><div><label>完成期限</label><b>${e(n.due||'待定')}</b></div></div><div class="panel-body" style="padding-top:20px"><div class="notice amber">${icon('alert',17)}<span>处置不覆盖原始实测结果。${n.failures?.length?e(n.failures.map(f=>`#${f.item.balloon} ${f.item.name}`).join('、')):'异常范围以处置行记录为准。'}</span></div></div></section><div class="overview-grid"><div class="stack"><section class="panel"><div class="panel-head"><h3>逐行处置 <small>${n.dispositions.length} 行</small></h3>${!done?btn(icon('plus',14)+' 添加处置行','add-disposition'):''}</div><div class="panel-body">${n.dispositions.length?n.dispositions.map((d,ix)=>`<div class="disposition-row"><div class="disposition-row-head"><h3>${ix+1}. ${e(d.action)} ${badge(`${d.quantity} ${d.unit}`)}</h3>${badge(d.status==='completed'?'执行已记录':'待执行',d.status==='completed'?'green':'amber')}</div><p>范围：${e(d.scope)}　责任人：${e(d.owner)}</p><p>依据：${e(d.reason)}</p>${d.evidence?`<p>执行凭据：${e(d.evidence)}</p>`:''}${d.status!=='completed'&&!done?btn('登记执行凭据','finish-disposition','secondary small',`data-index="${ix}"`):''}</div>`).join(''):empty('尚未编制处置行','为具体对象明确处置方式、数量、单位、责任人与依据。')}</div></section><section class="panel"><div class="panel-head"><h3>独立质量限制</h3>${btn(icon('plus',14)+' 新增限制','add-hold')}</div><div class="panel-body">${n.holds?.length?n.holds.map((h,ix)=>`<div class="disposition-row"><div class="disposition-row-head"><strong style="font-size:12px">${e(h.action)}</strong>${badge(h.status==='released'?'已解除':'限制有效',h.status==='released'?'green':'red')}</div><p>${e(h.scope)} / ${e(h.reason)}</p><p>责任：${e(h.owner)}</p>${h.releaseEvidence?`<p>解除凭据：${e(h.releaseEvidence)}</p>`:btn('登记解除依据','release-hold','secondary small',`data-index="${ix}"`)}</div>`).join(''):'<p class="muted" style="font-size:12px">暂无质量限制。此记录仅用于演示范围与受限动作，不执行 ERP / MES 拦截。</p>'}</div></section></div><aside class="stack"><section class="panel"><div class="panel-head"><h3>操作轨迹</h3></div><div class="panel-body">${n.events.slice().reverse().map(a=>`<div class="event-line">${e(a.action)}<p class="muted" style="font-size:11px">${e(a.text||'')}</p><small>${dtime(a.createdAt)}</small></div>`).join('')}</div></section><div class="notice neutral">${icon('info',16)}<span>NCR 与 8D 独立关闭。8D 在当前演示中仅保留扩展入口。</span></div></aside></div>`}

function addDisposition(n){UI.drawer('添加处置行',`<div class="form-grid"><div class="field"><label for="dis-action">处置方式</label><select id="dis-action"><option>返工</option><option>挑选</option><option>让步接收</option><option>退货</option><option>报废</option></select></div><div class="field"><label for="dis-owner">责任人</label><input id="dis-owner" value="${e(n.owner)}"></div><div class="field full"><label for="dis-scope">处置对象 / 范围</label><input id="dis-scope" placeholder="例如：样本 S01，轴直径超差"></div><div class="field"><label for="dis-quantity">数量</label><input id="dis-quantity" type="number" min="0.001" step="any" placeholder="填写已确认的数量"></div><div class="field"><label for="dis-unit">单位</label><select id="dis-unit"><option>件</option><option>kg</option><option>套</option></select></div><div class="field full"><label for="dis-reason">处置依据</label><textarea id="dis-reason" placeholder="记录评审决定、技术依据或适用范围"></textarea></div></div>`,btn('取消','cancel')+btn('保存处置行','save-dis','primary'));document.querySelector('[data-action=cancel]').onclick=close;document.querySelector('[data-action=save-dis]').onclick=()=>{const get=id=>document.getElementById(id).value.trim();const d={id:QMS.uid('DIS'),action:get('dis-action'),owner:get('dis-owner'),scope:get('dis-scope'),quantity:get('dis-quantity'),unit:get('dis-unit'),reason:get('dis-reason'),status:'pending'};if(!d.owner||!d.scope||!d.reason||!Number.isFinite(Number(d.quantity))||Number(d.quantity)<=0){toast('请填写责任、范围、正数数量及处置依据');return}n.dispositions.push(d);n.status='in_progress';ncrEvent(n,'新增处置行',`${d.action} / ${d.quantity} ${d.unit}`);close();render();toast('处置行已保存，等待记录实际执行')}}

function downloadJson(data,name){download(JSON.stringify(data,null,2),name,'application/json')}
function download(content,name,type){const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function settings(){UI.drawer('工作区设置',`<div class="stack"><div><h3>本地数据</h3><p class="muted" style="margin-top:7px">本演示无需后端，数据保存在当前浏览器。照片和签名随本地数据保存，可导出 JSON 备份。</p></div><div class="actions"><button class="button" id="export-backup">${icon('download',15)}导出全部本地数据</button></div><div class="divider"></div><div><h3>独立气泡工作台</h3><p class="muted mono" style="margin-top:7px;overflow-wrap:anywhere">${e(db.settings.bubbleUrl)}</p></div><button class="button" id="connection-settings">${icon('settings',15)}修改嵌入地址</button><div class="divider"></div><div class="notice neutral">${icon('info',16)}<span>手写签名用于交互演示并绑定本轮内容。正式身份鉴别、防篡改审计与合规电子签章需要企业服务支持。</span></div></div>`,btn('完成','settings-close','primary'));document.querySelector('#export-backup').onclick=()=>{downloadJson(db,'Worlder-QMS-本地数据备份.json');toast('已导出本地数据备份')};document.querySelector('#connection-settings').onclick=connection;document.querySelector('[data-action=settings-close]').onclick=close}
function activity(){UI.drawer('操作记录',db.activity.length?`<div>${db.activity.slice(0,40).map(a=>`<div class="event-line"><strong>${e(a.action)}</strong><p class="muted">${e(a.detail||a.targetId)}</p><small>${dtime(a.createdAt)}</small></div>`).join('')}</div>`:empty('暂无操作记录','后续操作会记录在这里。'),btn('关闭','activity-close'));document.querySelector('[data-action=activity-close]').onclick=close}
function help(){UI.modal('关于这个可运行 Demo',`<div class="stack"><p>从原始 QMS-Pro HTML 重构，保留三份示例零件与图纸特性。业务按当前 V3 调研的版本、快照和结果分层组织。</p><div class="notice neutral">${icon('info',17)}<span>演示包含本地数据与真实前端交互；气泡软件是外部 iframe 接入，未声明接口已连通。无真实设备采数或生产放行。</span></div><p><b>推荐体验路径</b><br>查看标准 → 复用工序方案 → 创建检验任务 → 实测录数 / 现场照片 / 手写签名 → 完成并生成报告 → 超差登记 NCR。</p><p>界面模式参考成熟后台的对象导航、数据表格和右侧编辑面板，以及克制的状态转场。参考项目：<a href="https://github.com/ant-design/ant-design-pro" target="_blank" rel="noopener noreferrer">Ant Design Pro</a>、<a href="https://github.com/xyflow/xyflow" target="_blank" rel="noopener noreferrer">xyflow</a>。当前网络未能核验实时 star 数。</p></div>`,btn('开始体验','help-close','primary'));document.querySelector('[data-action=help-close]').onclick=close}
function search(){UI.modal('搜索工作区',`<input id="global-search" class="full-width" type="search" placeholder="搜索产品、批次、标准或页面" aria-label="搜索工作区"><div id="global-search-results" class="search-results"></div>`);const input=document.querySelector('#global-search'),results=document.querySelector('#global-search-results');function update(){const q=input.value.trim().toLowerCase();const items=[...Object.entries(routes).map(([r,name])=>({name,sub:'页面入口',icon:'grid',r,p:{}})),...db.tasks.map(t=>({name:t.batch+' / '+t.standardSnapshot.name,sub:scenarios[t.scenario],icon:'checkSquare',r:'inspection',p:{taskId:t.id}})),...db.standards.map(s=>({name:s.name+' / '+s.revision,sub:'技术标准',icon:'standard',r:'standards',p:{standardId:s.id}}))].filter(x=>(x.name+x.sub).toLowerCase().includes(q)).slice(0,10);results.innerHTML=items.length?items.map((x,i)=>`<button class="search-result" data-result="${i}">${icon(x.icon,18)}<span><strong>${e(x.name)}</strong><small>${e(x.sub)}</small></span></button>`).join(''):empty('没有匹配结果','尝试产品名称或批次号。');results.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const x=items[Number(b.dataset.result)];close();go(x.r,x.p)})}input.oninput=update;update();}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));document.querySelectorAll('[data-shell]').forEach(b=>b.onclick=()=>{switch(b.dataset.shell){case'settings':settings();break;case'search':search();break;case'activity':activity();break;case'help':help();break;case'menu':document.querySelector('#sidebar').classList.toggle('open');break}});
document.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();search();return}const dialog=document.querySelector('.dialog');if(!dialog)return;if(ev.key==='Escape'){ev.preventDefault();close()}if(ev.key==='Tab'){const focus=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);if(!focus.length)return;if(ev.shiftKey&&document.activeElement===focus[0]){ev.preventDefault();focus.at(-1).focus()}else if(!ev.shiftKey&&document.activeElement===focus.at(-1)){ev.preventDefault();focus[0].focus()}}});
window.addEventListener('qms-storage-error',()=>{document.querySelector('#storage-status').textContent='保存空间不足，请导出备份';toast('本地保存失败，当前改动仍在内存中。请导出备份或减少照片。')});
window.addEventListener('hashchange',readRoute);readRoute();
})();
</script>
</body>
</html>
