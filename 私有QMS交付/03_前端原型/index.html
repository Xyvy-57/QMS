<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<title>Worlder QMS · 开发入口（免构建）</title>
<!--
  开发入口：不需要构建，直接双击打开即可运行，直接加载 src/ 下的源码。
  · 首次打开需要联网加载三个第三方库（Tailwind 运行时、Vue、Chart.js）；
    如果 vendor/ 目录里已有这些文件，则优先使用本地文件，可离线运行。
  · 对外分发请使用 node build.mjs 生成的单文件 qms_pro_qms.html（全部内联，可离线打开）。
  · 下面这段 text/tailwindcss 样式与 styles/tailwind.css 的组件层保持一致，修改组件类时两处同步。
-->
<link rel="stylesheet" href="styles/app.css" />
<!-- Tailwind 运行时：优先用本地 vendor/ 里的文件，没有再走 CDN；配置必须紧跟在它后面 -->
<script src="vendor/tailwind.play.js" onerror="this.remove()"></script>
<script>if (!window.tailwind) document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');</script>
<script>
if (window.tailwind) {
  window.tailwind.config = { theme: { extend: {
    colors: {
      brand: { 50: '#eef5ff', 100: '#d9e8ff', 200: '#bcd6ff', 300: '#8ebcff', 400: '#5996ff', 500: '#3478f6', 600: '#1f63e0', 700: '#1a4fb8', 800: '#1b4392', 900: '#1c3a74' },
      ink: { DEFAULT: '#1d1d1f', 2: '#424245', 3: '#6e6e73', 4: '#86868b', 5: '#aeaeb2' },
      canvas: '#f5f5f7'
    },
    fontFamily: {
      sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', '"Segoe UI"', 'Roboto', 'sans-serif'],
      mono: ['"SF Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace']
    },
    boxShadow: {
      soft: '0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04)',
      lift: '0 2px 6px rgba(0,0,0,.05), 0 18px 40px rgba(0,0,0,.08)',
      pop: '0 24px 64px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08)'
    },
    transitionTimingFunction: { apple: 'cubic-bezier(.32,.72,0,1)', spring: 'cubic-bezier(.34,1.56,.64,1)' }
  } } };
}
</script>
<style type="text/tailwindcss">
@layer base {
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  body { @apply bg-canvas text-ink font-sans text-[13px]; }
  input, select, textarea, button { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
}
@layer components {
  .card { @apply bg-white rounded-2xl border border-black/[0.06] shadow-soft; }
  .card-hover { @apply transition-all duration-300 ease-apple hover:shadow-lift hover:-translate-y-0.5; }
  .btn { @apply inline-flex items-center justify-center gap-1.5 h-9 px-3.5 rounded-xl text-[13px] font-medium transition-all duration-200 ease-apple select-none whitespace-nowrap active:scale-[0.97] disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100; }
  .btn-primary { @apply btn bg-brand-600 text-white hover:bg-brand-700 shadow-[0_1px_2px_rgba(31,99,224,.35)]; }
  .btn-secondary { @apply btn bg-white text-ink border border-black/10 hover:bg-black/[0.03]; }
  .btn-ghost { @apply btn text-ink-2 hover:bg-black/[0.05]; }
  .btn-danger { @apply btn bg-rose-600 text-white hover:bg-rose-700; }
  .btn-success { @apply btn bg-emerald-600 text-white hover:bg-emerald-700; }
  .btn-soft { @apply btn bg-brand-50 text-brand-700 hover:bg-brand-100; }
  .btn-sm { @apply h-8 px-2.5 text-xs rounded-lg; }
  .btn-xs { @apply h-7 px-2 text-[11px] rounded-lg; }
  .btn-icon { @apply btn h-8 w-8 px-0 text-ink-3 hover:bg-black/[0.05] hover:text-ink; }
  .input { @apply h-9 w-full rounded-xl border border-black/10 bg-white px-3 text-[13px] text-ink placeholder:text-ink-5 transition-all duration-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 disabled:bg-black/[0.03] disabled:text-ink-3; }
  .textarea { @apply input h-auto py-2 leading-relaxed; }
  .label { @apply block text-xs font-medium text-ink-3 mb-1.5; }
  .chip { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium whitespace-nowrap; }
  .chip-gray { @apply chip bg-black/[0.05] text-ink-2; }
  .chip-blue { @apply chip bg-sky-50 text-sky-700 ring-1 ring-inset ring-sky-600/15; }
  .chip-brand { @apply chip bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-600/15; }
  .chip-green { @apply chip bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/15; }
  .chip-red { @apply chip bg-rose-50 text-rose-700 ring-1 ring-inset ring-rose-600/15; }
  .chip-amber { @apply chip bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20; }
  .chip-violet { @apply chip bg-violet-50 text-violet-700 ring-1 ring-inset ring-violet-600/15; }
  .page-title { @apply text-[22px] font-semibold tracking-tight text-ink; }
  .section-title { @apply text-[15px] font-semibold tracking-tight text-ink; }
  .muted { @apply text-ink-3; }
  .link { @apply text-brand-600 hover:text-brand-700 hover:underline underline-offset-2 cursor-pointer; }
  .kbd { @apply inline-flex items-center justify-center min-w-[20px] h-5 px-1 rounded-md border border-black/10 bg-white text-[10px] font-medium text-ink-3 shadow-[0_1px_0_rgba(0,0,0,.08)]; }
  .tbl { @apply w-full text-left border-collapse; }
  .tbl th { @apply sticky top-0 z-10 bg-[#fafafa]/95 backdrop-blur px-3 py-2.5 text-[11px] font-medium text-ink-3 border-b border-black/[0.06] whitespace-nowrap; }
  .tbl td { @apply px-3 py-3 border-b border-black/[0.04] align-middle whitespace-nowrap; }
  .tbl tbody tr { @apply transition-colors duration-150; }
  .tbl tbody tr.row-link { @apply cursor-pointer hover:bg-brand-50/40; }
  .cell { @apply h-8 w-[84px] rounded-lg border border-black/10 bg-white px-2 text-center font-mono text-[12.5px] tabular-nums transition-all duration-150 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 disabled:bg-black/[0.025] disabled:text-ink-2; }
  .cell-ng { @apply border-rose-400 bg-rose-50 text-rose-700 font-semibold focus:border-rose-500 focus:ring-rose-500/15; }
  .cell-warn { @apply border-amber-400 bg-amber-50 text-amber-800; }
  .cell-ok { @apply border-emerald-300/70; }
  .cell-bad { @apply border-dashed border-amber-500 bg-amber-50/60; }
  .balloon-badge { @apply inline-flex items-center justify-center h-6 min-w-[24px] px-1 rounded-full text-[11px] font-bold tabular-nums ring-2; }
}
</style>
</head>
<body>
<div id="app" v-cloak></div>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font:500 13px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#6e6e73;z-index:9999;transition:opacity .4s">
  <div style="text-align:center;max-width:560px;padding:0 24px">
    <div style="width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:linear-gradient(135deg,#3478f6,#1a4fb8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">W</div>
    <div id="boot-msg">正在启动 Worlder QMS…</div>
    <pre id="boot-err" style="display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff1f2;color:#be123c;font:12px/1.6 ui-monospace,Menlo,monospace;text-align:left;white-space:pre-wrap;word-break:break-all"></pre>
  </div>
</div>
<script>
(function () {
  var msg = document.getElementById('boot-msg'), err = document.getElementById('boot-err');
  function say(t) { if (msg) msg.textContent = t; }
  function fail(t) { say('启动失败'); if (err) { err.style.display = 'block'; err.textContent += (err.textContent ? '\n' : '') + t; } }
  /* 源码还没挂载成功时，把脚本错误直接显示出来，便于定位 */
  window.addEventListener('error', function (e) {
    if (!document.getElementById('boot')) return;
    fail((e.filename ? e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + '  ' : '') + (e.message || '资源加载失败'));
  });

  var NPM = 'https://registry.npmmirror.com', UNPKG = 'https://unpkg.com', JSD = 'https://cdn.jsdelivr.net/npm';
  if (!window.tailwind) { fail('Tailwind 运行时加载失败：请检查网络，或把 tailwind.play.js 放到 vendor/ 目录（见 README）。也可以直接运行 node build.mjs 生成不依赖网络的单文件。'); return; }
  var LIBS = [
    { name: 'Vue', ok: function () { return !!window.Vue; }, urls: ['vendor/vue.global.prod.js', NPM + '/vue/3.4.38/files/dist/vue.global.prod.js', UNPKG + '/vue@3.4.38/dist/vue.global.prod.js', JSD + '/vue@3.4.38/dist/vue.global.prod.js'] },
    { name: 'Chart.js', optional: true, ok: function () { return !!window.Chart; }, urls: ['vendor/chart.umd.min.js', NPM + '/chart.js/4.4.1/files/dist/chart.umd.js', UNPKG + '/chart.js@4.4.1/dist/chart.umd.js', JSD + '/chart.js@4.4.1/dist/chart.umd.min.js'] }
  ];
  var SRC = ['10_core', '15_actions', '20_ui', '30_pages_a', '32_bubble', '40_inspect', '44_qr', '45_reports', '46_production', '47_mainline', '48_guide', '49_floor', '50_ncr', '60_masterdata', '70_system', '80_rd', '85_prod_demo', '90_app'];

  function loadOne(url, done) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { done(true); };
    s.onerror = function () { s.remove(); done(false); };
    document.head.appendChild(s);
  }
  function loadLib(lib, next) {
    var i = 0;
    (function attempt() {
      if (i >= lib.urls.length) {
        if (lib.optional) { console.warn(lib.name + ' 未能加载，相关功能（图表）不可用'); next(); }
        else fail(lib.name + ' 加载失败：请检查网络，或把对应文件放到 vendor/ 目录（见 README）。');
        return;
      }
      loadOne(lib.urls[i++], function (loaded) { if (loaded && lib.ok()) { if (lib.after) lib.after(); next(); } else attempt(); });
    })();
  }
  function loadSrc(i) {
    if (i >= SRC.length) return;
    loadOne('src/' + SRC[i] + '.js', function (loaded) {
      if (!loaded) { fail('源码文件 src/' + SRC[i] + '.js 加载失败'); return; }
      loadSrc(i + 1);
    });
  }
  say('正在加载运行库…');
  (function seq(k) { if (k >= LIBS.length) { say('正在启动 Worlder QMS…'); loadSrc(0); return; } loadLib(LIBS[k], function () { seq(k + 1); }); })(0);
})();
</script>
</body>
</html>
