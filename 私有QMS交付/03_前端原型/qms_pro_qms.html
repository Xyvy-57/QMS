<style>
/* Worlder QMS 原型 · 自定义样式（过渡动效 / 骨架屏 / 气泡 / 签名板 / A4 报告 / 打印）
   Tailwind 的令牌与组件类在 styles/tailwind.css；这里只放 Tailwind 表达不了的部分。 */

[v-cloak] { display: none !important; }
:root { --ease: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.56,.64,1); }
html { scroll-behavior: smooth; }
::selection { background: rgba(31,99,224,.18); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(0,0,0,.28); }
::-webkit-scrollbar-track { background: transparent; }
.glass { background: rgba(250,250,252,.72); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.glass-dark { background: rgba(29,29,31,.78); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.tabular { font-variant-numeric: tabular-nums; }
/* 顶部流程条：窄屏可以左右滑，但不占一条滚动条的高度 */
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* —— 页面与弹层过渡：短位移 + 缓出，弹层带轻微回弹 —— */
.page-enter-active { transition: opacity .36s var(--ease), transform .46s var(--ease); }
.page-leave-active { transition: opacity .14s ease, transform .14s ease; }
.page-enter-from { opacity: 0; transform: translateY(10px) scale(.995); }
.page-leave-to { opacity: 0; transform: translateY(-4px); }
.fade-enter-active, .fade-leave-active { transition: opacity .25s var(--ease); }
.fade-enter-from, .fade-leave-to { opacity: 0; }
.modal-enter-active { transition: opacity .3s var(--ease); }
.modal-leave-active { transition: opacity .2s ease; }
.modal-enter-from, .modal-leave-to { opacity: 0; }
.modal-enter-active .modal-panel { transition: transform .42s var(--spring), opacity .3s var(--ease); }
.modal-leave-active .modal-panel { transition: transform .2s ease, opacity .2s ease; }
.modal-enter-from .modal-panel { transform: translateY(12px) scale(.96); opacity: 0; }
.modal-leave-to .modal-panel { transform: scale(.98); opacity: 0; }
.drawer-enter-active { transition: opacity .35s var(--ease); }
.drawer-leave-active { transition: opacity .25s ease; }
.drawer-enter-from, .drawer-leave-to { opacity: 0; }
.drawer-enter-active .drawer-panel { transition: transform .5s var(--ease); }
.drawer-leave-active .drawer-panel { transition: transform .28s ease-in; }
.drawer-enter-from .drawer-panel, .drawer-leave-to .drawer-panel { transform: translateX(104%); }
.toast-enter-active { transition: all .45s var(--spring); }
.toast-leave-active { transition: all .25s ease; }
.toast-enter-from { opacity: 0; transform: translateY(16px) scale(.96); }
.toast-leave-to { opacity: 0; transform: translateX(24px); }
.list-move, .list-enter-active, .list-leave-active { transition: all .4s var(--ease); }
.list-enter-from, .list-leave-to { opacity: 0; transform: translateY(8px); }
.list-leave-active { position: absolute; }
.pop-enter-active { transition: all .22s var(--ease); }
.pop-leave-active { transition: all .12s ease; }
.pop-enter-from, .pop-leave-to { opacity: 0; transform: translateY(-4px) scale(.98); }

/* —— 骨架屏 —— */
.skeleton { position: relative; overflow: hidden; background: #ececf0; border-radius: 10px; }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* —— 图纸气泡 —— */
.balloon { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .28s var(--spring), filter .2s ease; }
.balloon:hover { transform: scale(1.18); filter: drop-shadow(0 2px 6px rgba(31,99,224,.45)); }
.balloon.is-active { transform: scale(1.3); filter: drop-shadow(0 0 8px rgba(245,158,11,.8)); }
.balloon.is-ng circle.halo { animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 0% { opacity: .55; r: 14px; } 100% { opacity: 0; r: 26px; } }
.viewer-grab { cursor: grab; }
.viewer-grab:active { cursor: grabbing; }

/* —— 无权限 / 条件不满足的按钮：悬浮显示原因 —— */
.guard { position: relative; display: inline-flex; }
.guard[data-tip] > button { pointer-events: none; }
.guard[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); right: 0; z-index: 60; width: max-content; max-width: 260px; padding: 7px 10px; border-radius: 10px; background: rgba(29,29,31,.92); color: #fff; font-size: 11.5px; line-height: 1.45; font-weight: 500; white-space: normal; text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: tipIn .18s var(--ease); }
@keyframes tipIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* —— 分段控件滑块 —— */
.seg-thumb { transition: transform .38s var(--ease), width .38s var(--ease); }

/* —— 签名板 —— */
.sig-canvas { touch-action: none; background-image: linear-gradient(to right, rgba(0,0,0,.08) 50%, transparent 0); background-size: 10px 1px; background-repeat: repeat-x; background-position: 0 72%; }

/* —— 研发看板拖拽 —— */
.drop-ok { outline: 2px dashed rgba(31,99,224,.5); outline-offset: -6px; background: rgba(31,99,224,.05); }
.dragging { opacity: .45; transform: rotate(1.5deg); }

/* —— A4 报告 —— */
.a4 { width: 794px; min-height: 1123px; background: #fff; margin: 0 auto; padding: 44px 48px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.08); border-radius: 6px; color: #111; }
.a4 table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.a4 th, .a4 td { border: 1px solid #d4d4d8; padding: 5px 6px; }
.a4 th { background: #f4f4f5; font-weight: 600; }
.watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 60px; font-weight: 800; color: rgba(225,29,72,.08); transform: rotate(-24deg); z-index: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff !important; }
  body * { visibility: hidden !important; }
  .print-area, .print-area * { visibility: visible !important; }
  .print-area { position: absolute; left: 0; top: 0; }
  .a4 { box-shadow: none; border-radius: 0; margin: 0; }
}

</style>

    std: { id: std.id, code: std.code, rev: std.rev, drawingRev: std.drawingRev, hash: std.hash }, groups: clone(plan.groups), items, frozenAt: nowISO(),
  };
}
/** 新轮次：本轮样本数只属于轮次；复检 = 新轮次（parent 指向上一轮） */
function newRound(task, no, opts) {

  const mg = task.snap.groups.find((g) => g.type === 'measure');
  const n = mg ? mg.n : 0;
  const samples = opts.samples || Array.from({ length: n }, (_, i) => (no > 1 ? 'R' + no + '-' : 'S') + (i + 1));
  const vals = {}, cnt = {};
  task.snap.items.forEach((it) => { if (it.group === 'M') vals[it.cid] = samples.map(() => ''); if (it.group === 'C') cnt[it.cid] = { bad: '', note: '' }; });
  return { id: 'rd-' + task.id + '-' + no, no, parent: opts.parent || null, reason: opts.reason || '', sampleMode: opts.sampleMode || 'new', ncrId: opts.ncrId || '', samples, vals, cnt, dUnits: '', photos: [], imports: [], status: 'active', submittedAt: null, signer: null, result: null, missingReason: '' };

/* ---------------- 判定引擎（与服务端口径一致的浏览器模拟） ----------------
 * 计量组（measurement）：逐项给出 符合 / 不符合 / 缺失，结论只覆盖本轮被检样本与项目；
 * 计数组（single_count）：证据完整且 d ≤ Ac 才接受，d ≥ Re 拒收，其余继续抽样；禁止提前接受。 */
function evalRound(task, round) {
  const res = { byCid: {}, m: { ok: 0, ng: 0, missing: 0, total: 0 }, c: null, filled: 0, total: 0, overall: 'incomplete', missingCells: [] };
  const items = task.snap.items;
  items.forEach((it) => {
    if (it.group === 'M') {
      const vals = round.vals[it.cid] || [];
      let ng = 0, miss = 0; const cells = [];
      round.samples.forEach((s, i) => {
        const st = judgeValue(vals[i], it);
        cells.push(st);
        if (st === 'missing' || st === 'invalid') { miss++; res.missingCells.push({ it, i, s, st }); } else if (st !== 'ok') ng++;
      });
      res.total += round.samples.length; res.filled += round.samples.length - miss;
      const status = ng > 0 ? 'ng' : miss > 0 ? 'missing' : 'ok';
      res.byCid[it.cid] = { status, ng, miss, cells };
      res.m.total++; res.m[status === 'ok' ? 'ok' : status === 'ng' ? 'ng' : 'missing']++;
    } else if (it.group === 'C') {
      const raw = String((round.cnt[it.cid] || {}).bad == null ? '' : round.cnt[it.cid].bad).trim();
      const filled = /^\d+$/.test(raw);
      const bad = filled ? parseInt(raw, 10) : 0;
      res.total += 1;
      if (filled) res.filled += 1; else res.missingCells.push({ it, i: -1, s: '不良数', st: raw ? 'invalid' : 'missing' });
      res.byCid[it.cid] = { status: !filled ? 'missing' : bad > 0 ? 'ng' : 'ok', bad, filled };
    }
  });
  const cg = task.snap.groups.find((g) => g.type === 'count');
  const cItems = items.filter((i) => i.group === 'C');
  if (cg && cItems.length) {
    const bads = cItems.map((i) => res.byCid[i.cid].bad);
    const allFilled = cItems.every((i) => res.byCid[i.cid].filled);
    const total = sum(bads), maxb = Math.max.apply(null, [0].concat(bads));
    const dRaw = String(round.dUnits == null ? '' : round.dUnits).trim();
    let d = total, dInvalid = '';
    if (dRaw !== '') {
      if (!/^\d+$/.test(dRaw)) dInvalid = '不良单位数须为整数';
      else {
        d = parseInt(dRaw, 10);
        if (d < maxb) dInvalid = '不良单位数不能小于单项最大不良数 ' + maxb;
        else if (d > total) dInvalid = '不良单位数不能大于各项不良数之和 ' + total;
        else if (d > cg.n) dInvalid = '不良单位数不能大于样本量 n';
      }
    }
    let result;
    if (dInvalid) result = 'continue';
    else if (d >= cg.re && (allFilled || cg.earlyReject)) result = 'reject';
    else if (allFilled) result = d <= cg.ac ? 'accept' : 'reject';
    else result = 'continue';
    res.c = { n: cg.n, ac: cg.ac, re: cg.re, aql: cg.aql, d, total, maxb, allFilled, result, dInvalid, dAuto: dRaw === '' };
  }
  const mNg = res.m.ng > 0, cRej = !!res.c && res.c.result === 'reject';
  const mMiss = res.m.missing > 0, cCont = !!res.c && res.c.result === 'continue';
  res.overall = mNg || cRej ? 'fail' : mMiss || cCont ? 'incomplete' : 'pass';
  res.progress = res.total ? res.filled / res.total : 1;
  return res;
}
function summarizeEval(ev) {
  const byCid = {};
  Object.keys(ev.byCid).forEach((k) => { const v = ev.byCid[k]; byCid[k] = { status: v.status, ng: v.ng || 0, bad: v.bad || 0 }; });
  return { overall: ev.overall, m: clone(ev.m), c: ev.c ? clone(ev.c) : null, byCid };
}

 * 约定：动作失败时抛出 Error（message 为可直接展示的中文原因），调用方 try/catch 后 toast。
 * ===================================================================== */

const TASK_PREFIX = { IQC: 'IQC', FIRST: 'FAI', IPQC: 'IPQC', FQC: 'FQC', OQC: 'OQC' };

function taskCodeFor(scene) {
  const head = TASK_PREFIX[scene] + '-' + dateCode() + '-';
  let n = S.tasks.filter((t) => t.code.indexOf(head) === 0).length + 1;
  while (S.tasks.some((t) => t.code === head + String(n).padStart(3, '0'))) n++;
  return head + String(n).padStart(3, '0');
}

/** 可用于某零件、某场景的生效方案 */
function plansFor(partId, scene) {
  return S.plans.filter((p) => p.status === 'effective' && (!partId || p.partId === partId) && (!scene || p.scenes.includes(scene)));
}

/** 新建检验任务：冻结“场景定义 + 标准修订 + 方案修订”三层快照（建单不可改技术规则） */
function createTask(o) {
  const plan = planOf(o.planId);
  if (!plan || plan.status !== 'effective') throw new Error('只能采用生效的检验方案');
  if (!plan.scenes.includes(o.scene)) throw new Error('该方案不适用于所选检验场景');
  const scene = sceneOf(o.scene);
  if (!scene.enabled) throw new Error('该检验场景已停用，不能新建任务');
  const cg = plan.groups.find((g) => g.type === 'count');
  const lot = String(o.lot == null ? '' : o.lot).trim();
  if (cg && !/^[1-9]\d*$/.test(lot)) throw new Error('方案含计数抽样组，需填写整数件制的批量');
  if (lot && !/^\d+$/.test(lot)) throw new Error('批量须为整数');
  const t = {
    id: 't' + nextSeq(), code: taskCodeFor(o.scene), scene: o.scene, partId: plan.partId, planId: plan.id, lot: lot ? parseInt(lot, 10) : 0,
    ctx: clone(o.ctx || {}), assignee: o.assignee || S.me, due: o.due || hoursFromNow(8), status: 'pending', rounds: [], reportIds: [], createdAt: nowISO(), createdBy: S.me,
  };
  t.snap = buildSnapshot(S, plan, o.scene);
  if (!t.snap.items.length) throw new Error('该方案没有分配任何检验特性');
  t.rounds.push(newRound(t, 1));
  S.tasks.unshift(t);
  logAudit('检验', t.code, '新建' + scene.name + '任务，冻结快照：场景 v' + t.snap.scene.ver + ' / ' + t.snap.std.code + ' Rev ' + t.snap.std.rev + ' / ' + t.snap.plan.code + ' Rev ' + t.snap.plan.rev);
  return taskOf(t.id);
}

/** 复检 = 新轮次：记录父轮次与原因；可选原样本子集或新取样本；原失败永远保留（V3 §6.4，A09） */
function createRetestRound(task, o) {
  o = o || {};
  const last = task.rounds[task.rounds.length - 1];
  if (!last || last.status !== 'submitted') throw new Error('上一轮尚未提交，不能发起复检');
  const reason = String(o.reason || '').trim();
  if (!reason) throw new Error('请填写复检原因');
  const hasMeasure = task.snap.groups.some((g) => g.type === 'measure');
  let samples;
  if (o.sampleMode === 'subset') {
    samples = (o.samples || []).filter((s) => last.samples.includes(s));
    if (hasMeasure && !samples.length) throw new Error('请选择要复检的原样本');
  }
  const r = newRound(task, last.no + 1, { parent: last.id, reason, sampleMode: o.sampleMode === 'subset' ? 'subset' : 'new', samples: samples && samples.length ? samples : undefined });
  r.ncrId = o.ncrId || '';
  task.rounds.push(r);
  task.status = 'active';
  logAudit('检验', task.code, '发起复检第 ' + r.no + ' 轮（' + (r.sampleMode === 'subset' ? '原样本子集：' + r.samples.join('、') : '新取样本') + '）：' + reason);
  return task.rounds[task.rounds.length - 1];
}

/** 拍照要求（场景参数）：返回尚未满足拍照要求的特性 */
function photoViolations(task, round, ev) {
  const sc = task.snap.scene, pol = sc.photo || 'none';
  if (!sc.steps.includes('photo') || pol === 'none') return [];
  const has = (cid) => round.photos.some((p) => p.cid === cid);
  return task.snap.items.filter((it) => {
    if (has(it.cid)) return false;
    if (pol === 'onDefect') return !!ev.byCid[it.cid] && ev.byCid[it.cid].status === 'ng';
    if (pol === 'appearance') return it.cat === '外观';
    return false;
  });
}

/** 是否需要报告复核（按场景策略；未配置复核步骤则不产生任何批准） */
function reviewNeeded(task, status) {
  const sc = task.snap.scene;
  return sc.steps.includes('review') && (sc.review === 'always' || (sc.review === 'onFail' && status === 'fail'));
}

/** 签名提交本轮：完整性检查 → 判定 → 冻结报告 → 按策略进入复核 */
function submitRound(task, round, o) {
  o = o || {};
  if (round.status !== 'active') throw new Error('该轮次已提交，不能重复提交');
  const ev = evalRound(task, round);
  if (ev.c && ev.c.dInvalid) throw new Error(ev.c.dInvalid);
  const pv = photoViolations(task, round, ev);
  if (pv.length) throw new Error('拍照要求未满足：' + pv.map((i) => '#' + i.no + ' ' + i.name).join('、'));
  if (ev.overall === 'incomplete') {
    if (!task.snap.scene.allowInsufficient) throw new Error('存在缺失项，当前场景不允许以“证据不足”提交');
    const why = String(o.missingReason || '').trim();
    if (!why) throw new Error('存在缺失项：请补测，或填写缺失原因后以“证据不足”提交');
    round.missingReason = why;
  }
  const needSign = task.snap.scene.steps.includes('sign');
  if (needSign && !o.sigImg) throw new Error('请先手写签名');
  round.status = 'submitted';
  round.submittedAt = nowISO();
  round.result = summarizeEval(ev);
  task.status = ev.overall === 'fail' ? 'fail' : ev.overall === 'pass' ? 'pass' : 'insufficient';
  const rep = buildReport(S, task, round, 'RPT-' + task.code + (round.no > 1 ? '-R' + round.no : ''));
  round.signer = { uid: S.me, name: me.value.name, img: o.sigImg || '', at: round.submittedAt, hash: rep.hash };
  if (needSign) rep.sigs.push(Object.assign({ kind: '检验' }, round.signer));
  rep.state = reviewNeeded(task, task.status) ? 'review' : 'frozen';
  S.reports.unshift(rep);
  task.reportIds.push(rep.id);
  const txt = { pass: '符合', fail: '不符合', insufficient: '证据不足' }[task.status];
  logAudit('检验', task.code, '签名提交第 ' + round.no + ' 轮：' + txt + (ev.c ? '；计数组 d=' + ev.c.d + '（Ac ' + ev.c.ac + ' / Re ' + ev.c.re + '）' + STATUS.result[ev.c.result][0] : '') + '；报告 ' + rep.code + (rep.state === 'review' ? ' 待复核' : ' 已冻结'));
  return S.reports.find((x) => x.id === rep.id);
}

/** 报告签名是否仍然有效：签名时的内容摘要须等于报告当前内容摘要（A13） */
function sigValid(rep, sig) { return !!sig && sig.hash === hashOf(rep.content); }

/** 复核签批：复核人不得为本轮签名人（A14）；不合格报告也可以被批准——批准的是报告如实，不改变结论（A12） */
function approveReport(rep, sigImg) {
  if (rep.state !== 'review') throw new Error('报告不在待复核状态');
  if (!can('report.review')) throw new Error(denyTip('report.review'));
  if (rep.sigs.some((s) => s.kind === '检验' && s.uid === S.me)) throw new Error('复核人不得为本轮签名人');
  if (!sigImg) throw new Error('请先手写签名');
  rep.sigs.push({ kind: '复核', uid: S.me, name: me.value.name, img: sigImg, at: nowISO(), hash: rep.hash });
  rep.state = 'approved';
  logAudit('报告', rep.code, '复核通过并签批（内容摘要 ' + rep.hash + '）');
}
function returnReport(rep, opinion) {
  if (rep.state !== 'review') throw new Error('报告不在待复核状态');
  if (!can('report.review')) throw new Error(denyTip('report.review'));
  const text = String(opinion || '').trim();
  if (!text) throw new Error('请填写退回意见');
  rep.opinions = rep.opinions || [];
  rep.opinions.push({ uid: S.me, at: nowISO(), text });
  rep.state = 'frozen';
  logAudit('报告', rep.code, '复核退回：' + text);
}
/** 退回后重新提请复核 */
function resubmitReport(rep) {
  if (rep.state !== 'frozen' || !(rep.opinions && rep.opinions.length)) throw new Error('只有被退回的报告可以重新提请复核');
  rep.state = 'review';
  logAudit('报告', rep.code, '重新提请复核');
}

/** 登记不合格（NCR）：只登记本次事实；NCR 不自动冻结整批（质量限制需单独建立） */
function createNcr(o) {
  const title = String(o.title || '').trim();
  if (!title) throw new Error('请填写不合格标题');
  if (!o.partId) throw new Error('请选择零件');
  const year = new Date().getFullYear();
  const maxNo = Math.max(0, ...S.ncrs.map((n) => parseInt(n.code.slice(-4), 10) || 0));
  const task = o.taskId ? taskOf(o.taskId) : null;
  const round = task && o.roundId ? task.rounds.find((r) => r.id === o.roundId) : null;
  const n = {
    id: 'n' + nextSeq(), code: 'NCR-' + year + '-' + String(maxNo + 1).padStart(4, '0'), title, severity: o.severity || '一般', status: 'registered',
    partId: o.partId, batch: o.batch || '', taskId: o.taskId || '', roundId: o.roundId || '', cids: (o.cids || []).slice(), desc: o.desc || '',
    qtySuspect: parseInt(o.qtySuspect, 10) || 0, qtyConfirmed: 0, createdBy: S.me, createdAt: nowISO(), photos: (o.photos || []).slice(), disp: [], holds: [],
    log: [{ at: nowISO(), by: S.me, text: '登记不合格' + (task ? '（来源：' + task.code + (round ? ' 第 ' + round.no + ' 轮' : '') + '）' : '（现场发现）') }],
  };
  S.ncrs.unshift(n);
  logAudit('NCR', n.code, '登记不合格：' + title);
  return S.ncrs.find((x) => x.id === n.id);
}
function ncrsOfTask(taskId) { return S.ncrs.filter((n) => n.taskId === taskId); }

/** 任务上下文摘要（列表与报告共用） */
function ctxText(task) {
  const c = task.ctx || {};
  return ['supplier', 'customer', 'receipt', 'shipment', 'wo', 'op', 'machine', 'freq', 'batch'].filter((k) => c[k]).map((k) => (CTX_FIELDS[k] ? CTX_FIELDS[k].label + ' ' : '') + c[k]).join(' · ');
}
/** 任务当前轮次与进度 */
function currentRound(task) { return task.rounds[task.rounds.length - 1]; }
function taskProgress(task) { const r = currentRound(task); if (!r) return 0; if (r.status === 'submitted') return 1; return evalRound(task, r).progress; }

/** 图片压缩：长边不超过 1280px，JPEG 质量 0.78（正式系统上传私有对象存储并记录摘要） */
function compressImage(file, max, q) {
  max = max || 1280; q = q || 0.78;
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('文件读取失败'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('不是可识别的图片'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function latestRevOfCode(code) { return S.standards.filter((s) => s.code === code).map((s) => s.rev).sort().pop() || '@'; }
/** 由气泡同步生成标准草稿：识别结果不等于已批准标准，草稿须人工核对并审核 */
function createDraftFromSync(sync) {
  if (!sync.partId || !partOf(sync.partId).id) throw new Error('未匹配到零件：请先在“基础资料 › 零部件”中建立图号 ' + sync.drawingNo + ' 对应的零件');
  const prev = effectiveStd(sync.partId) || S.standards.filter((s) => s.partId === sync.partId).slice(-1)[0] || null;
  const items = sync.items.map((si) => {
    const pi = prev ? prev.items.find((x) => x.cid === si.cid) : null;
    return Object.assign(clone(si), { gauge: (pi && pi.gauge) || si.gauge || recommendGauge(si.cat), method: pi ? pi.method || '' : '', cls: (pi && pi.cls) || si.cls || '一般', noConcession: pi ? !!pi.noConcession : false, note: pi ? pi.note || '' : '' });
  });
  const code = prev ? prev.code : 'STD-' + partOf(sync.partId).drawingNo.slice(-3);
  const std = { id: 's' + nextSeq(), code, partId: sync.partId, rev: prev ? nextRev(latestRevOfCode(code)) : 'A', drawingRev: sync.drawingRev, status: 'draft', source: 'bubble', syncBatchId: sync.syncBatchId, contentHash: sync.contentHash || '', drawingRef: sync.drawingRef || '', items, createdBy: S.me, createdAt: nowISO(), parentId: prev ? prev.id : null, note: '' };
  std.hash = hashOf(std.items);
  S.standards.unshift(std);
  sync.status = 'drafted'; sync.stdId = std.id;

/**
 * 收到同步结果：进入同步收件箱。
 *   带完整气泡的（离线演示数据、PRD §7.2 balloons[]）直接“待处理”；浏览器消息只带通知的，标记“待拉取”并立即按批次号拉取（32_bubble.js）
 */
function ingestSync(payload, origin) {
  if (!payload || !payload.drawingNo) { toast('收到无效的同步消息（缺少 drawingNo），已忽略', 'warn'); return null; }
  if (payload.syncBatchId && S.syncInbox.some((x) => x.syncBatchId === payload.syncBatchId)) { if (origin !== 'poll') toast('同步批次 ' + payload.syncBatchId + ' 已在收件箱中（按批次号幂等）', 'info'); return null; }
  const part = S.parts.find((p) => p.drawingNo === payload.drawingNo || p.id === payload.partId);
  const items = Array.isArray(payload.balloons) ? balloonsToItems(payload) : Array.isArray(payload.items) ? clone(payload.items) : [];
  const notice = !items.length;
  const rec = {
    id: 'sy' + nextSeq(), syncBatchId: payload.syncBatchId || 'SYNC-' + (9100 + S.seq), drawingNo: payload.drawingNo, drawingRev: payload.drawingRev || '?', partId: part ? part.id : '', at: nowISO(),

  };

  if (origin !== 'poll') toast('收到气泡同步 ' + rec.syncBatchId + '：' + rec.drawingNo + ' Rev ' + rec.drawingRev, 'success');
  const live = S.syncInbox.find((x) => x.id === rec.id);
  if (notice && origin === 'bubble') fetchSyncBatch(live).then((ok) => { if (ok) toast('已拉取 ' + live.syncBatchId + '：' + live.items.length + ' 个气泡，内容摘要一致', 'success'); });
  return live;
}

    const addCount = () => { p.value.groups.push({ key: 'C', type: 'count', name: '计数组', n: 50, ac: 1, re: 2, aql: '1.0', lotRef: 500, earlyReject: true }); itemsView.value.forEach((it) => { if (it.kind === 'count') p.value.assign[it.cid] = 'C'; }); };

/* ---------------- 检验执行（五类检验共用） ---------------- */
COMPONENTS['page-inspect'] = {
  setup() {
    const t = computed(() => taskOf(UI.route.params.id));
    const ridx = ref(0);
    watch(() => (t.value ? t.value.rounds.length : 0), (n) => { ridx.value = Math.max(0, n - 1); }, { immediate: true });
    const round = computed(() => (t.value ? t.value.rounds[Math.min(ridx.value, t.value.rounds.length - 1)] : null));
    const ev = computed(() => (t.value && round.value ? evalRound(t.value, round.value) : null));
    const scene = computed(() => (t.value ? t.value.snap.scene : { steps: [], ctx: [] }));
    const part = computed(() => (t.value ? partOf(t.value.partId) : {}));
    const mItems = computed(() => (t.value ? t.value.snap.items.filter((i) => i.group === 'M') : []));
    const cItems = computed(() => (t.value ? t.value.snap.items.filter((i) => i.group === 'C') : []));
    const cg = computed(() => (t.value ? t.value.snap.groups.find((g) => g.type === 'count') : null));
    const isLast = computed(() => !!t.value && ridx.value >= t.value.rounds.length - 1);
    const active = computed(() => !!round.value && round.value.status === 'active');
    const editable = computed(() => active.value && can('task.measure'));
    const tab = ref('M');
    watch(t, (v) => { if (v) tab.value = v.snap.items.some((i) => i.group === 'M') ? 'M' : 'C'; }, { immediate: true });
    const tabOpts = computed(() => {
      const o = [];
      if (mItems.value.length) o.push({ value: 'M', label: '计量组', count: mItems.value.length });
      if (cItems.value.length) o.push({ value: 'C', label: '计数组', count: cItems.value.length });
      o.push({ value: 'P', label: '照片', count: round.value ? round.value.photos.length : 0 });
      return o;
    });
    const mode = ref(window.innerWidth < 900 ? 'card' : 'grid');
    const cardIdx = ref(0);
    const cardItem = computed(() => mItems.value[Math.min(cardIdx.value, mItems.value.length - 1)] || null);
    const sel = ref(null);
    const selItem = computed(() => (t.value && sel.value ? t.value.snap.items.find((i) => i.cid === sel.value) || null : null));
    const statusMap = computed(() => { const m = {}; if (ev.value) Object.keys(ev.value.byCid).forEach((cid) => { m[cid] = ev.value.byCid[cid].status; }); return m; });
    const pv = computed(() => (ev.value && active.value ? photoViolations(t.value, round.value, ev.value) : []));
    const pvSet = computed(() => new Set(pv.value.map((i) => i.cid)));
    const rep = computed(() => (t.value && round.value ? S.reports.find((x) => x.taskId === t.value.id && x.roundId === round.value.id) || null : null));
    const ncrs = computed(() => (t.value ? ncrsOfTask(t.value.id) : []));
    const ngCids = computed(() => (ev.value ? Object.keys(ev.value.byCid).filter((cid) => ev.value.byCid[cid].status === 'ng') : []));
    const roundOpts = computed(() => (t.value ? t.value.rounds.map((r, i) => ({ value: i, label: '第 ' + r.no + ' 轮' + (r.parent ? '（复检）' : '') + ' · ' + (r.status === 'active' ? '进行中' : STATUS.result[r.result.overall === 'pass' ? 'pass' : r.result.overall === 'fail' ? 'fail' : 'incomplete'][0]) })) : []));

    const touch = () => { if (t.value && t.value.status === 'pending') { t.value.status = 'active'; logAudit('检验', t.value.code, '开始检验'); } };
    const pick = (cid) => {
      sel.value = cid;
      const it = t.value.snap.items.find((i) => i.cid === cid); if (!it) return;
      if (tab.value !== 'P') tab.value = it.group;
      if (it.group === 'M') cardIdx.value = Math.max(0, mItems.value.indexOf(it));
      nextTick(() => { const el = document.getElementById('irow-' + cid); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    };
    const cardGo = (d) => { cardIdx.value = Math.min(mItems.value.length - 1, Math.max(0, cardIdx.value + d)); if (cardItem.value) sel.value = cardItem.value.cid; };

    /* —— 录入格：判定着色、键盘导航、Excel 多格粘贴 —— */
    const cellCls = (it, i) => {
      const st = ev.value.byCid[it.cid].cells[i];
      if (st === 'high' || st === 'low') return 'cell-ng';
      if (st === 'invalid') return 'cell-bad';
      if (st === 'ok') return inWarnBand(round.value.vals[it.cid][i], it) ? 'cell-warn' : 'cell-ok';
      return '';
    };
    const cntCls = (it) => { const raw = String(round.value.cnt[it.cid].bad == null ? '' : round.value.cnt[it.cid].bad).trim(); if (!raw) return ''; if (!/^\d+$/.test(raw)) return 'cell-bad'; return parseInt(raw, 10) > 0 ? 'cell-ng' : 'cell-ok'; };
    const badgeCls = (it) => { const st = statusMap.value[it.cid]; return st === 'ng' ? 'bg-rose-500 text-white ring-rose-200' : st === 'ok' ? 'bg-emerald-500 text-white ring-emerald-200' : it.cls === 'CTQ' ? 'bg-rose-50 text-rose-700 ring-rose-300' : it.cls === 'CC' ? 'bg-amber-50 text-amber-700 ring-amber-300' : 'bg-brand-50 text-brand-700 ring-brand-300'; };
    const rowStat = (it) => {
      const xs = (round.value.vals[it.cid] || []).map((v) => String(v == null ? '' : v).trim()).filter((v) => NUM_RE.test(v));
      if (!xs.length) return null;
      const nums = xs.map(parseFloat), dec = Math.max.apply(null, xs.map((x) => (x.split('.')[1] || '').length));
      return { mean: (sum(nums) / nums.length).toFixed(Math.min(6, dec + 1)), range: (Math.max.apply(null, nums) - Math.min.apply(null, nums)).toFixed(dec) };
    };
    const focusCell = (r, c) => { const el = document.querySelector('input[data-r="' + r + '"][data-c="' + c + '"]'); if (el) { el.focus(); el.select(); return true; } return false; };
    const onCellKey = (e, r, c) => {
      if (e.isComposing) return;
      const el = e.target, n = round.value.samples.length;
      if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); if (!focusCell(r + 1, c) && e.key === 'Enter') focusCell(0, c + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusCell(r - 1, c); }
      else if (e.key === 'ArrowRight' && el.selectionStart === el.value.length && c + 1 < n) { e.preventDefault(); focusCell(r, c + 1); }
      else if (e.key === 'ArrowLeft' && el.selectionEnd === 0 && c > 0) { e.preventDefault(); focusCell(r, c - 1); }
    };
    const onPaste = (e, r, c) => {
      const text = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\r/g, '');
      if (!/[\t\n]/.test(text.trim())) return;
      e.preventDefault();
      let n = 0;
      text.split('\n').filter((ln) => ln.length).forEach((ln, dr) => {
        const it = mItems.value[r + dr]; if (!it) return;
        ln.split('\t').forEach((v, dc) => { if (c + dc < round.value.samples.length) { round.value.vals[it.cid][c + dc] = v.trim(); n++; } });
      });
      touch(); toast('已粘贴 ' + n + ' 个读数，系统已重新判定', 'success');
    };

    /* —— 照片 —— */
    const photoFor = ref(null);
    const photoItem = computed(() => (photoFor.value && t.value ? t.value.snap.items.find((i) => i.cid === photoFor.value) || null : null));
    const photosOf = (cid) => (round.value ? round.value.photos.filter((p) => p.cid === cid) : []);
    const addPhotos = (cid, urls) => { urls.forEach((u) => round.value.photos.push({ id: 'ph' + nextSeq(), url: u, cid, at: nowISO(), by: S.me })); touch(); toast('已添加 ' + urls.length + ' 张照片', 'success'); };
    const removePhoto = (id) => { const i = round.value.photos.findIndex((p) => p.id === id); if (i >= 0) round.value.photos.splice(i, 1); };
    const photoRows = computed(() => (t.value ? t.value.snap.items.filter((i) => photosOf(i.cid).length || pvSet.value.has(i.cid)) : []));

    /* —— 设备导入（POST /api/v1/iot/gage-measurements 的界面模拟） —— */
    const imp = reactive({ open: false, text: '', result: null });
    const fmtLike = (refStr, x) => x.toFixed((String(refStr).split('.')[1] || '').length);
    const demoVal = (it, i, n) => {
      const l = it.lsl ? parseFloat(it.lsl) : null, u = it.usl ? parseFloat(it.usl) : null, refStr = it.usl || it.lsl;
      let x;
      if (l != null && u != null) x = (l + u) / 2 + (u - l) * 0.16 * ((i - (n - 1) / 2) / Math.max(1, n - 1));
      else if (l != null) x = l * (1.03 + i * 0.004);
      else x = u * (0.55 + i * 0.05);
      return fmtLike(refStr, x);
    };
    const genDemoImport = () => {
      const r = round.value, n = r.samples.length, ms = [];
      mItems.value.forEach((it, k) => r.samples.forEach((s, i) => {
        let v = demoVal(it, i, n);
        if (k === 0 && i === Math.min(1, n - 1)) v = it.usl ? fmtLike(it.usl, parseFloat(it.usl) * 1.004 + 0.02) : fmtLike(it.lsl, parseFloat(it.lsl) * 0.97);
        ms.push({ balloonNo: it.no, characteristicId: it.cid, sampleIndex: i + 1, value: v, measuredAt: nowISO() });
      }));
      if (mItems.value[1]) ms[n] = Object.assign({}, ms[n], { value: ms[n].value.replace('.', ',') });
      ms.push({ balloonNo: 99, sampleIndex: 1, value: '1.00', measuredAt: nowISO() });
      imp.text = JSON.stringify({ deviceCode: 'CMM-01', deviceType: 'CMM', inspectionTaskNo: t.value.code, roundNo: r.no, idempotencyKey: 'CMM-01-' + t.value.code + '-R' + r.no + '-' + (r.imports.length + 1), measurements: ms }, null, 1);
      imp.result = null;
    };
    const parseImport = () => {
      const text = imp.text.trim();
      if (!text) { toast('请粘贴设备报文，或点击“生成演示报文”', 'warn'); return; }
      let rows = [], key = '', device = '';
      try { const j = JSON.parse(text); rows = Array.isArray(j) ? j : (j.measurements || []); key = j.idempotencyKey || ''; device = j.deviceCode || ''; }
      catch (e) { rows = text.split(/\n+/).map((ln) => ln.split(/[,\t;]/).map((x) => x.trim())).filter((a) => a.length >= 3 && /^\d+$/.test(a[0])).map((a) => ({ balloonNo: a[0], sampleIndex: a[1], value: a[2] })); }
      const r = round.value;
      key = key || 'H-' + hashOf(text);
      const out = { key, device: device || '未注明设备', dup: r.imports.some((x) => x.key === key), ok: [], oot: [], fmt: [], unknown: 0, overwrite: 0 };
      rows.forEach((m) => {
        const it = t.value.snap.items.find((x) => x.group === 'M' && (m.characteristicId ? x.cid === m.characteristicId : x.no === parseInt(m.balloonNo, 10)));
        const si = parseInt(m.sampleIndex, 10) - 1, v = String(m.value == null ? '' : m.value).trim();
        if (!it || !(si >= 0 && si < r.samples.length)) { out.unknown++; return; }
        const st = judgeValue(v, it);
        if (st === 'invalid' || st === 'missing') { out.fmt.push({ it, si, v }); return; }
        const cur = String(r.vals[it.cid][si] || '').trim();
        if (cur && cur !== v) out.overwrite++;
        (st === 'ok' ? out.ok : out.oot).push({ it, si, v });
      });
      imp.result = out;
    };
    const applyImport = () => {
      const o = imp.result, r = round.value;
      if (!o || o.dup) return;
      o.ok.concat(o.oot).forEach((x) => { r.vals[x.it.cid][x.si] = x.v; });
      const applied = o.ok.length + o.oot.length;
      r.imports.push({ id: 'im' + nextSeq(), key: o.key, device: o.device, at: nowISO(), by: S.me, applied, oot: o.oot.length, fmt: o.fmt.length, unknown: o.unknown });
      touch();
      logAudit('检验', t.value.code, '设备导入 ' + applied + ' 个读数（真实超差 ' + o.oot.length + ' 已入账，格式异常 ' + o.fmt.length + '，无法匹配 ' + o.unknown + '）');
      toast('已导入 ' + applied + ' 个读数' + (o.oot.length ? '，其中 ' + o.oot.length + ' 个真实超差已入账' : ''), o.oot.length ? 'warn' : 'success');
      imp.open = false; imp.text = ''; imp.result = null;
    };

    /* —— 签名提交 —— */
    const sub = reactive({ open: false, reason: '', sig: '' });
    const needSign = computed(() => scene.value.steps.includes('sign'));
    const blockers = computed(() => {
      const b = []; if (!ev.value) return b;
      if (ev.value.c && ev.value.c.dInvalid) b.push('计数组：' + ev.value.c.dInvalid);
      pv.value.forEach((it) => b.push('#' + it.no + ' ' + it.name + ' 需要拍照（' + PHOTO_POLICY[scene.value.photo] + '）'));
      if (ev.value.overall === 'incomplete' && !scene.value.allowInsufficient) b.push('存在缺失项，当前场景不允许以“证据不足”提交');
      return b;
    });
    const missingText = computed(() => {
      if (!ev.value) return '';
      const cells = ev.value.missingCells;
      return cells.slice(0, 8).map((c) => '#' + c.it.no + ' ' + c.s + (c.st === 'invalid' ? '（格式无效）' : '')).join('、') + (cells.length > 8 ? ' 等' : '');
    });
    const overallKey = computed(() => (ev.value ? ev.value.overall : 'incomplete'));
    const cText = computed(() => {
      const c = ev.value && ev.value.c; if (!c) return '';
      if (c.dInvalid) return c.dInvalid + '。';
      if (c.result === 'accept') return 'd = ' + c.d + ' ≤ Ac ' + c.ac + '：批接受。' + (c.d > 0 ? '已发现的 ' + c.d + ' 件不良仍须单独处置（登记 NCR），不因批接受而消除。' : '');
      if (c.result === 'reject') return 'd = ' + c.d + ' ≥ Re ' + c.re + '：批拒收' + (c.allFilled ? '。' : '（已达到 Re，方案允许提前拒收）。');
      return '尚有计数项未录入，且 d = ' + c.d + ' < Re ' + c.re + '：继续抽样检验，禁止提前接受。';
    });
    const cTone = computed(() => { const c = ev.value && ev.value.c; if (!c) return ''; return c.result === 'accept' ? 'bg-emerald-50 text-emerald-900 ring-emerald-600/15' : c.result === 'reject' ? 'bg-rose-50 text-rose-900 ring-rose-600/15' : 'bg-sky-50 text-sky-900 ring-sky-600/15'; });
    const submitLabel = computed(() => (overallKey.value === 'incomplete' ? '以“证据不足”提交' : '确认提交'));
    const canSubmit = computed(() => !blockers.value.length && (!needSign.value || !!sub.sig) && (overallKey.value !== 'incomplete' || !!sub.reason.trim()));
    const openSubmit = () => { sub.reason = round.value.missingReason || ''; sub.sig = ''; sub.open = true; };
    const doSubmit = () => {
      try {
        const r = submitRound(t.value, round.value, { sigImg: sub.sig, missingReason: sub.reason });
        sub.open = false;
        toast('第 ' + round.value.no + ' 轮已提交，报告 ' + r.code + (r.state === 'review' ? ' 进入待复核' : ' 已冻结'), t.value.status === 'pass' ? 'success' : 'warn');
      } catch (e) { toast(e.message, 'error'); }
    };

    /* —— 结论横幅（已提交轮次） —— */
    const resultLabel = computed(() => { const r = round.value; if (!r || !r.result) return ''; return { pass: '符合', fail: '不符合', incomplete: '证据不足' }[r.result.overall]; });
    const bannerCls = computed(() => { const r = round.value; if (!r || !r.result) return ''; return { pass: 'bg-emerald-50 text-emerald-900', fail: 'bg-rose-50 text-rose-900', incomplete: 'bg-amber-50 text-amber-900' }[r.result.overall]; });
    const bannerIcon = computed(() => { const r = round.value; if (!r || !r.result) return 'info'; return { pass: 'check', fail: 'alert', incomplete: 'info' }[r.result.overall]; });
    const resultDesc = computed(() => {
      const r = round.value; if (!r || !r.result) return '';
      const res = r.result, out = [];
      const ng = t.value.snap.items.filter((i) => res.byCid[i.cid] && res.byCid[i.cid].status === 'ng').map((i) => '#' + i.no + ' ' + i.name);
      if (res.m.total) out.push('计量组 ' + res.m.total + ' 项：符合 ' + res.m.ok + '，不符合 ' + res.m.ng + '，缺失 ' + res.m.missing + '。');
      if (res.c) out.push('计数组 n=' + res.c.n + '：不良单位数 d=' + res.c.d + '（Ac ' + res.c.ac + ' / Re ' + res.c.re + '）→ ' + STATUS.result[res.c.result][0] + '。');
      if (ng.length) out.push('不符合项：' + ng.join('、') + '。');
      if (res.overall === 'pass') out.push(res.c ? (res.c.d > 0 ? '批接受不消除已发现的不良，' + res.c.d + ' 件不良仍须单独处置。' : '') : '结论仅覆盖本轮被检样本与项目，不构成整批接受或放行。');
      if (res.overall === 'incomplete') out.push('缺失原因：' + (r.missingReason || '未填写') + '。缺失不等于合格，可发起补测轮次。');
      if (res.overall === 'fail') out.push('原不符合记录永久保留；返工或挑选后请发起复检（新轮次）。');
      return out.join(' ');
    });

    /* —— 登记不合格 / 复检 / 报告预览 —— */
    const openNcr = () => {
      const r = round.value, items = t.value.snap.items.filter((i) => ngCids.value.includes(i.cid));
      const lines = items.map((it) => {
        if (it.group === 'C') return '#' + it.no + ' ' + it.name + '：不良 ' + (r.cnt[it.cid].bad || 0) + ' 件' + (r.cnt[it.cid].note ? '（' + r.cnt[it.cid].note + '）' : '');
        const bad = r.samples.map((s, i) => ({ s, v: r.vals[it.cid][i], st: judgeValue(r.vals[it.cid][i], it) })).filter((x) => x.st === 'high' || x.st === 'low');
        return '#' + it.no + ' ' + it.name + '（' + specText(it) + '）：' + bad.map((x) => x.s + ' = ' + x.v + (x.st === 'high' ? ' 超上限' : ' 低于下限')).join('，');
      });
      UI.newNcr = {
        taskId: t.value.id, roundId: r.id, partId: t.value.partId, cids: ngCids.value.slice(), batch: t.value.ctx.batch || t.value.ctx.wo || '',
        title: part.value.name + ' ' + (items[0] ? items[0].name : '') + (items.length > 1 ? ' 等 ' + items.length + ' 项' : '') + '不符合',
        desc: scene.value.name + ' ' + t.value.code + ' 第 ' + r.no + ' 轮发现：\n' + lines.join('\n'), qtySuspect: t.value.lot || '',
        photos: r.photos.filter((p) => ngCids.value.includes(p.cid)).map((p) => ({ id: p.id, url: p.url })),
      };
    };
    const rt = reactive({ open: false, reason: '', mode: 'new', picks: [], ncrId: '' });
    const lastRound = computed(() => (t.value ? t.value.rounds[t.value.rounds.length - 1] : null));
    const nMeasure = computed(() => { const g = t.value ? t.value.snap.groups.find((x) => x.type === 'measure') : null; return g ? g.n : 0; });
    const openRetest = () => {
      const q = UI.route.query, n = q.ncr ? S.ncrs.find((x) => x.id === q.ncr || x.code === q.ncr) : null;
      rt.reason = n ? n.code + ' 处置后复检' : ''; rt.ncrId = n ? n.id : ''; rt.mode = 'new'; rt.picks = []; rt.open = true;
    };
    const togglePick = (s) => { const i = rt.picks.indexOf(s); if (i >= 0) rt.picks.splice(i, 1); else rt.picks.push(s); };
    const doRetest = () => {
      try {
        const r = createRetestRound(t.value, { reason: rt.reason, sampleMode: rt.mode, samples: rt.picks.slice(), ncrId: rt.ncrId });
        rt.open = false; toast('已发起第 ' + r.no + ' 轮复检，原轮次记录保留', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
    const pvw = ref(null);
    const openPreview = () => {
      const tmp = Object.assign(clone(round.value), { result: summarizeEval(ev.value), submittedAt: null });
      const r = buildReport(S, t.value, tmp, '预览');
      r.state = 'preview'; pvw.value = r;
    };

    /* —— 下一步引导：永远只告诉使用者一件该做的事，点按钮就跳到对应位置 —— */
    const showInfo = ref(false);
    const nextAct = computed(() => {
      const e = ev.value, r = round.value;
      if (!e || !r || r.status !== 'active') return { kind: 'none', text: '', btn: '', perm: 'task.measure', icon: 'check' };
      const m = e.missingCells[0];
      if (m && m.i >= 0) return { kind: 'cell', text: '录入 #' + m.it.no + ' ' + m.it.name + ' 的样本 ' + m.s, btn: '去录入', perm: 'task.measure', icon: 'edit', cid: m.it.cid, i: m.i };
      if (m) return { kind: 'count', text: '登记 #' + m.it.no + ' ' + m.it.name + ' 的不良数（没有不良填 0）', btn: '去登记', perm: 'task.measure', icon: 'edit', cid: m.it.cid };
      if (pv.value.length) return { kind: 'photo', text: '给 #' + pv.value[0].no + ' ' + pv.value[0].name + ' 拍照', btn: '去拍照', perm: 'task.measure', icon: 'camera', cid: pv.value[0].cid };
      return { kind: 'submit', text: '数据已录完，检查后签名提交', btn: '签名提交', perm: 'task.submit', icon: 'pen' };
    });
    const doNext = () => {
      const a = nextAct.value;
      if (a.kind === 'cell') {
        const r = mItems.value.findIndex((x) => x.cid === a.cid);
        tab.value = 'M'; sel.value = a.cid; cardIdx.value = Math.max(0, r);
        nextTick(() => {
          if (mode.value === 'grid') { focusCell(r, a.i); return; }
          const el = document.querySelector('[data-card-cell="' + a.i + '"]'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        });
      } else if (a.kind === 'count') {
        tab.value = 'C'; sel.value = a.cid;
        nextTick(() => { const el = document.querySelector('[data-cnt="' + a.cid + '"]'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
      } else if (a.kind === 'photo') { photoFor.value = a.cid; }
      else if (a.kind === 'submit') openSubmit();
    };
    /* 顶部“这张检验的进度”流程条：点某一步时留在本页，定位到对应的操作 */
    watch(() => UI.flowAct, (a) => {
      if (!a || !t.value || !t.value.rounds.length) return;
      ridx.value = t.value.rounds.length - 1;
      const live = active.value, n = nextAct.value;
      if (a.key === 'measure') {
        if (live && (n.kind === 'cell' || n.kind === 'count')) doNext();
        else { tab.value = mItems.value.length ? 'M' : 'C'; toast(live ? '读数已经录完，可以继续拍照或签名提交' : '这一轮已经提交，数据只能查看', 'info'); }
      } else if (a.key === 'photo') {
        if (live && pv.value.length) photoFor.value = pv.value[0].cid; else tab.value = 'P';
      } else if (a.key === 'sign') {
        if (!live) toast('这一轮已经签名提交', 'info');
        else if (!can('task.submit')) toast(denyTip('task.submit'), 'warn');
        else openSubmit();
      } else if (a.key === 'result') {
        if (rep.value) go('/reports/' + rep.value.id); else toast('签名提交后才有结论和报告', 'info');
      }
    });

    const pipe = computed(() => {
      const st = {}, r = round.value, e = ev.value;
      if (!r || !e) return st;
      const steps = scene.value.steps, has = (k) => steps.includes(k);

      if (r.status === 'submitted') {
        steps.forEach((k) => { st[k] = 'done'; });
        if (has('import') && !r.imports.length) st.import = null;
        if (has('photo') && !r.photos.length) st.photo = null;
        if (has('review')) st.review = rep.value && rep.value.state === 'approved' ? 'done' : rep.value && rep.value.state === 'review' ? 'active' : null;
        return st;
      }
      st.measure = e.progress >= 1 ? 'done' : 'active';
      if (has('import') && r.imports.length) st.import = 'done';
      if (has('photo')) st.photo = pv.value.length ? 'warn' : r.photos.length ? 'done' : null;
      if (e.progress >= 1) st.check = pv.value.length ? 'warn' : 'active';
      return st;
    });

    onMounted(() => {
      if (UI.route.query.retest === '1' && t.value && lastRound.value && lastRound.value.status === 'submitted' && can('task.retest')) openRetest();
    });
    return { t, ridx, round, ev, scene, part, mItems, cItems, cg, isLast, active, editable, tab, tabOpts, mode, cardIdx, cardItem, sel, selItem, statusMap, pv, pvSet, rep, ncrs, ngCids, roundOpts, touch, pick, cardGo, cellCls, cntCls, badgeCls, rowStat, onCellKey, onPaste, photoFor, photoItem, photosOf, addPhotos, removePhoto, photoRows, imp, genDemoImport, parseImport, applyImport, sub, needSign, blockers, missingText, overallKey, cText, cTone, submitLabel, canSubmit, openSubmit, doSubmit, resultLabel, bannerCls, bannerIcon, resultDesc, openNcr, rt, lastRound, nMeasure, openRetest, togglePick, doRetest, pvw, openPreview, pipe, showInfo, nextAct, doNext };
  },
  template: `
<div v-if="t && round && ev" class="space-y-4 pb-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
      <button class="text-xs text-ink-3 hover:text-ink inline-flex items-center gap-1 mb-2" @click="go('/tasks/' + t.scene)"><ic name="chevron-left" :size="13"/>{{ scene.name }}</button>
      <div class="flex flex-wrap items-center gap-2"><h1 class="page-title font-mono">{{ t.code }}</h1><span class="chip" :class="SCENE_META[t.scene].tint">{{ scene.name }}</span><st k="task" :v="t.status" dot/></div>
      <p class="text-xs text-ink-3 mt-1">{{ part.partNo }} {{ part.name }} · {{ ctxText(t) || '无外部单据（独立运行）' }}<button class="link ml-2 inline-flex items-center gap-0.5" @click="showInfo = !showInfo">{{ showInfo ? '收起' : '检验依据与流程' }}<ic name="chevron-down" :size="12" class="transition-transform duration-300" :class="showInfo ? 'rotate-180' : ''"/></button></p>
    </div>
    <div class="flex flex-wrap gap-2">
      <template v-if="active && isLast">
        <button class="btn-ghost" @click="openPreview"><ic name="eye" :size="15"/>预览报告</button>
        <g-btn v-if="scene.steps.includes('import') && mItems.length" perm="task.measure" cls="btn-secondary" icon="cpu" @click="imp.open = true">设备导入</g-btn>
        <g-btn perm="task.submit" cls="btn-primary" icon="pen" @click="openSubmit">签名提交</g-btn>
      </template>
      <template v-else>
        <button v-if="rep" class="btn-secondary" @click="go('/reports/' + rep.id)"><ic name="file" :size="15"/>查看报告</button>
        <g-btn v-if="isLast && ngCids.length" perm="ncr.create" cls="btn-secondary" icon="alert" @click="openNcr">登记不合格</g-btn>
        <g-btn v-if="isLast && t.status !== 'pass'" perm="task.retest" cls="btn-primary" icon="rotate-ccw" @click="openRetest">发起复检</g-btn>
      </template>
    </div>
  </div>

  <div v-show="showInfo" class="card p-5 space-y-4">
    <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-x-6 gap-y-3">
      <kv k="零件" :v="part.partNo + ' ' + part.name"/>
      <kv k="图纸" :v="part.drawingNo + ' Rev ' + t.snap.std.drawingRev" mono/>
      <kv v-if="t.lot" k="批量" :v="t.lot + ' 件'"/>
      <kv v-for="k in scene.ctx.filter(x => t.ctx[x])" :key="k" :k="CTX_FIELDS[k].label" :v="t.ctx[k]"/>
      <kv k="检验员"><span class="inline-flex items-center gap-1.5"><avatar :uid="t.assignee" :size="18"/>{{ userName(t.assignee) }}</span></kv>
      <kv k="截止" :v="fmtTime(t.due)"/>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 rounded-xl bg-[#f7f7f9] px-3.5 py-2.5 text-[12px] text-ink-2">
      <span class="inline-flex items-center gap-1.5 font-medium text-ink"><ic name="lock" :size="13"/>检验依据快照（建单时冻结，执行中不可改）</span>

      <span>标准 <button class="link" @click="go('/standards/' + t.snap.std.id)">{{ t.snap.std.code }} Rev {{ t.snap.std.rev }}</button></span>

      <span>拍照：{{ PHOTO_POLICY[scene.photo || 'none'] }}</span><span>复核：{{ REVIEW_POLICY[scene.review || 'never'] }}</span>

        <span v-for="n in ncrs" :key="n.id" class="inline-flex items-center gap-1.5"><ic name="alert" :size="12"/><button class="underline underline-offset-2" @click="go('/ncr/' + n.id)">{{ n.code }}</button><st k="ncr" :v="n.status"/></span>
      </div>
    </div>
    <img v-if="round.signer && round.signer.img" :src="round.signer.img" class="h-12 rounded-lg bg-white/70 px-2" alt="检验员签名">

      <div class="card p-3 h-[320px] xl:h-[460px]"><drawing-viewer :svg="stdSvg(t.snap.std.id) || part.svg" :items="t.snap.items" :status="statusMap" :selected="sel" focus-on-select @select="pick"/></div>

              <td><button class="btn-icon relative" :class="pvSet.has(it.cid) ? '!text-amber-600 !bg-amber-50' : ''" @click.stop="photoFor = it.cid" :title="pvSet.has(it.cid) ? '该特性需要拍照' : '现场照片'"><ic name="camera" :size="15"/><span v-if="photosOf(it.cid).length" class="absolute -top-0.5 -right-0.5 min-w-[14px] h-[14px] px-0.5 rounded-full bg-brand-600 text-white text-[9px] font-semibold flex items-center justify-center">{{ photosOf(it.cid).length }}</span></button></td>

          <button class="btn-icon" :disabled="cardIdx >= mItems.length - 1" @click="cardGo(1)" aria-label="下一项"><ic name="chevron-right" :size="18"/></button>

          <span v-if="ev.byCid[cardItem.cid].status === 'ok'" class="chip-green">符合</span><span v-else-if="ev.byCid[cardItem.cid].status === 'ng'" class="chip-red">不符合 {{ ev.byCid[cardItem.cid].ng }}</span><span v-else class="chip-gray">待测 {{ ev.byCid[cardItem.cid].miss }}</span>

        </div>
        <div class="mt-5"><div class="label flex items-center gap-2">现场照片<span v-if="pvSet.has(cardItem.cid)" class="chip-amber">需要拍照</span></div><photo-strip :photos="photosOf(cardItem.cid)" :readonly="!editable" @add="addPhotos(cardItem.cid, $event)" @remove="removePhoto"/></div>
        <div class="flex justify-center gap-1.5 mt-5"><button v-for="(it,i) in mItems" :key="it.cid" class="h-1.5 rounded-full transition-all duration-300" :class="[i === cardIdx ? 'w-5 bg-brand-600' : 'w-1.5', i !== cardIdx ? (statusMap[it.cid] === 'ng' ? 'bg-rose-400' : statusMap[it.cid] === 'ok' ? 'bg-emerald-400' : 'bg-black/15') : '']" @click="cardIdx = i; sel = it.cid" :aria-label="'第 ' + (i + 1) + ' 项'"></button></div>
      </div>

      <div v-if="tab === 'C' && cg && ev.c" class="p-4 sm:p-5 space-y-4">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-[12.5px]"><span class="chip-amber">计数抽样 · 一次</span><span>样本量 n = <b>{{ cg.n }}</b></span><span>Ac = <b>{{ cg.ac }}</b></span><span>Re = <b>{{ cg.re }}</b></span><span class="text-ink-4 text-[11.5px]">{{ cg.aql ? 'AQL ' + cg.aql + ' · ' : '' }}方案设定，开检时继承，不可临时修改</span></div>
        <div class="overflow-x-auto"><table class="tbl">
          <thead><tr><th>气泡</th><th>特性 / 判定要求</th><th class="w-[110px]">不良数（件）</th><th>备注</th><th>判定</th><th></th></tr></thead>
          <tbody>
            <tr v-for="it in cItems" :key="it.cid" :id="'irow-' + it.cid" :class="sel === it.cid ? 'bg-amber-50/60' : ''" @click="sel = it.cid">
              <td><span class="balloon-badge" :class="badgeCls(it)">{{ it.no }}</span></td>
              <td class="min-w-[180px]"><div class="font-medium flex items-center gap-1.5">{{ it.name }}<span v-if="it.cls !== '一般'" :class="it.cls === 'CTQ' ? 'chip-red' : 'chip-amber'">{{ it.cls }}</span></div><div class="text-[11px] text-ink-3 mt-0.5">{{ specText(it) }} · {{ gaugeLabel(it.gauge) }}</div></td>
              <td><input class="cell !w-[88px]" :data-cnt="it.cid" :class="cntCls(it)" v-model.trim="round.cnt[it.cid].bad" @input="touch" @focus="sel = it.cid" :disabled="!editable" inputmode="numeric" autocomplete="off" placeholder="未录入"></td>
              <td class="min-w-[160px]"><input class="input !h-8" v-model="round.cnt[it.cid].note" :disabled="!editable" placeholder="缺陷描述（可选）"></td>
              <td class="whitespace-nowrap"><span v-if="ev.byCid[it.cid].status === 'ok'" class="chip-green">无不良</span><span v-else-if="ev.byCid[it.cid].status === 'ng'" class="chip-red">不良 {{ ev.byCid[it.cid].bad }}</span><span v-else class="chip-gray">待录入</span></td>
              <td><button class="btn-icon relative" :class="pvSet.has(it.cid) ? '!text-amber-600 !bg-amber-50' : ''" @click.stop="photoFor = it.cid" :title="pvSet.has(it.cid) ? '该特性需要拍照' : '现场照片'"><ic name="camera" :size="15"/><span v-if="photosOf(it.cid).length" class="absolute -top-0.5 -right-0.5 min-w-[14px] h-[14px] px-0.5 rounded-full bg-brand-600 text-white text-[9px] font-semibold flex items-center justify-center">{{ photosOf(it.cid).length }}</span></button></td>
            </tr>
          </tbody>
        </table></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="rounded-2xl bg-[#f7f7f9] p-4"><div class="label">不良单位数 d</div><input class="cell !w-full !h-10 !text-[15px]" v-model.trim="round.dUnits" @input="touch" :placeholder="'自动 = ' + ev.c.total" :disabled="!editable" inputmode="numeric" autocomplete="off"><p class="text-[11px] text-ink-4 mt-2 leading-relaxed">默认等于各项不良数之和；同一件有多处不良时可下调，但不得小于单项最大值 {{ ev.c.maxb }}。</p></div>
          <div class="md:col-span-2 rounded-2xl p-4 ring-1 ring-inset" :class="cTone"><div class="flex items-center gap-2"><st k="result" :v="ev.c.result"/><span class="font-semibold">d = {{ ev.c.d }} · Ac {{ ev.c.ac }} / Re {{ ev.c.re }}</span></div><p class="text-[12.5px] mt-2 leading-relaxed">{{ cText }}</p></div>
        </div>

      <div v-if="tab === 'P'" class="p-4 sm:p-5 space-y-5">
        <div><div class="label">本轮通用照片（包装、标签、现场环境等）</div><photo-strip :photos="photosOf('')" :readonly="!editable" @add="addPhotos('', $event)" @remove="removePhoto"/></div>
        <div v-for="it in photoRows" :key="it.cid"><div class="label flex items-center gap-2">#{{ it.no }} {{ it.name }}<span v-if="pvSet.has(it.cid)" class="chip-amber">需要拍照</span></div><photo-strip :photos="photosOf(it.cid)" :readonly="!editable" @add="addPhotos(it.cid, $event)" @remove="removePhoto"/></div>
        <p class="text-[11px] text-ink-4 leading-relaxed">拍照要求：{{ PHOTO_POLICY[scene.photo || 'none'] }}。手机端点“拍照”直接调用相机；照片在浏览器端压缩（长边 ≤1280px）后保存。正式系统上传至私有对象存储并记录文件摘要。</p>
        <div v-if="round.imports.length" class="pt-4 border-t border-black/[0.06]"><div class="label">设备导入记录</div><div v-for="x in round.imports" :key="x.id" class="text-[12px] text-ink-2 py-1">{{ fmtTime(x.at) }} · {{ x.device }} · 入账 {{ x.applied }}（真实超差 {{ x.oot }}）· 格式异常 {{ x.fmt }} · 无法匹配 {{ x.unknown }} · 幂等键 <span class="font-mono text-ink-4">{{ x.key }}</span></div></div>
      </div>

  <div v-if="active && isLast" class="sticky bottom-4 z-20">
    <div class="glass rounded-2xl shadow-lift ring-1 ring-black/[0.06] px-4 py-3 flex flex-wrap items-center gap-x-5 gap-y-2">
      <div class="flex items-center gap-3 min-w-[200px] flex-1">
        <div class="flex-1 h-2 rounded-full bg-black/[0.07] overflow-hidden"><div class="h-full rounded-full bg-brand-500 transition-all duration-700 ease-apple" :style="{ width: Math.round(ev.progress * 100) + '%' }"></div></div>
        <span class="text-[12px] tabular text-ink-3 whitespace-nowrap">已录 {{ ev.filled }} / {{ ev.total }}</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 text-[12px]">
        <span v-if="ev.m.total" class="chip-green">符合 {{ ev.m.ok }}</span><span v-if="ev.m.ng" class="chip-red">不符合 {{ ev.m.ng }}</span><span v-if="ev.m.missing" class="chip-gray">待测 {{ ev.m.missing }}</span>

      <photo-strip :photos="photosOf(photoFor)" :readonly="!editable" size="w-28 h-28" @add="addPhotos(photoFor, $event)" @remove="removePhoto"/>

  <modal :open="sub.open" @close="sub.open = false" title="签名提交本轮检验" :sub="t.code + ' · 第 ' + round.no + ' 轮'" width="max-w-2xl">
    <div class="space-y-5">
      <section>
        <div class="flex items-center gap-2 mb-2"><span class="w-5 h-5 rounded-full bg-brand-600 text-white text-[11px] font-semibold flex items-center justify-center">1</span><span class="font-semibold">完整性检查</span></div>
        <div v-if="!ev.missingCells.length && !blockers.length" class="rounded-xl bg-emerald-50 text-emerald-800 px-3.5 py-2.5 text-[12.5px] flex items-center gap-2"><ic name="check" :size="14"/>全部 {{ ev.total }} 个读数已录入，拍照要求已满足。</div>
        <div v-if="blockers.length" class="rounded-xl bg-rose-50 text-rose-800 px-3.5 py-2.5 text-[12.5px] space-y-1"><div class="font-medium">以下问题必须先处理：</div><div v-for="b in blockers" :key="b">· {{ b }}</div></div>
        <div v-if="ev.missingCells.length" class="rounded-xl bg-amber-50 text-amber-900 px-3.5 py-2.5 text-[12.5px] mt-2">
          <div class="font-medium">缺失 {{ ev.missingCells.length }} 个读数：{{ missingText }}</div>
          <p class="mt-1 opacity-90">缺失不等于合格，也不会补零。可以返回补测；或填写原因后以“证据不足”提交，之后通过新轮次补测。</p>
          <textarea v-model="sub.reason" rows="2" class="textarea mt-2" placeholder="缺失原因，例如：样本 S5 外送理化检测，结果未回"></textarea>
        </div>
      </section>
      <section>
        <div class="flex items-center gap-2 mb-2"><span class="w-5 h-5 rounded-full bg-brand-600 text-white text-[11px] font-semibold flex items-center justify-center">2</span><span class="font-semibold">系统判定</span><st k="result" :v="overallKey"/></div>
        <div class="rounded-xl bg-[#f7f7f9] px-3.5 py-2.5 text-[12.5px] text-ink-2 space-y-1 leading-relaxed">
          <div v-if="ev.m.total">计量组 {{ ev.m.total }} 项：符合 {{ ev.m.ok }}，不符合 {{ ev.m.ng }}，缺失 {{ ev.m.missing }}。<span v-if="!ev.c && overallKey === 'pass'">结论仅覆盖本轮被检样本与项目，不构成整批接受。</span></div>
          <div v-if="ev.c">计数组：{{ cText }}</div>
          <div class="text-[11.5px] text-ink-4">判定由系统按建单时冻结的规格执行；提交后内容冻结，只能通过新轮次复检或追加更正。</div>
        </div>
      </section>
      <section v-if="needSign">
        <div class="flex items-center gap-2 mb-2"><span class="w-5 h-5 rounded-full bg-brand-600 text-white text-[11px] font-semibold flex items-center justify-center">3</span><span class="font-semibold">电子签名</span><span class="text-[11.5px] text-ink-4">{{ who().name }} · {{ ROLES[who().role].name }}</span></div>
        <signature-pad v-model="sub.sig" :signer="who().name"/>
      </section>
    </div>
    <template #footer><button class="btn-secondary" @click="sub.open = false">返回补测</button><button class="btn-primary" :disabled="!canSubmit" @click="doSubmit"><ic name="check" :size="15"/>{{ submitLabel }}</button></template>
  </modal>

  <modal :open="imp.open" @close="imp.open = false" title="设备数据导入" sub="CMM / 电子量具 / Excel 报文按气泡特性回填，对应接口 POST /api/v1/iot/gage-measurements" width="max-w-3xl">
    <div class="space-y-3">
      <div class="flex flex-wrap items-center gap-2"><button class="btn-soft btn-sm" @click="genDemoImport"><ic name="sparkles" :size="14"/>生成演示报文（模拟 CMM-01）</button><span class="text-[11px] text-ink-4">也可粘贴 JSON 报文，或每行“气泡号,样本序号,实测值”的文本</span></div>
      <textarea v-model="imp.text" rows="9" class="textarea font-mono !text-[11.5px]" placeholder="粘贴设备报文…" @input="imp.result = null"></textarea>

        <div v-if="imp.result.dup" class="rounded-xl bg-amber-50 text-amber-900 px-3.5 py-2.5 text-[12.5px]">重复导入：幂等键 <span class="font-mono">{{ imp.result.key }}</span> 已导入过，不会重复入账。</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">
          <div class="rounded-xl bg-emerald-50 py-3"><div class="text-xl font-semibold tabular text-emerald-700">{{ imp.result.ok.length }}</div><div class="text-[11px] text-ink-3">符合，可入账</div></div>
          <div class="rounded-xl bg-rose-50 py-3"><div class="text-xl font-semibold tabular text-rose-700">{{ imp.result.oot.length }}</div><div class="text-[11px] text-ink-3">真实超差，必须入账</div></div>
          <div class="rounded-xl bg-amber-50 py-3"><div class="text-xl font-semibold tabular text-amber-700">{{ imp.result.fmt.length }}</div><div class="text-[11px] text-ink-3">格式异常，不入账</div></div>
          <div class="rounded-xl bg-black/[0.04] py-3"><div class="text-xl font-semibold tabular text-ink-2">{{ imp.result.unknown }}</div><div class="text-[11px] text-ink-3">无法匹配特性 / 样本</div></div>
        </div>
        <div v-if="imp.result.oot.length" class="text-[12px] text-rose-700 leading-relaxed">真实超差：<span v-for="(x,i) in imp.result.oot" :key="i" class="mr-3 font-mono">#{{ x.it.no }} {{ round.samples[x.si] }} = {{ x.v }}</span></div>

        <div v-if="imp.result.overwrite" class="text-[12px] text-ink-3">将覆盖 {{ imp.result.overwrite }} 个已录入的草稿值（本轮尚未提交）。</div>
      </div>
    </div>
    <template #footer><button class="btn-secondary" @click="imp.open = false">取消</button><button class="btn-secondary" @click="parseImport">解析预览</button><button class="btn-primary" :disabled="!imp.result || imp.result.dup || !(imp.result.ok.length + imp.result.oot.length)" @click="applyImport">导入 {{ imp.result ? imp.result.ok.length + imp.result.oot.length : 0 }} 个读数</button></template>
  </modal>

  <modal :open="rt.open" @close="rt.open = false" title="发起复检（新轮次）" sub="复检不覆盖原轮次：原不符合记录永久保留；不能改变抽样策略类型" width="max-w-xl">

    mItems() { return this.c.items.filter((i) => i.group === 'M'); },
    cItems() { return this.c.items.filter((i) => i.group === 'C'); },
    cg() { return this.c.groups.find((g) => g.type === 'count') || null; },
    svg() { const s = this.c.std && stdSvg(this.c.std.id); if (s) return s; const p = S.parts.find((x) => x.partNo === this.c.part.partNo); return p ? svgOf(p) : ''; },
    statusMap() { const m = {}, b = this.c.result.byCid; Object.keys(b).forEach((k) => { m[k] = b[k].status; }); return m; },
    stamp() { return { pass: ['符 合', '#059669'], fail: ['不 符 合', '#e11d48'], incomplete: ['证据不足', '#d97706'] }[this.c.result.overall]; },
    ctxRows() {
      const ctx = this.c.task.ctx || {};
      const cells = Object.keys(CTX_FIELDS).filter((k) => ctx[k]).map((k) => [CTX_FIELDS[k].label, ctx[k], 1]);
      const rows = [];
      for (let i = 0; i < cells.length; i += 3) rows.push(cells.slice(i, i + 3));
      const last = rows[rows.length - 1];
      if (last && last.length < 3) last[last.length - 1][2] = 1 + (3 - last.length) * 2;
      return rows;
    },
    conclusion() {
      const r = this.c.result, out = [];
      if (r.m.total) out.push('计量特性 ' + r.m.total + ' 项：符合 ' + r.m.ok + ' 项，不符合 ' + r.m.ng + ' 项，缺失 ' + r.m.missing + ' 项。');
      if (r.c) out.push('计数抽样：不良单位数 d = ' + r.c.d + '，' + (r.c.result === 'accept' ? '不大于 Ac，批接受' : r.c.result === 'reject' ? '达到 Re，批拒收' : '证据不完整，未作批判定') + '。');
      if (r.overall === 'pass') out.push(r.c ? '本轮检验结论：符合。' + (r.c.d > 0 ? '已发现的不良品另行处置，不因批接受而消除。' : '') : '本轮检验结论：符合。本结论仅覆盖本轮实际被检样本与项目，不构成整批接受或放行。');
      else if (r.overall === 'fail') out.push('本轮检验结论：不符合。不符合项已在上表标示，处置见不合格处置单。');
      else out.push('本轮检验结论：证据不足（缺失原因：' + (this.c.round.missingReason || '未填写') + '）。缺失项未作任何补值。');

  const done = pts.filter((p) => p.status === 'pass' || p.status === 'fail' || p.status === 'insufficient').length;
  const state = pts.some((p) => p.status === 'fail') ? 'fail' : pts.some((p) => p.status === 'active' || p.status === 'pending' || p.status === 'insufficient') ? 'active' : done && done === pts.length ? 'pass' : done ? 'active' : 'none';
  return { pts, done, total: pts.length, state };
}
/** 在工单的某个检验点上开检：只有一个可用方案时直接开单，否则打开向导补充信息 */
function startPoint(o, x) {
  const plans = plansFor(o.partId, x.b.scene);
  const ctx = { wo: o.wo, op: x.key };
  if (x.b.freq) ctx.freq = x.b.freq;
  const cg = plans.length === 1 ? plans[0].groups.find((g) => g.type === 'count') : null;
  if (plans.length === 1 && (!cg || o.qty >= 1)) {
    try {
      const t = createTask({ scene: x.b.scene, planId: plans[0].id, lot: cg ? String(o.qty) : '', ctx });
      toast('已开单 ' + t.code + '，开始检验', 'success');
      go('/inspect/' + t.id);
    } catch (e) { toast(e.message, 'error'); }
    return;
  }
  UI.newTask = { scene: x.b.scene, partId: o.partId, ctx, lot: o.qty || '' };
}

    const part = computed(() => partOf(w.partId));

    const partList = computed(() => S.parts.map((p) => ({ p, scenes: S.scenes.filter((sc) => sc.enabled && plansFor(p.id, sc.code).length) })));
    const opGroups = computed(() => (part.value.route ? part.value.route.ops : []).map((op) => ({ op, pts: op.insp.map((b) => ({ b, key: opKeyOf(op), ok: !!sceneOf(b.scene).enabled && plansFor(w.partId, b.scene).length > 0 })) })));
    const hasPoints = computed(() => opGroups.value.some((g) => g.pts.length));
    const freeScenes = computed(() => S.scenes.filter((sc) => sc.enabled && plansFor(w.partId, sc.code).length));
    const plans = computed(() => (w.partId && w.scene ? plansFor(w.partId, w.scene) : []));
    const plan = computed(() => planOf(w.planId));
    const std = computed(() => (plan.value ? stdOf(plan.value.stdId) : null));
    const cg = computed(() => (plan.value ? plan.value.groups.find((g) => g.type === 'count') || null : null));
    const itemCount = computed(() => (plan.value ? Object.values(plan.value.assign).filter((a) => a !== '-').length : 0));
    const fields = computed(() => (scene.value.ctx || []).filter((k) => k !== 'op' && k !== 'freq').map((k) => Object.assign({ key: k }, CTX_FIELDS[k])));
    const people = computed(() => S.users.filter((u) => u.role === 'insp' || u.role === 'qe'));
    const subs = ['先选要检的零件', '这次检的是哪道工序、哪种检验', '确认信息后开始检验'];

    const toConfirm = () => {
      if (!plans.value.some((p) => p.id === w.planId)) w.planId = plans.value[0] ? plans.value[0].id : '';
      const keys = scene.value.ctx || [];
      if (keys.includes('supplier') && !w.ctx.supplier) w.ctx.supplier = S.suppliers[0];
      if (keys.includes('customer') && !w.ctx.customer) w.ctx.customer = S.customers.includes(part.value.customer) ? part.value.customer : S.customers[0];
      if (keys.includes('batch') && !w.ctx.batch) w.ctx.batch = dateCode() + '-' + String.fromCharCode(65 + (S.seq % 26));
      if (cg.value && !String(w.lot).trim()) w.lot = String(cg.value.lotRef || '');
      w.step = 3;
    };
    const pickPoint = (x) => { if (!x.ok) { toast('这个检验点还没有适用的生效方案，请先编制检验方案', 'warn'); return; } w.scene = x.b.scene; w.op = x.key; w.freq = x.b.freq || ''; w.planId = ''; w.lot = ''; toConfirm(); };
    const pickScene = (sc) => { w.scene = sc.code; w.op = ''; w.freq = ''; w.planId = ''; w.lot = ''; toConfirm(); };
    const pickPart = (p) => {
      w.partId = p.id; w.op = ''; w.freq = ''; w.planId = ''; w.lot = '';
      if (w.scene) {
        const pts = [];
        opGroups.value.forEach((g) => g.pts.forEach((x) => { if (x.b.scene === w.scene && x.ok) pts.push(x); }));
        if (pts.length === 1) { pickPoint(pts[0]); return; }
        if (!pts.length && plansFor(p.id, w.scene).length) { toConfirm(); return; }
      }
      w.step = 2;
    };
    watch(() => UI.newTask, (v) => {
      if (!v) return;
      const ctx = Object.assign({}, v.ctx || {});
      Object.assign(w, { step: 1, partId: v.partId || '', scene: v.scene || '', op: ctx.op || '', freq: ctx.freq || '', planId: v.planId || '', lot: v.lot ? String(v.lot) : '' });

      w.assignee = me.value.role === 'insp' ? S.me : (S.users.find((u) => u.role === 'insp') || me.value).id;

      else if (w.partId) w.step = 2;
    });
    const close = () => { UI.newTask = null; };
    const back = () => { if (w.step > 1) w.step -= 1; };
    const create = () => {
      try {
        const ctx = {};
        Object.keys(w.ctx).forEach((k) => { const v = String(w.ctx[k] == null ? '' : w.ctx[k]).trim(); if (v) ctx[k] = v; });
        if (w.op) ctx.op = w.op;
        if (w.freq) ctx.freq = w.freq;
        const t = createTask({ scene: w.scene, planId: w.planId, lot: w.lot, ctx, assignee: w.assignee });
        if (ctx.wo && !S.orders.some((o) => o.wo === ctx.wo)) S.orders.unshift({ id: 'o' + nextSeq(), wo: ctx.wo, partId: t.partId, qty: t.lot || 0, createdAt: nowISO(), createdBy: S.me });

        go('/inspect/' + t.id);
      } catch (e) { toast(e.message, 'error'); }
    };
    const toForm = () => {
      const ctx = Object.assign({}, w.ctx);

      if (w.freq) ctx.freq = w.freq;
      UI.newTaskMode = 'form';
      UI.newTask = { scene: w.scene || 'IQC', partId: w.partId, planId: w.planId, ctx };
    };
    return { w, open, part, scene, partList, opGroups, hasPoints, freeScenes, plans, plan, std, cg, itemCount, fields, people, subs, pickPart, pickPoint, pickScene, close, back, create, toForm };

COMPONENTS['role-flow'] = {

    const state = (s, i) => (i === curIdx.value ? 'current' : linear.value && i < curIdx.value ? 'done' : s.n > 0 ? 'todo' : 'idle');

/* ===== 50_ncr.js ===== */
/* =====================================================================
 * 页面 C：不合格处置（NCR）与质量限制（Hold）
 *   规则要点：NCR 只管“本次处置”；NCR 不自动冻结整批，质量限制须明确范围与受限动作；
 *   处置建议 ≠ 批准；处置数量合计须等于确认不合格数量（一批多去向）；返工类处置后复检走检验新轮次；
 *   NCR、质量限制各自关闭，互不替代。
 * ===================================================================== */

const NCR_REWORK = ['返工', '返修', '挑选'];
const HOLD_SCOPES = ['批次', '工单', '收货单', '发货单', '序列号范围'];
const SEVERITIES = ['轻微', '一般', '严重'];
const SEV_CHIP = { 轻微: 'chip-gray', 一般: 'chip-amber', 严重: 'chip-red' };

function ncrLog(n, text) { n.log.push({ at: nowISO(), by: S.me, text }); logAudit('NCR', n.code, text); }
function ncrLines(n) { return n.disp.filter((d) => !d.rejected); }
function ncrAllocated(n) { return sum(ncrLines(n).map((d) => d.qty)); }
function ncrRemaining(n) { return Math.max(0, (n.qtyConfirmed || 0) - ncrAllocated(n)); }
function ncrItems(n) {
  const all = [];
  S.standards.filter((s) => s.partId === n.partId).forEach((s) => s.items.forEach((i) => { if (!all.some((x) => x.cid === i.cid)) all.push(i); }));
  return (n.cids || []).map((cid) => all.find((i) => i.cid === cid)).filter(Boolean);
}
/** 该 NCR 关联的复检轮次（返工后复检，A09） */
function ncrRetests(n) {
  const t = n.taskId ? taskOf(n.taskId) : null;
  return t ? t.rounds.filter((r) => r.ncrId === n.id) : [];
}
function lineState(d) { return d.rejected ? ['已退回', 'chip-gray'] : d.executed ? ['已执行', 'chip-green'] : d.approved ? ['已批准，待执行', 'chip-blue'] : ['建议，待批准', 'chip-amber']; }

/* ---------------- NCR 详情 ---------------- */
COMPONENTS['page-ncr'] = {
  setup() {
    const n = computed(() => S.ncrs.find((x) => x.id === UI.route.params.id) || null);
    const task = computed(() => (n.value && n.value.taskId ? taskOf(n.value.taskId) : null));
    const items = computed(() => (n.value ? ncrItems(n.value) : []));
    const stepIdx = computed(() => (n.value ? (n.value.status === 'closed' ? NCR_FLOW.length : NCR_FLOW.findIndex((x) => x[0] === n.value.status)) : 0));
    const lines = computed(() => (n.value ? n.value.disp : []));
    const allocated = computed(() => (n.value ? ncrAllocated(n.value) : 0));
    const remaining = computed(() => (n.value ? ncrRemaining(n.value) : 0));
    const retests = computed(() => (n.value ? ncrRetests(n.value) : []));
    const hasRework = computed(() => !!n.value && ncrLines(n.value).some((d) => NCR_REWORK.includes(d.action)));
    const retestPassed = computed(() => retests.value.some((r) => r.status === 'submitted' && r.result && r.result.overall === 'pass'));
    const activeHolds = computed(() => (n.value ? n.value.holds.filter((h) => h.status === 'active') : []));
    const noConcession = computed(() => items.value.filter((i) => i.noConcession));
    const open = computed(() => !!n.value && n.value.status !== 'closed');

    /* —— 范围确认 —— */
    const sc = reactive({ open: false, suspect: '', confirmed: '', hold: false, scopeType: '批次', scopeVal: '', actions: ['use', 'ship'] });
    const openScope = () => { const x = n.value; Object.assign(sc, { open: true, suspect: String(x.qtySuspect || ''), confirmed: String(x.qtyConfirmed || ''), hold: x.status === 'registered' && !x.holds.length, scopeType: '批次', scopeVal: x.batch || '', actions: ['use', 'ship'] }); };
    const saveScope = () => {
      const x = n.value, s = parseInt(sc.suspect, 10), c = parseInt(sc.confirmed, 10);
      if (!/^\d+$/.test(sc.suspect.trim()) || !/^\d+$/.test(sc.confirmed.trim())) { toast('数量须为整数', 'error'); return; }
      if (c < 1) { toast('确认不合格数量至少为 1', 'error'); return; }
      if (c > s) { toast('确认不合格数量不能大于可疑数量', 'error'); return; }
      if (c < ncrAllocated(x)) { toast('确认不合格数量不能小于已分配的处置数量 ' + ncrAllocated(x), 'error'); return; }
      if (sc.hold && (!sc.scopeVal.trim() || !sc.actions.length)) { toast('建立质量限制需要写明范围和至少一个受限动作', 'error'); return; }
      x.qtySuspect = s; x.qtyConfirmed = c;
      if (x.status === 'registered') x.status = 'scoped';
      ncrLog(x, '确认范围：可疑 ' + s + ' 件，确认不合格 ' + c + ' 件');
      if (sc.hold) addHold(x, sc.scopeType, sc.scopeVal.trim(), sc.actions.slice());
      sc.open = false; toast('范围已确认，可以提出处置建议', 'success');
    };

    /* —— 质量限制 —— */
    const addHold = (x, scopeType, scopeVal, actions) => {
      x.holds.push({ id: 'h' + nextSeq(), scopeType, scopeVal, actions, status: 'active', by: S.me, at: nowISO() });
      ncrLog(x, '建立质量限制（' + scopeType + ' ' + scopeVal + '）：禁止' + actions.map((a) => HOLD_ACTIONS[a]).join('、'));
    };
    const hd = reactive({ open: false, scopeType: '批次', scopeVal: '', actions: ['ship'] });
    const openHold = () => { Object.assign(hd, { open: true, scopeType: '批次', scopeVal: n.value.batch || '', actions: ['ship'] }); };
    const saveHold = () => {
      if (!hd.scopeVal.trim() || !hd.actions.length) { toast('请写明范围，并至少选择一个受限动作', 'error'); return; }
      addHold(n.value, hd.scopeType, hd.scopeVal.trim(), hd.actions.slice()); hd.open = false; toast('质量限制已建立，只限制所选范围与动作', 'success');
    };
    const rl = reactive({ open: false, id: '', note: '' });
    const openRelease = (h) => { Object.assign(rl, { open: true, id: h.id, note: '' }); };
    const saveRelease = () => {
      const h = n.value.holds.find((x) => x.id === rl.id);
      if (!h || !rl.note.trim()) { toast('请填写解除依据', 'error'); return; }
      Object.assign(h, { status: 'released', releasedBy: S.me, releasedAt: nowISO(), releaseNote: rl.note.trim() });
      ncrLog(n.value, '解除质量限制（' + h.scopeType + ' ' + h.scopeVal + '）：' + rl.note.trim() + '。只解除这一项，其它限制不受影响');
      rl.open = false; toast('已解除该项质量限制', 'success');
    };

    /* —— 处置行（MRB） —— */
    const dp = reactive({ open: false, action: '返工', qty: '', reason: '' });
    const actionChoices = computed(() => (me.value.role === 'pm' ? NCR_REWORK : DISPOSITIONS));
    const openDisp = () => { Object.assign(dp, { open: true, action: actionChoices.value[0], qty: String(remaining.value || ''), reason: '' }); };
    const saveDisp = () => {
      const x = n.value, q = parseInt(dp.qty, 10);

 * 页面 D：基础资料 —— 零部件 / 工序路线与模板 / 检验场景与流程步骤 / 检具与检验方法

 *   · 流程步骤库 → 五类检验场景 = 固定步骤的有序组合 + 参数（不做任意 BPM）
 *   · 工序路线模板 → 应用到零件后生成独立副本（模板后续修改不回写）

const GAUGE_CATS = ['线性尺寸', '角度尺寸', '形位公差', '螺纹', '表面粗糙度', '倒角', '外观', '理化', '功能', '焊接'];

function blankDrawing(p) {
  return FRAME + '<text x="430" y="210" text-anchor="middle" font-size="16" fill="#94a3b8">图纸待从气泡软件同步</text><text x="430" y="236" text-anchor="middle" font-size="11" fill="#cbd5e1">在“气泡识别工作台”完成标注并冻结后，气泡会显示在这里</text>' + titleBlock({ partNo: p.partNo, name: p.name, dwg: p.drawingNo, rev: p.drawingRev, mat: p.material || '—' });
}
function routePoints(ops) { return sum((ops || []).map((o) => o.insp.length)); }
function applyRouteTo(part, tpl) {
  part.route = { templateId: tpl.id, templateRev: tpl.rev, appliedAt: nowISO(), ops: clone(tpl.ops) };
  logAudit('工序路线', part.partNo, '应用模板「' + tpl.name + '」Rev ' + tpl.rev + '，生成独立路线副本（' + tpl.ops.length + ' 道工序、' + routePoints(tpl.ops) + ' 个检验点）');
}

    const std = computed(() => effectiveStd(p.value.id));
    const plans = computed(() => S.plans.filter((x) => x.partId === p.value.id && x.status !== 'retired'));
    const tasks = computed(() => S.tasks.filter((t) => t.partId === p.value.id).slice(0, 5));

    const tpl = computed(() => (p.value.route ? S.routeTemplates.find((t) => t.id === p.value.route.templateId) || null : null));
    const stale = computed(() => !!tpl.value && tpl.value.rev > p.value.route.templateRev);
    const points = computed(() => { const out = []; (p.value.route ? p.value.route.ops : []).forEach((op) => op.insp.forEach((b) => out.push({ op, b, ok: plansFor(p.value.id, b.scene).length > 0 }))); return out; });

COMPONENTS['page-routes'] = {
  setup() {
    const tab = ref('tpl');
    const users = (t) => S.parts.filter((p) => p.route && p.route.templateId === t.id);
    const ed = reactive({ open: false, id: '', name: '', desc: '', ops: [] });
    const drag = ref(-1);
    const keyed = (ops) => clone(ops).map((o, i) => Object.assign(o, { _k: 'k' + i + '-' + nextSeq() }));
    const openEdit = (t) => { Object.assign(ed, { open: true, id: t.id, name: t.name, desc: t.desc || '', ops: keyed(t.ops) }); };
    const openNew = () => { Object.assign(ed, { open: true, id: '', name: '', desc: '', ops: keyed([{ no: '10', name: '', wc: '', insp: [] }]) }); };
    const copyTpl = (t) => { Object.assign(ed, { open: true, id: '', name: t.name + '（副本）', desc: t.desc || '', ops: keyed(t.ops) }); };
    const addOp = () => { const last = ed.ops[ed.ops.length - 1]; const no = last && /^\d+$/.test(last.no) ? String(parseInt(last.no, 10) + 10) : String((ed.ops.length + 1) * 10); ed.ops.push({ no, name: '', wc: '', insp: [], _k: 'k-' + nextSeq() }); };
    const removeOp = (i) => { ed.ops.splice(i, 1); };
    const hasInsp = (op, c) => op.insp.some((b) => b.scene === c);
    const toggleInsp = (op, c) => { const i = op.insp.findIndex((b) => b.scene === c); if (i >= 0) op.insp.splice(i, 1); else op.insp.push(c === 'IPQC' ? { scene: c, freq: '每 2 小时' } : { scene: c }); };
    const ipqc = (op) => op.insp.find((b) => b.scene === 'IPQC') || null;
    const onDragStart = (i, e) => { drag.value = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); };
    const onDragOver = (i) => { if (drag.value < 0 || drag.value === i) return; const x = ed.ops.splice(drag.value, 1)[0]; ed.ops.splice(i, 0, x); drag.value = i; };
    const onDragEnd = () => { drag.value = -1; };
    const save = () => {

      return ['有效至 ' + fmtDate(g.calDue), 'chip-green'];
    };

      if (g) { Object.assign(g, { name: ed.name.trim(), alias: ed.alias.trim(), kind: ed.kind, precision: ed.precision.trim(), cats: ed.cats.slice(), items }); logAudit('检具方法', g.name, '修改'); }

function downloadText(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
