/* 交付工作台，保留工单色系，现场操作只用一列主表单。 */
.hw-root { --hw-ink:#163537;--hw-dim:#4b6564;--hw-main:#0a6865;--hw-edge:#cadad5;--hw-soft:#e8f1ed; min-height:100vh;min-height:100dvh;background:#f2f5f2;color:var(--hw-ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; container:workshop / inline-size; }
.hw-root *, .hw-root *::before, .hw-root *::after { box-sizing:border-box; }
.hw-root :where(h1,h2,h3,p,ol,ul,fieldset){ margin:0; }
.hw-root :where(ul,ol) { padding:0; list-style:none; }
.hw-root :where(button,input,select) { font:inherit; }
.hw-root button { cursor:pointer; }
.hw-root :where(button,input,summary):focus-visible { outline:3px solid #c59125;outline-offset:2px; }
.hw-root input { border:1px solid #a1b9b4;background:white;color:var(--hw-ink);border-radius:7px;min-height:44px;width:100%;padding:8px 10px; }
.hw-root label { display:block;font-size:13px;font-weight:650; }
.hw-root label>input { display:block;margin-top:5px;font-weight:500; }
.hw-root button {border:1px solid transparent;background:transparent;color:var(--hw-main);font-size:13px;font-weight:650;}
.hw-root button:disabled{cursor:default;}
.hw-top { display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:53px;background:white;border-bottom:1px solid var(--hw-edge);padding:4px max(16px,calc((100% - 1140px)/2)); }
.hw-brand,.hw-tools,.hw-tools button,.hw-code,.hw-state,.hw-steps li,.hw-steps i,.hw-role,.hw-readrow,.hw-number,.hw-readrow strong,.hw-notice,.hw-photo,.hw-primary,.hw-closure,.hw-checks li,.hw-dialog>header {display:flex;align-items:center;}
.hw-brand {gap:9px;white-space:nowrap;font-size:14px;}
.hw-brand span {background:#145c5e;color:white;display:grid;place-items:center;width:30px;height:30px;border-radius:6px;font-weight:750;font-size:18px;}
.hw-tools {gap:6px; flex-wrap:wrap;justify-content:flex-end;}
.hw-tools button {gap:4px;min-height:38px;padding:0 9px;border-radius:6px;}
.hw-tools button:hover,.hw-tools button[aria-pressed="true"] {background:var(--hw-soft);}
.hw-body {max-width:1180px;margin:auto;padding:23px 20px 40px;}
.hw-orderhead {display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hw-code {gap:9px;font:650 13px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.04em;}
.hw-code span {font:500 11px/1.6 sans-serif;letter-spacing:0;border-radius:4px;border:1px solid #a9c0b7;padding:0 5px;color:#45615b;}
.hw-orderhead h1 {margin:4px 0 2px;font-size:clamp(24px,2.4vw,34px);line-height:1.22;letter-spacing:-.035em;font-weight:720;}
.hw-orderhead p:not(.hw-code), .hw-operation p,.hw-side small,.hw-persist,.hw-dialog-body p {color:var(--hw-dim);font-size:13px;}
.hw-state {gap:6px;background:#dfebe5;padding:5px 9px;border-radius:6px;font-size:13px;font-weight:650;}
.hw-state.held {background:#f8e4e5;color:#7c3041;}
.hw-state.done {background:#dcefe2;color:#24543c;}
.hw-steps {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:18px 0;}
.hw-steps li {gap:7px;min-height:40px;border-bottom:2px solid #c8d5ce;color:#506560;font-size:13px;}
.hw-steps i {justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid #b4c9c0;font:600 12px ui-monospace,Menlo,monospace;}
.hw-steps li[aria-current="step"] {border-color:var(--hw-main);color:#084f50;font-weight:720;}
.hw-steps li[aria-current="step"] i {color:white;background:#0b6260;border-color:#0b6260;}
.hw-steps li.passed i {color:#246747;background:#dcece2;}
.hw-steps li.skipped {border-bottom-style:dashed;}
.hw-grid {display:grid;grid-template-columns:minmax(0,1.65fr) minmax(235px,1fr);align-items:start;gap:20px;}
.hw-form,.hw-side {background:white;border:1px solid var(--hw-edge);border-radius:12px;min-width:0;}
.hw-form-head {padding:17px 23px 13px;border-top:4px solid #226b64;border-radius:12px 12px 0 0;border-bottom:1px solid #e1e9e3;}
.hw-role {gap:5px;color:#226157;font-size:13px;font-weight:650;}
.hw-form-head h2 {font-size:24px;font-weight:700;margin:3px 0 0;line-height:1.4;}
.hw-operation {display:flex;flex-direction:column;align-items:stretch;gap:13px;padding:15px 23px 20px;}
.hw-fields,.hw-side-qty,.hw-balance {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.hw-spec,.hw-line header,.hw-data li,.hw-record,.hw-dialog-actions {display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;}
.hw-spec {background:#edf4ef;padding:9px 12px;border-radius:7px;}
.hw-spec span,.hw-line span {font-size:12px;color:var(--hw-dim);}
.hw-spec b,.hw-side h2,.hw-dialog-body h3 {font-size:15px;font-weight:680;}
.hw-readrow {gap:10px;align-items:stretch;margin-top:-7px;}
.hw-number {width:205px;background:#fff;border:2px solid #58928b;border-radius:8px;padding-right:11px;color:#516e66;}
.hw-number:focus-within {border-color:var(--hw-main); box-shadow:0 0 0 3px #dbeae4;}
.hw-number input {border:0;outline:0!important;background:transparent;font:650 24px/1.3 ui-monospace,Menlo,monospace;}
.hw-number input::placeholder {font:500 17px sans-serif;color:#78908c;}
.hw-readrow strong {align-self:center;gap:4px;font-size:14px;color:#556967;}
.hw-readrow [data-verdict="ok"] {color:#255b42;}
.hw-readrow :is([data-verdict="high"],[data-verdict="low"],[data-verdict="invalid"]) {color:#933c3e;}
.hw-gauge {width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#e9c8c3 0 25%,#a6ceba 25% 75%,#e9c8c3 75%);position:relative;}
.hw-gauge span {width:3px;height:16px;position:absolute;top:-4px;background:#263e3e;border:1px solid #143432;box-shadow:0 0 0 2px white;border-radius:3px;}
.hw-limits {display:flex;justify-content:space-between;padding:0 13%;margin-top:-9px;color:#536b65;font-size:11px;}
.hw-samples,.hw-dialog-actions {display:flex;align-items:center;flex-wrap:wrap;gap:7px;}
.hw-samples span {font-size:12px;color:#536b65;}
.hw-samples button,.hw-minor,.hw-line-action,.hw-notice button {border:1px solid #b6cec4!important;border-radius:6px;background:white!important;color:#24594f;min-height:38px;padding:5px 10px;}
.hw-samples button:hover,.hw-minor:hover,.hw-line-action:hover {background:#e5f2ea!important;}
.hw-root .hw-primary {justify-content:center;gap:10px;min-height:45px;padding:9px 15px;background:var(--hw-main);color:white;border-radius:7px;font-weight:680;font-size:14px;}
.hw-root .hw-primary:disabled {background:#e0e8e4;color:#60746b;}
.hw-primary:enabled:hover {background:#07504f;}
.hw-notice,.hw-closure {gap:8px;flex-wrap:wrap;padding:10px;background:#fff2db;color:#734d1f;border-radius:6px;font-size:13px;}
.hw-photo {gap:8px;font-size:12px;color:#456559;}
.hw-photo img {width:44px;height:32px;object-fit:cover;border-radius:4px;}
.hw-side {padding:17px;}
.hw-side-qty,.hw-balance {grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;}
.hw-side-qty>div,.hw-balance>div {padding:8px;border-radius:6px;background:#edf2ee;}
.hw-side-qty small,.hw-balance span,.hw-side-qty b,.hw-balance b,.hw-record small,.hw-events small,.hw-log small {display:block;}
.hw-side-qty b,.hw-balance b {font-size:22px;font-variant-numeric:tabular-nums;}
.hw-balance span {font-size:12px;}
.hw-balance>div:last-child {background:#dcece3;color:#1c5a46;}
.hw-events {border-left:2px solid #d6e4db;margin:16px 0 16px 4px;}
.hw-events li {position:relative;padding:0 0 12px 13px;}
.hw-events li:last-child {padding-bottom:0;}
.hw-events li::before {content:'';position:absolute;top:7px;left:-5px;width:8px;height:8px;border-radius:50%;background:#5f8d7b;}
.hw-events b {font-weight:540;font-size:13px;}
.hw-events small,.hw-log small,.hw-record small {font-size:11px;color:#587168;margin-top:2px;}
.hw-persist {margin:12px 0 0!important;font-size:11px!important;}
.hw-operation .hw-feedback {font-size:12px;}
.hw-operation .hw-feedback.error {color:#953437;}
.hw-line {border:1px solid #cbdad0;padding:12px;border-radius:8px;}
.hw-line p {margin:4px 0 8px;}
.hw-line header span {padding:2px 6px;border-radius:4px;background:#fff0d5;color:#714d1d;}
.hw-line header span.yes {background:#e0eee5;color:#20543a;}
.hw-line .hw-samples {margin-top:9px;}
.hw-closure {background:#e2f0e7;color:#245942;}
.hw-checks li {gap:6px;margin:3px 0;font-size:13px;}
.hw-checks li svg {flex-shrink:0;}
.hw-data li,.hw-record,.hw-log li {padding:7px 0;border-bottom:1px solid #e4ece6;font-size:13px;}
.hw-data b {font-variant-numeric:tabular-nums;font-weight:600;}
.hw-sign summary {font-size:12px;color:var(--hw-dim);cursor:pointer;}
.hw-dialog {border:1px solid #c0d1c6;box-shadow:0 12px 50px #15302833;border-radius:10px;padding:0;width:min(580px,94vw);max-height:84dvh;overflow:auto;color:var(--hw-ink);margin:auto;}
.hw-dialog:not([open]) {display:none;}
.hw-dialog::backdrop {background:#152b2966;}
.hw-dialog header {justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--hw-edge);background:white;position:sticky;top:0;}
.hw-dialog h2 {font-size:18px;font-weight:680;}
.hw-dialog header button {padding:8px;}
.hw-dialog-body {padding:14px 16px;}
.hw-dialog-body h3 {margin:14px 0 3px;}
.hw-dialog-body fieldset {margin:12px 0;border:1px solid var(--hw-edge);padding:10px;border-radius:7px;}
.hw-dialog-body label:has(input[type=radio]) {display:flex;gap:8px;align-items:center;min-height:38px;}
.hw-dialog-body input[type=radio] {width:auto;min-height:0;margin:0;accent-color:var(--hw-main);}
.hw-dialog .hw-record {text-align:left;width:100%;font-weight:500;}
.hw-guide {list-style:decimal;padding-left:22px!important;}
.hw-guide li {margin:0 0 11px;}
.hw-root.hw-phone {width:min(440px,100%);margin:auto;box-shadow:0 0 0 1px #bfd0c6;}
.handoff-entry-link {display:inline-flex;align-items:center;gap:5px;color:white!important;background:#145f5c!important;padding:7px 10px;min-height:34px;border-radius:6px;font-size:13px;font-weight:650;}
@container workshop (max-width:720px) {
 .hw-top {padding:5px 12px;flex-wrap:wrap;} .hw-tools {gap:0;} .hw-tools button {min-height:40px;padding:0 5px;}
 .hw-body {padding:13px 12px 30px;} .hw-orderhead h1 {font-size:24px;} .hw-steps {grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 6px;margin:12px 0;}
 .hw-steps li {min-height:28px;font-size:12px;gap:4px;} .hw-steps i {width:18px;height:18px;font-size:10px;}
 .hw-grid {grid-template-columns:minmax(0,1fr);gap:12px;} .hw-form-head {padding:11px 13px 9px;} .hw-form-head h2 {font-size:21px;}
 .hw-operation {padding:12px 13px 14px;gap:11px;} .hw-spec {padding:8px;} .hw-number{max-width:62%;}
 .hw-samples button,.hw-line-action,.hw-minor,.hw-notice button {min-height:43px;} .hw-state {font-size:11px;padding:4px 6px;}
}
@media(max-width:600px) { .hw-top .hw-view {display:none;} .tour-bar-actions .handoff-entry-link {padding:5px;font-size:12px;} .tour-bar-actions {gap:5px;} }

  if (it.nominal && it.upper && it.lower) return (it.sym || '') + it.nominal + ' ' + it.upper + '/' + it.lower;

/** 方案 → 任务快照（场景定义、标准修订、方案修订三层冻结） */
function buildSnapshot(st, plan, sceneCode) {
  const std = st.standards.find((s) => s.id === plan.stdId);
  const scene = st.scenes.find((s) => s.code === sceneCode);
  const items = std.items.filter((it) => plan.assign[it.cid] && plan.assign[it.cid] !== '-').map((it) => Object.assign(clone(it), { group: plan.assign[it.cid] }));
  return {
    scene: clone(scene), plan: { id: plan.id, code: plan.code, name: plan.name, rev: plan.rev, reportTplId: plan.reportTplId },
    std: { id: std.id, code: std.code, rev: std.rev, drawingRev: std.drawingRev, hash: std.hash }, groups: clone(plan.groups), items, frozenAt: nowISO(),
  };
}
/** 新轮次：本轮样本数只属于轮次；复检 = 新轮次（parent 指向上一轮） */
function newRound(task, no, opts) {
  opts = opts || {};
  const mg = task.snap.groups.find((g) => g.type === 'measure');
  const n = mg ? mg.n : 0;
  const samples = opts.samples || Array.from({ length: n }, (_, i) => (no > 1 ? 'R' + no + '-' : 'S') + (i + 1));
  const vals = {}, cnt = {};
  task.snap.items.forEach((it) => { if (it.group === 'M') vals[it.cid] = samples.map(() => ''); if (it.group === 'C') cnt[it.cid] = { bad: '', note: '' }; });
  return { id: 'rd-' + task.id + '-' + no, no, parent: opts.parent || null, reason: opts.reason || '', sampleMode: opts.sampleMode || 'new', ncrId: opts.ncrId || '', samples, vals, cnt, dUnits: '', photos: [], imports: [], status: 'active', submittedAt: null, signer: null, result: null, missingReason: '' };
}

/* ---------------- 判定引擎（与服务端口径一致的浏览器模拟） ----------------
 * 计量组（measurement）：逐项给出 符合 / 不符合 / 缺失，结论只覆盖本轮被检样本与项目；
 * 计数组（single_count）：证据完整且 d ≤ Ac 才接受，d ≥ Re 拒收，其余继续抽样；禁止提前接受。 */
function evalRound(task, round) {
  const res = { byCid: {}, m: { ok: 0, ng: 0, missing: 0, total: 0 }, c: null, filled: 0, total: 0, overall: 'incomplete', missingCells: [] };
  const items = task.snap.items;
  items.forEach((it) => {
    if (it.group === 'M') {
      const vals = round.vals[it.cid] || [];
      let ng = 0, miss = 0; const cells = [];
      round.samples.forEach((s, i) => {
        const st = judgeValue(vals[i], it);
        cells.push(st);
        if (st === 'missing' || st === 'invalid') { miss++; res.missingCells.push({ it, i, s, st }); } else if (st !== 'ok') ng++;
      });
      res.total += round.samples.length; res.filled += round.samples.length - miss;
      const status = ng > 0 ? 'ng' : miss > 0 ? 'missing' : 'ok';
      res.byCid[it.cid] = { status, ng, miss, cells };
      res.m.total++; res.m[status === 'ok' ? 'ok' : status === 'ng' ? 'ng' : 'missing']++;
    } else if (it.group === 'C') {
      const raw = String((round.cnt[it.cid] || {}).bad == null ? '' : round.cnt[it.cid].bad).trim();
      const filled = /^\d+$/.test(raw);
      const bad = filled ? parseInt(raw, 10) : 0;
      res.total += 1;
      if (filled) res.filled += 1; else res.missingCells.push({ it, i: -1, s: '不良数', st: raw ? 'invalid' : 'missing' });
      res.byCid[it.cid] = { status: !filled ? 'missing' : bad > 0 ? 'ng' : 'ok', bad, filled };
    }
  });
  const cg = task.snap.groups.find((g) => g.type === 'count');
  const cItems = items.filter((i) => i.group === 'C');
  if (cg && cItems.length) {
    const bads = cItems.map((i) => res.byCid[i.cid].bad);
    const allFilled = cItems.every((i) => res.byCid[i.cid].filled);
    const total = sum(bads), maxb = Math.max.apply(null, [0].concat(bads));
    const dRaw = String(round.dUnits == null ? '' : round.dUnits).trim();
    let d = total, dInvalid = '';
    if (dRaw !== '') {
      if (!/^\d+$/.test(dRaw)) dInvalid = '不良单位数须为整数';
      else {
        d = parseInt(dRaw, 10);
        if (d < maxb) dInvalid = '不良单位数不能小于单项最大不良数 ' + maxb;
        else if (d > total) dInvalid = '不良单位数不能大于各项不良数之和 ' + total;
        else if (d > cg.n) dInvalid = '不良单位数不能大于样本量 n';
      }
    }
    let result;
    if (dInvalid) result = 'continue';
    else if (d >= cg.re && (allFilled || cg.earlyReject)) result = 'reject';
    else if (allFilled) result = d <= cg.ac ? 'accept' : 'reject';
    else result = 'continue';
    res.c = { n: cg.n, ac: cg.ac, re: cg.re, aql: cg.aql, d, total, maxb, allFilled, result, dInvalid, dAuto: dRaw === '' };
  }
  const mNg = res.m.ng > 0, cRej = !!res.c && res.c.result === 'reject';
  const mMiss = res.m.missing > 0, cCont = !!res.c && res.c.result === 'continue';
  res.overall = mNg || cRej ? 'fail' : mMiss || cCont ? 'incomplete' : 'pass';
  res.progress = res.total ? res.filled / res.total : 1;
  return res;
}
function summarizeEval(ev) {
  const byCid = {};
  Object.keys(ev.byCid).forEach((k) => { const v = ev.byCid[k]; byCid[k] = { status: v.status, ng: v.ng || 0, bad: v.bad || 0 }; });
  return { overall: ev.overall, m: clone(ev.m), c: ev.c ? clone(ev.c) : null, byCid };
}

  if (!last || last.status !== 'submitted') throw new Error('上一轮尚未提交，不能发起复检');
  const reason = String(o.reason || '').trim();
  if (!reason) throw new Error('请填写复检原因');
  const hasMeasure = task.snap.groups.some((g) => g.type === 'measure');
  let samples;
  if (o.sampleMode === 'subset') {
    samples = (o.samples || []).filter((s) => last.samples.includes(s));
    if (hasMeasure && !samples.length) throw new Error('请选择要复检的原样本');
  }
  const r = newRound(task, last.no + 1, { parent: last.id, reason, sampleMode: o.sampleMode === 'subset' ? 'subset' : 'new', samples: samples && samples.length ? samples : undefined });

  const lotHits = uniq((S.lots || []).filter((l) => eq(l.lot) || eq(l.receipt) || eq(l.supplier)).map((l) => l.lot)

function scanTarget(raw) {
  let code = String(raw || '').trim();
  if (!code) return null;
  const m = /#\/scan\/([^?#\s]+)/.exec(code);
  if (m) { try { code = decodeURIComponent(m[1]); } catch (e) { code = m[1]; } } else {

/* =====================================================================

  S.tasks.forEach((t) => {

}

function inspStage(o, part, scene, pts, q) {
  const s = { key: scene, scene, label: ML_SCENE[scene] || sceneOf(scene).name, icon: SCENE_META[scene] ? SCENE_META[scene].icon : 'list', refs: {} };
  const ops = Array.from(new Set(pts.map((x) => x.key)));
  s.sub = ops.length === 1 ? ops[0] : ops.length + ' 道工序';
  if (scene === 'IQC' && ops.length === 1 && pts[0].b.note) s.sub = pts[0].b.note;
  const tasks = stageTasks(o, scene, pts);
  const reports = S.reports.filter((r) => tasks.some((t) => t.id === r.taskId));
  const ncrs = [];
  tasks.forEach((t) => ncrsOfTask(t.id).forEach((n) => { if (ncrs.indexOf(n) < 0) ncrs.push(n); }));
  Object.assign(s.refs, { tasks, reports, ncrs, points: pts });
  /* 首件按“工序 × 机台 × 触发事件”判断：开班、换型、换刀、修机后都要重新做 */
  const reqs = scene === 'FIRST' ? faiReqs(o, q) : null;
  if (reqs) s.refs.reqs = reqs;
  const hasPlan = plansFor(part.id, scene).length > 0;
  const openN = ncrs.filter((n) => n.status !== 'closed');
  const latest = (x) => x.last || null;
  const lasts = reqs ? reqs.map((r) => r.task).filter(Boolean) : pts.map(latest).filter(Boolean).concat(tasks.filter((t) => !pts.some((x) => x.last === t) && !pts.some((x) => x.tasks.indexOf(t) >= 0)).slice(0, 1));
  if (openN.length) {
    const n = openN[0], nx = nextOf('ncr', n);
    return Object.assign(s, { state: 'blocked', text: n.code + '：' + nx.text, owner: { roles: permRoles(nx.perm) }, since: n.log && n.log.length ? n.log[n.log.length - 1].at : n.createdAt, act: { label: '打开 ' + n.code, perm: nx.perm, to: '/ncr/' + n.id } });
  }
  const isLot = scene === 'FQC' || scene === 'OQC';
  const results = isLot ? tasks : lasts;
  const fail = results.find((t) => t.status === 'fail');
  if (fail) return Object.assign(s, { state: 'blocked', text: fail.code + ' 不合格：登记不合格并安排处置', owner: { roles: permRoles('ncr.create') }, since: lastDoneAt(fail), act: { label: '打开检验', perm: 'ncr.create', to: '/inspect/' + fail.id } });
  const insuf = results.find((t) => t.status === 'insufficient');
  if (insuf) return Object.assign(s, { state: 'blocked', text: insuf.code + ' 证据不足：发起补测轮次', owner: { roles: permRoles('task.retest') }, since: lastDoneAt(insuf), act: { label: '发起补测', perm: 'task.retest', to: '/inspect/' + insuf.id + '?retest=1' } });
  const rv = reports.find((r) => r.state === 'review');
  if (rv) return Object.assign(s, { state: 'active', text: '报告 ' + rv.code + ' 等待复核签批', owner: { roles: permRoles('report.review') }, since: rv.createdAt, act: { label: '去复核', perm: 'report.review', to: '/reports/' + rv.id } });
  const open = tasks.find((t) => t.status === 'active' || t.status === 'pending');
  if (open) return Object.assign(s, { state: 'active', text: (open.status === 'pending' ? '已开单 ' : '检验中 ') + open.code, owner: { uid: open.assignee, roles: permRoles('task.measure') }, since: open.createdAt, act: { label: open.status === 'pending' ? '开始检验' : '继续检验', perm: 'task.measure', to: '/inspect/' + open.id } });
  const latestDone = tasks.reduce((m, t) => { const d = lastDoneAt(t); return d > m ? d : m; }, '');
  if (reqs) {
    const need = reqs.find((r) => !r.task);
    if (need) {
      if (!hasPlan) return Object.assign(s, { state: tasks.length ? 'active' : 'todo', text: '还没有生效的' + s.label + '方案', owner: { roles: permRoles('plan.edit') }, since: latestDone || undefined, act: { label: '编制方案', perm: 'plan.edit', to: '/plans?tab=tpl' }, needPlan: true });
      return Object.assign(s, {
        state: tasks.length ? 'active' : 'todo', text: faiLabel(need) + '待检：工序 ' + need.key + (need.machine ? ' · ' + need.machine : ''), owner: { roles: permRoles('task.create') }, since: need.at || undefined,
        act: { label: '开首件', perm: 'task.create', point: pts.find((x) => x.key === need.key) || null, machine: need.machine, trigger: need.trigger, setupId: need.ev ? need.ev.id : '' },
      });
    }
    const doneAt = reqs.reduce((m, r) => { const d = passAt(r.task); return d > m ? d : m; }, '') || latestDone;
    return Object.assign(s, { state: 'done', text: reqs.length ? '首件合格：' + reqs.map((r) => (r.machine || '默认机台') + ' ' + faiLabel(r)).join('、') : '没有在生产的机台', owner: { roles: permRoles('task.create') }, doneAt });
  }
  const next = pts.find((x) => !x.last);
  if (next || (!pts.length && !tasks.length)) {
    if (!hasPlan) return Object.assign(s, { state: tasks.length ? 'active' : 'todo', text: '还没有生效的' + s.label + '方案', owner: { roles: permRoles('plan.edit') }, since: latestDone || undefined, act: { label: '编制方案', perm: 'plan.edit', to: '/plans?tab=tpl' }, needPlan: true });
    return Object.assign(s, { state: tasks.length ? 'active' : 'todo', text: (tasks.length ? '还有检验点没检：' : '待开检：') + (next ? '工序 ' + next.key + (next.b.freq ? ' · ' + next.b.freq : '') : ''), owner: { roles: permRoles('task.create') }, since: latestDone || undefined, act: { label: '开检', perm: 'task.create', point: next || null } });
  }
  if (isLot && tasks.length) {
    for (const point of pts) {
      const facts = orderLotFacts(o, scene, point.key, q);
      if (facts.remaining > 0) return Object.assign(s, {
        state: 'active', text: '已交检 ' + facts.assigned + ' 件，还有 ' + facts.remaining + ' 件待交检',
        owner: { roles: permRoles('task.create') }, since: latestDone,
        act: { label: '开下一批' + s.label, perm: 'task.create', point },
      });
    }
  }
  return Object.assign(s, { state: 'done', text: scene === 'IPQC' ? '已巡检 ' + tasks.length + ' 次，最近一次合格' : '合格' + (reports[0] ? ' · 报告 ' + reports[0].code : ''), owner: { roles: permRoles('task.create') }, doneAt: latestDone });
}

function releaseStage(o, prior, q) {
  const s = { key: 'release', label: '质量放行', sub: '放行后可以入库发货', icon: 'shield', refs: {}, checks: [] };
  const holds = orderHolds(o), openN = orderNcrs(o).filter((n) => n.status !== 'closed');
  q = q || orderQty(o);
  s.checks = prior.filter((x) => x.state !== 'na').map((x) => ({ key: x.key, stage: x.key, ok: x.state === 'done', text: x.label + (x.state === 'done' ? ' 已完成' : '：' + x.text) }))
    .concat([{ key: 'ncr', ok: !openN.length, to: openN.length ? '/ncr/' + openN[0].id : '', link: '打开不合格单', text: openN.length ? '还有 ' + openN.length + ' 张不合格（' + openN.map((n) => n.code).join('、') + '）没有关闭' : '不合格都已处置关闭' }])
    .concat([{ key: 'holds', ok: !holds.length, to: holds.length ? '/ncr/' + holds[0].ncr.id + '?show=holds' : '', link: '查看质量限制', text: holds.length ? '有效的质量限制：' + holds.map((h) => h.scopeType + ' ' + h.scopeVal + ' 禁止' + h.actions.map((a) => HOLD_ACTIONS[a]).join('、')).join('；') : '没有有效的质量限制' }])
    .concat([{ key: 'qty', ok: q.balanced, text: q.balanced ? balanceText(q) : qtyGapText(q) }]);
  const cons = orderConcessions(o);
  if (cons.length) {
    const codes = cons.map((c) => c.n.code).filter((x, i, a) => a.indexOf(x) === i);
    s.checks.push({ key: 'basis', ok: true, warn: true, text: '有让步接收 ' + sum(cons.map((c) => c.d.qty)) + ' 件（' + codes.join('、') + '）：放行时要附客户或技术批准依据' });
  }
  if (o.releasedAt) return Object.assign(s, { state: 'done', text: userName(o.releasedBy) + ' 于 ' + fmtTime(o.releasedAt) + (o.releaseKind === 'concession' ? ' 让步放行' : ' 放行'), owner: { roles: permRoles('order.release') }, doneAt: o.releasedAt });
  if (holds.length) return Object.assign(s, { state: 'blocked', text: '有质量限制，不能放行', owner: { roles: permRoles('hold.release') }, act: { label: '查看质量限制', perm: 'hold.release', to: '/ncr/' + holds[0].ncr.id } });
  const left = s.checks.filter((c) => !c.ok).length;
  if (left) return Object.assign(s, { state: 'todo', text: '还差 ' + left + ' 项才能放行', owner: { roles: permRoles('order.release') } });
  return Object.assign(s, { state: 'active', text: '全部完成，等待质量放行', owner: { roles: permRoles('order.release') }, act: { label: '质量放行', perm: 'order.release', release: true } });
}

/* ---------------- 巡检频次：每 N 小时 / 每班 / 每天 ---------------- */
function freqHours(freq) {
  const t = String(freq || '');
  let m = /每\s*(\d+(?:\.\d+)?)\s*小时/.exec(t);
  if (m) return parseFloat(m[1]);
  m = /每\s*(\d+)\s*分钟/.exec(t);
  if (m) return parseInt(m[1], 10) / 60;
  if (/每班/.test(t)) { const sh = shiftAt(); return (sh.end.getTime() - sh.start.getTime()) / 3600e3 || 8; } // 按设置的班次时长（默认两班倒，12 小时）
  if (/每天|每日/.test(t)) return 24;
  return 0;
}
function lastDoneAt(t) { const r = t.rounds[t.rounds.length - 1]; return (r && r.submittedAt) || t.createdAt; }
/** 巡检计时从哪一刻起：上次巡检和这道工序最近一次首件合格，取晚的（开班、换刀后的首件就是本班第一次检查） */
function ipqcFrom(x, reqs) {
  const fai = (reqs || []).filter((r) => r.key === x.key).reduce((m, r) => { const d = passAt(r.task); return d > m ? d : m; }, '');
  const last = x.last ? lastDoneAt(x.last) : '';
  return last > fai ? last : fai;
}
/** 生产没结束（完工检验还没完成）时，还在生产的工序巡检超过频次，就重新变成“该巡检了”；已经做完的工序不再提醒 */
function ipqcDue(o, stage, fqcDone, reqs, q) {
  if (!stage || stage.state !== 'done' || o.releasedAt || fqcDone) return;
  const now = Date.now(), part = partOf(o.partId);
  const late = stage.refs.points.map((x) => {
    const h = freqHours(x.b.freq);
    if (!h || !x.last) return null;
    const op = opByKey(part, x.key);
    if (!op || !opRunning(o, op, q)) return null;
    const due = new Date(ipqcFrom(x, reqs)).getTime() + h * 3600e3;
    return due < now ? { x, due } : null;
  }).filter(Boolean).sort((a, b) => a.due - b.due);
  if (!late.length) return;
  const f = late[0];
  const dueIso = new Date(f.due).toISOString();
  Object.assign(stage, { state: 'active', since: dueIso, text: '工序 ' + f.x.key + ' 按频次（' + f.x.b.freq + '）该巡检了，已超时 ' + waitText(dueIso) + (late.length > 1 ? '（共 ' + late.length + ' 道工序到点）' : ''), owner: { roles: permRoles('task.create') }, act: { label: '去巡检', perm: 'task.create', point: f.x } });
}
/** 质量门禁：首件合格才能批量生产（巡检、完工），完工检验合格才能出货检验 */
const ML_GATES = { IPQC: ['FIRST'], FQC: ['FIRST'], OQC: ['FQC'] };
/** 开检前的门禁：巡检按工序看这道工序在用的机台首件是否都合格；完工、出货按整个节点看 */
function gateBlocker(ml, scene, opKey) {
  if (scene === 'IPQC' && opKey) {
    const fs = ml.stages.find((s) => s.key === 'FIRST');
    const reqs = fs && fs.refs.reqs ? fs.refs.reqs.filter((r) => r.key === opKey) : [];
    const bad = reqs.find((r) => r.state !== 'done');
    if (bad) return { key: 'FIRST', label: '首件检验', text: '工序 ' + opKey + (bad.machine ? ' · ' + bad.machine : '') + ' 的' + faiLabel(bad) + (bad.task ? (bad.state === 'blocked' ? '不合格' : '还在检验中') : '还没做') };
    return null;
  }
  return (ML_GATES[scene] || []).map((k) => ml.stages.find((s) => s.key === k)).find((s) => s && s.state !== 'done' && s.state !== 'na') || null;
}
/** 等待时长：从这一步可以开始处理算起 */
function waitText(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso).getTime()) / 3600e3;
  if (h < 0) return '';
  if (h < 1) return Math.max(1, Math.round(h * 60)) + ' 分钟';
  if (h < 48) return Math.floor(h) + ' 小时';
  return Math.floor(h / 24) + ' 天';
}

/** 一张工单的主线：节点列表、当前节点（有问题的优先，否则第一个没完成的）、和“我”有关的节点 */
function mainlineOf(o) {
  shopMinute.value; // 保持打开的看板也要刷新交期、巡检和跨班首件。
  const part = partOf(o.partId);
  const pts = part.id ? orderPoints(o) : [];
  const scenes = [];
  pts.forEach((x) => { if (scenes.indexOf(x.b.scene) < 0) scenes.push(x.b.scene); });
  const qty = orderQty(o);
  const stages = [prepStage(o, part, pts)].concat(scenes.map((sc) => inspStage(o, part, sc, pts.filter((x) => x.b.scene === sc), qty)));
  const fqc = stages.find((s) => s.key === 'FQC');
  const first = stages.find((s) => s.key === 'FIRST');
  ipqcDue(o, stages.find((s) => s.key === 'IPQC'), !!fqc && fqc.state === 'done', first ? first.refs.reqs : null, qty);
  stages.push(releaseStage(o, stages.slice(), qty));
  /* 没有自己时间点的节点：从前面节点最后完成的时间算起（都没完成就从工单登记算起） */
  let upto = o.createdAt || '';
  stages.forEach((s) => {
    if (s.state !== 'done' && s.state !== 'na' && !s.since) s.since = upto;
    if (s.doneAt && s.doneAt > upto) upto = s.doneAt;
  });
  stages.forEach((s, i) => { s.no = i + 1; s.mine = s.state !== 'done' && s.state !== 'na' && !!s.act && isMineOwner(s.owner); });
  let cur = stages.findIndex((s) => s.state === 'blocked');
  if (cur < 0) cur = stages.findIndex((s) => s.state !== 'done' && s.state !== 'na');
  if (cur < 0) cur = stages.length - 1;
  /* 还没轮到的后续节点：没有开始过的显示为“未开始”，不当作当前要做的事 */
  stages.forEach((s, i) => { if (i > cur && s.state === 'todo') s.later = true; });
  const mineStages = stages.filter((s) => s.mine && !s.later);
  const doneCount = stages.filter((s) => s.state === 'done').length;
  const state = o.releasedAt ? 'released' : stages.some((s) => s.state === 'blocked') ? 'blocked' : 'active';
  const dueSoon = !o.releasedAt && !!o.due && new Date(o.due).getTime() - Date.now() < 2 * 86400e3;
  const holds = orderHolds(o);
  return { o, part, stages, cur, current: stages[cur], mine: mineStages, doneCount, state, dueSoon, holds, shipHolds: holds.filter((h) => h.actions.indexOf('ship') >= 0), ncrs: orderNcrs(o), qty };
}
const ORDER_ML_STATE = { released: ['已放行', 'chip-green'], blocked: ['有问题', 'chip-red'], active: ['进行中', 'chip-blue'] };

function dispatchStatus(m) {
  if (m.shipHolds.length) return ['禁止发运', 'chip-red'];
  if (m.state === 'released') return orderShipped(m.o) ? ['已发货', 'chip-gray'] : ['已放行，可以发货', 'chip-green'];
  if (m.holds.length) return ['质量受限', 'chip-red'];
  if (m.current.key === 'release' && m.current.state === 'active') return ['待放行', 'chip-amber'];
  return m.state === 'blocked' ? ['需要处理', 'chip-amber'] : ORDER_ML_STATE.active;
}
function dispatchOwner(m) {
  if (m.shipHolds.length && m.state === 'released') return ownerText({ roles: permRoles('hold.release') });
  if (m.state === 'released') return orderShipped(m.o) ? '已交付' : ROLES.wh.name;
  return ownerText(m.current.owner) || '待安排';
}

/** 门禁提示：前置检验没合格时开检要确认（例外留给人判断，例如试制、补录） */
async function gateConfirm(o, scene, x) {
  const b = gateBlocker(mainlineOf(o), scene, x && x.key);
  if (!b) return true;
  const rule = b.key === 'FIRST' ? '首件检验合格后才能批量生产' : '完工检验合格后才能做出货检验、发货';
  return confirmBox({ title: '「' + b.label + '」还没合格', message: b.label + '：' + b.text + '\n现场规则：' + rule + '。\n确实要先开' + (ML_SCENE[scene] || '检') + '吗？（例如试制、补录）', ok: '仍要开检', danger: true });
}

/** 节点上的按钮：跳转 / 在工序检验点上开检 / 放行 */
async function runStageAct(o, s) {
  const a = s && s.act;
  if (!a) return;
  if (a.perm && !can(a.perm)) { toast(denyTip(a.perm), 'warn'); return; }
  if (a.to) { go(a.to); return; }
  if (a.release) { UI.release = o.id; return; }
  if (s.scene) {
    const x = a.point || orderPoints(o).find((p) => p.b.scene === s.scene && !p.last) || null;
    if (!(await gateConfirm(o, s.scene, x))) return;
    if (x) startPoint(o, x, a.machine ? { machine: a.machine, trigger: a.trigger, setupId: a.setupId } : null);
    else if (s.scene === 'FQC' || s.scene === 'OQC') UI.orderLot = { orderId: o.id, scene: s.scene, op: '', workId: '' };
    else UI.newTask = { scene: s.scene, partId: o.partId, ctx: { wo: o.wo } };
  }
}
/** 演示用：不是当前身份的事，一键切换到能做这一步的人 */
function stageOwnerUser(s) {
  if (!s || !s.owner) return null;

/* ---------------- 主线条：从左到右的节点 ---------------- */
// 回执只引用本工单的既有记录；刷新、回退、切换岗位都不会重放写操作。
function showReceipt(o, kind, record) {

;
function nextOf(kind, x) {

    if (x.status === 'review') return { text: '审核后批准生效，或退回修改（提交人本人不能批准）', perm: 'std.approve', hint: '右上角“批准生效”' };
    if (x.status === 'effective') {

        <details v-if="isReading || supplied || isReview" class="hw-sign"><summary @click="signPad=true">本次使用岗位示例签名 · 可手写演示签名</summary><signature-pad v-if="signPad" v-model="h.signature" :height="95" :signer="roleName"/></details>
        <p v-if="warn || validation" class="hw-feedback" :class="{error:warn}" aria-live="polite">{{ warn || validation }}</p>
        <button v-if="phase!=='done'" class="hw-primary" data-live-submit type="submit" :disabled="!!validation || busy">{{ meta[3] }}<ic name="arrow-right" :size="17"/></button>
        <button v-else class="hw-primary" type="button" @click="show('records')">查看本次演示记录<ic name="arrow-right" :size="17"/></button>
      </form></section>
      <aside class="hw-side"><h2>工单记录</h2><div class="hw-side-qty"><div><small>投产</small><b>{{ ledger?.input || 0 }}</b></div><div><small>入库合格</small><b>{{ ledger?.stocked || 0 }}</b></div><div><small>报废</small><b>{{ ledger?.scrap || 0 }}</b></div></div><ul class="hw-events"><li v-for="(e,i) in h.events.slice(0,3)" :key="i"><b>{{ e.text }}</b><small>{{ userName(e.by) }} · {{ fmtTime(e.at) }}</small></li></ul><button type="button" class="hw-minor" @click="show('records')">查看全部记录及报告（{{ visibleReports.length }}）</button><p class="hw-persist">{{ saved?'进度保存在当前浏览器标签页。':'浏览器存储不可用，请保持当前页面打开。' }}</p></aside>
    </div></main>
  <dialog class="hw-dialog" ref="dialog" @close="pane=''" @click.self="dismiss"><header><h2>{{ {guide:'现场讲解卡',restart:'重新开始本次演示',records:'本张工单的记录',report:'检验报告'}[pane] }}</h2><button type="button" aria-label="关闭" @click="dismiss"><ic name="x" :size="18"/></button></header><div class="hw-dialog-body">
    <template v-if="pane==='guide'"><ol class="hw-guide"><li><b>试一个超差读数</b><p>输入 20.12 mm，添加示例照片，再提交巡检。改填 20.00 mm 可以走合格路径。</p></li><li><b>看 8 件不良品的去向</b><p>返工 5 件、报废 3 件。先只批准报废，观察另一项仍待批准。分别登记执行凭据。</p></li><li><b>把处置结果带回工单</b><p>复检填 20.00 mm。验证关闭后解除限制，再报工并做完工检验。</p></li><li><b>试分批交检与放行</b><p>默认合格 205 件，首批交检 100 件。下一批试填 106，再改为剩余的 105 件。复核报告后确认放行。</p></li></ol><p>「重新演示」可从工单登记开始。岗位按环节切换，样例记录仅用于演示。</p></template>
    <template v-if="pane==='restart'"><p>重新开始将替换本标签页里的这场模拟记录。</p><fieldset><legend>选择起点</legend><label><input type="radio" v-model="resetStart" value="patrol"> 从精车巡检开始</label><label><input type="radio" v-model="resetStart" value="create"> 从工单登记开始</label></fieldset><div class="hw-dialog-actions"><button type="button" class="hw-minor" @click="dismiss">保留进度</button><button type="button" class="hw-primary" @click="restart">开始新一场演示</button></div></template>
    <template v-if="pane==='records'"><b>{{ order?.wo || '待建工单' }}</b><h3>检验报告</h3><p v-if="!visibleReports.length">提交检验后，报告会出现在这里。</p><button v-for="r in visibleReports" :key="r.id" type="button" class="hw-record" @click="show('report',r.id)"><span>{{ r.content.task.sceneName }} · 第 {{ r.content.round.no }} 轮<small>{{ r.code }}</small></span><b>{{ r.content.result.overall==='pass'?'符合':'不符合' }} · {{ reviewState[r.state] }}</b></button><h3>交接记录</h3><ol class="hw-log"><li v-for="(e,i) in h.events" :key="i">{{ e.text }}<small>{{ fmtTime(e.at) }} · {{ userName(e.by) }}</small></li></ol><template v-if="ncrNotes.length"><h3>处置记录</h3><ol class="hw-log"><li v-for="(e,i) in ncrNotes" :key="i">{{ e.text }}<small>{{ userName(e.by) }}</small></li></ol></template></template>
    <template v-if="pane==='report' && picked"><p>{{ picked.code }}</p><h3>{{ picked.content.task.sceneName }} · 第 {{ picked.content.round.no }} 轮 · {{ picked.content.result.overall==='pass'?'符合':'不符合' }}</h3><p>{{ picked.content.task.ctx.wo }} · {{ picked.content.task.ctx.op }} · {{ reviewState[picked.state] }}</p><ul class="hw-data"><li v-for="it in picked.content.items" :key="it.cid"><span>{{ it.name }}</span><b>{{ it.group==='M'?picked.content.round.vals[it.cid].join(' / ')+' '+it.unit:'不良 '+picked.content.round.cnt[it.cid].bad+' 件' }}</b></li></ul><p>证据照片 {{ picked.content.round.photoCount }} 张 · {{ picked.sigs.map(s=>s.kind+' '+s.name).join(' / ') }}</p><button type="button" class="hw-minor" @click="show('records')">返回工单记录</button></template>
  </div></dialog>
</div>`,
};

;
const app=createApp(COMPONENTS['handoff-workshop']);app.component('ic',COMPONENTS.ic);app.component('signature-pad',COMPONENTS['signature-pad']);app.mount('#app');
})();</script></body></html>
